<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--verd:#2f6b3a;--pista:#2c5f9e;--linia:#f4f4ee;--groc:#d9f03a;--tinta:#1d2733;--paper:#fbfaf4;--bo:#1f8a4c;--mal:#c8412f;--suau:#5d6b7a}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--verd);color:var(--tinta);overflow-x:hidden;font-size:17px;line-height:1.4}
#fons{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#fons svg{height:100%;max-width:100%}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100%;padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px}
.carta{background:var(--paper);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
h1{font-size:34px;text-shadow:0 2px 6px rgba(0,0,0,.6);line-height:1.05;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.5px}
h1 small{display:block;font-size:15px;font-weight:500;opacity:.9;letter-spacing:0;margin-top:6px}
h2{font-size:21px;margin-bottom:8px}
h3{font-size:17px;margin:12px 0 6px}
p{margin:6px 0}
.cap{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-top:6px}
.idioma{background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:10px;padding:6px 12px;font-weight:700;font-size:16px}
button{font:inherit;cursor:pointer;border:0}
.bloc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border-radius:14px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.2);color:var(--tinta)}
.bloc .ic{width:46px;height:46px;border-radius:50%;background:var(--groc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.bloc b{display:block;font-size:17px}
.bloc span.sub{font-size:14px;color:var(--suau)}
.bloc .rec{margin-left:auto;font-size:13px;color:var(--bo);font-weight:700;white-space:nowrap}
.gran{display:block;width:100%;background:var(--groc);color:var(--tinta);font-weight:800;font-size:18px;padding:14px;border-radius:14px;box-shadow:0 4px 0 #a9bd22}
.gran:active{transform:translateY(2px);box-shadow:0 2px 0 #a9bd22}
.sec{display:block;width:100%;background:rgba(16,24,32,.55);color:#fff;border:2px solid rgba(255,255,255,.7);font-weight:700;padding:11px;border-radius:14px}
.carta .sec{color:var(--tinta);border-color:#c9ccd1}
.fila{display:flex;gap:10px}
.fila>*{flex:1}
.marcador{display:grid;grid-template-columns:1fr auto auto;background:#101820;color:#fff;border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.marcador div{padding:7px 12px;font-weight:700}
.marcador .nom{display:flex;align-items:center;gap:8px}
.marcador .nom i{width:9px;height:9px;border-radius:50%;background:var(--groc);visibility:hidden}
.marcador .nom i.s{visibility:visible}
.marcador .jocs{background:#26313d;text-align:center;min-width:40px}
.marcador .pts{background:var(--groc);color:#101820;text-align:center;min-width:64px}
.marcador .sep{grid-column:1/-1;height:1px;background:#2d3946;padding:0}
.barra{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:14px}
.barra button{background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px}
.enun{font-size:18px}
.fig{display:flex;justify-content:center;margin:10px 0 4px}
.fig svg{max-width:100%;height:auto}
.dades{background:#eef2e4;border-radius:10px;padding:8px 10px;font-size:15px;margin-top:8px}
.calc{font-size:13px;color:var(--suau);margin-top:6px}
.opcions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.op{background:#fff;border:2px solid #d6d9de;border-radius:12px;padding:12px 6px;font-size:19px;font-weight:700;min-height:62px;display:flex;align-items:center;justify-content:center;color:var(--tinta)}
.op:active{background:#f3f6e0}
.op.bo{border-color:var(--bo);background:#e3f4ea}
.op.mal{border-color:var(--mal);background:#fbe6e2}
.op[disabled]{opacity:1}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.ull{border-left:6px solid var(--mal)}
.ull.ok{border-left-color:var(--bo)}
.ull h2{display:flex;align-items:center;gap:8px}
.etiq{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mal)}
.ull.ok .etiq{color:var(--bo)}
.error{background:#fbe6e2;border-radius:10px;padding:10px;margin:8px 0}
.passos{counter-reset:p;list-style:none;margin:6px 0}
.passos li{counter-increment:p;position:relative;padding:6px 0 6px 34px;border-bottom:1px dashed #d8dbe0}
.passos li:last-child{border-bottom:0}
.passos li::before{content:counter(p);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--pista);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.exemple{background:#eef2e4;border-radius:12px;padding:10px 12px;margin:10px 0}
.exemple .etq{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--verd)}
.taula{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px;text-align:center}
.taula td,.taula th{border:1px solid #d6d9de;padding:6px 4px}
.taula th{background:#eef2e4}
.punts{display:flex;justify-content:center;gap:6px;margin-top:10px}
.punts i{width:8px;height:8px;border-radius:50%;background:#c9ccd1}
.punts i.on{background:var(--pista)}
.res{text-align:center}
.res .gros{font-size:44px;font-weight:900;margin:6px 0}
.pilota{position:fixed;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4ff7a,#c8de1c 60%,#9fb20f);z-index:5;pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.anim-a{animation:anA .7s ease-in forwards}
.anim-b{animation:anB .7s ease-in forwards}
@keyframes anA{from{left:50%;top:85%;transform:scale(1)}50%{transform:scale(1.6)}to{left:62%;top:4%;transform:scale(.7)}}
@keyframes anB{from{left:45%;top:2%;transform:scale(.7)}50%{transform:scale(1.5)}to{left:30%;top:95%;transform:scale(1)}}
.aviso{text-align:center;color:#fff;font-weight:800;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.3);min-height:30px}
.ruff{border-collapse:collapse;margin:12px auto 4px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.ruff td{min-width:44px;height:40px;text-align:center;padding:0 4px}.ruff td.esq{border-right:3px solid var(--tinta);color:var(--pista)}.ruff tr.lin td{border-top:3px solid var(--tinta)}.ruff tr.lin td.esq{border-top:0}.ruff td.resid{outline:2px solid var(--suau);outline-offset:-4px;border-radius:6px}.ruff td.cur{background:var(--groc);border-radius:8px}.ruff td.mal{background:#fbe6e2;color:var(--mal);border-radius:8px}.pas{font-size:14px;color:var(--suau);text-align:center}
.secc{margin:10px 0 4px}.secc-t{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--pista)}.perque{font-size:14px;color:var(--suau);background:#eef0f6;border-radius:8px;padding:6px 8px;margin:6px 0}.pistab{background:#fff6c9;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:15px}.ajuda{background:none;color:var(--pista);font-weight:700;font-size:15px;margin-top:10px;padding:4px 0}
.peu{color:#fff;font-size:13px;text-align:center;background:rgba(0,0,0,.35);border-radius:10px;padding:6px}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
let LANG='va';
try{const l=localStorage.getItem('trigo-idioma');if(l==='es'||l==='va')LANG=l}catch(e){}
const t=(va,es)=>LANG==='va'?va:es;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const num=(x,d=2)=>{let s=(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s.replace('.',',')};
const SN=()=>t('sin','sen');
const FN=f=>f==='sin'?SN():f;
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const tv=a=>({s:Math.round(Math.sin(rad(a))*100)/100,c:Math.round(Math.cos(rad(a))*100)/100,t:Math.round(Math.tan(rad(a))*100)/100});
const op=(h,k,why)=>({h,k:String(k),why});
const nop=(x,u,why,d=2)=>op(num(x,d)+(u?' '+u:''),num(x,d),why);

function pf(n,d){const g=gcd(n,d);const p=n/g,q=d/g;const top=p===1?'π':p+'π';return op(q===1?top:F(top,q),p+'/'+q)}

function triSVG(o){
const A=[30,150],B=[230,150],C=[230,40];
const st='stroke="#1d2733" stroke-width="3" fill="#dbe7f5"';
let s=`<svg viewBox="0 0 320 190" width="320" height="190" font-family="system-ui,sans-serif" font-size="18" font-weight="700"><polygon points="${A} ${B} ${C}" ${st}/><polyline points="214,150 214,134 230,134" fill="none" stroke="#1d2733" stroke-width="2"/>`;
if(o.at==='left')s+=`<path d="M70,150 A40,40 0 0 0 66.5,133" fill="none" stroke="#c8412f" stroke-width="3"/><text x="78" y="143" fill="#c8412f">${o.ang||'α'}</text>`;
else s+=`<path d="M230,74 A34,34 0 0 1 199,55.5" fill="none" stroke="#c8412f" stroke-width="3"/><text x="203" y="84" fill="#c8412f">${o.ang||'α'}</text>`;
if(o.base!=null)s+=`<text x="130" y="176" text-anchor="middle">${o.base}</text>`;
if(o.vert!=null)s+=`<text x="242" y="101">${o.vert}</text>`;
if(o.hip!=null)s+=`<text x="118" y="84" text-anchor="end">${o.hip}</text>`;
return s+'</svg>';
}
function pistaSVG(o){
let s=`<svg viewBox="0 0 300 190" width="300" height="190" font-family="system-ui,sans-serif" font-size="16" font-weight="700"><rect x="40" y="20" width="220" height="120" fill="#2c5f9e" stroke="#f4f4ee" stroke-width="3"/><line x1="150" y1="14" x2="150" y2="146" stroke="#f4f4ee" stroke-width="3" stroke-dasharray="4 3"/>`;
const x2=o.mitat?150:260;
s+=`<line x1="40" y1="140" x2="${x2}" y2="20" stroke="#d9f03a" stroke-width="4"/>`;
if(o.angle)s+=`<path d="M90,140 A50,50 0 0 0 ${40+50*Math.cos(Math.atan2(120,x2-40))},${140-50*Math.sin(Math.atan2(120,x2-40))}" fill="none" stroke="#c8412f" stroke-width="3"/><text x="96" y="128" fill="#fff">θ</text>`;
s+=`<text x="${(40+x2)/2}" y="164" text-anchor="middle">${o.llarg}</text><text x="${x2+8}" y="86" ${x2===260?'':'fill="#fff"'}>${o.ample}</text>`;
if(o.diag)s+=`<text x="${(40+x2)/2-14}" y="72" text-anchor="end" fill="#fff">${o.diag}</text>`;
return s+'</svg>';
}
function xarxaSVG(H,D,e){
const x0=30,x1=280,sc=(x1-x0)/D,y0=160,hs=110/H;
const xn=x0+12*sc;
let s=`<svg viewBox="0 0 300 200" width="300" height="200" font-family="system-ui,sans-serif" font-size="15" font-weight="700"><line x1="10" y1="${y0}" x2="292" y2="${y0}" stroke="#1d2733" stroke-width="3"/>`;
s+=`<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0-H*hs}" stroke="#1d2733" stroke-width="2" stroke-dasharray="4 3"/>`;
s+=`<line x1="${x0}" y1="${y0-H*hs}" x2="${x1}" y2="${y0}" stroke="#b9cd1a" stroke-width="3"/><circle cx="${x0}" cy="${y0-H*hs}" r="6" fill="#d9f03a" stroke="#1d2733"/>`;
s+=`<line x1="${xn}" y1="${y0}" x2="${xn}" y2="${y0-0.91*hs}" stroke="#5d6b7a" stroke-width="5"/>`;
s+=`<line x1="${xn}" y1="${y0}" x2="${xn}" y2="${y0-H*e/D*hs}" stroke="#c8412f" stroke-width="2" stroke-dasharray="3 3"/>`;
s+=`<text x="${x0+6}" y="${y0-H*hs/2}">${num(H)} m</text><text x="${xn+6}" y="${y0-H*e/D*hs-8}" fill="#c8412f">h?</text>`;
s+=`<text x="${(x0+xn)/2}" y="${y0+20}" text-anchor="middle">12 m</text><text x="${(xn+x1)/2}" y="${y0+20}" text-anchor="middle">${num(e)} m</text>`;
s+=`<text x="${xn}" y="${y0+38}" text-anchor="middle" font-size="12" fill="#5d6b7a">${t('xarxa','red')}</text>`;
return s+'</svg>';
}
function ombraSVG(h,s1,H,s2){
let s=`<svg viewBox="0 0 300 180" width="300" height="180" font-family="system-ui,sans-serif" font-size="15" font-weight="700"><line x1="5" y1="150" x2="295" y2="150" stroke="#1d2733" stroke-width="2"/>`;
s+=`<polygon points="20,150 20,110 60,150" fill="#dbe7f5" stroke="#1d2733" stroke-width="2"/><text x="24" y="104">${num(h)} m</text><text x="40" y="170" text-anchor="middle">${num(s1)} m</text>`;
s+=`<polygon points="120,150 120,30 270,150" fill="#dbe7f5" stroke="#1d2733" stroke-width="2"/><text x="126" y="26" fill="#c8412f">H?</text><text x="195" y="170" text-anchor="middle">${num(s2)} m</text>`;
s+=`<circle cx="280" cy="24" r="12" fill="#f3c33a"/>`;
return s+'</svg>';
}

const BLOCS=[
{id:'ruffini',ic:'÷',nom:()=>t('Ruffini i equacions','Ruffini y ecuaciones'),sub:()=>t('Divisió, residu i factors','División, resto y factores'),gens:['taula','residu','taula','candidats','factor','equacio']},
{id:'angles',ic:'°',nom:()=>t('Mesura d\'angles','Medida de ángulos'),sub:()=>t('Graus, minuts i radians','Grados, minutos y radianes'),gens:['deg2rad','rad2deg','dec2sex','resta']},
{id:'raons',ic:'α',nom:()=>t('Raons trigonomètriques','Razones trigonométricas'),sub:()=>t(SN()+', cos i tan',SN()+', cos y tan'),gens:['raó','hip','ident','notable']},
{id:'resol',ic:'△',nom:()=>t('Resoldre triangles','Resolver triángulos'),sub:()=>t('Problemes de pista','Problemas de pista'),gens:['diag','creuat','altura','escala']},
{id:'sembl',ic:'≈',nom:()=>t('Semblança','Semejanza'),sub:()=>t('Tales, ombres i escales','Tales, sombras y escalas'),gens:['ombra','raok','xarxa']}
];

const G={};
const DEGS=[30,45,60,90,120,135,150,180,210,225,240,270,300,315,330,360];

G.deg2rad=()=>{
const d=pick(DEGS);const ans=pf(d,180);const g=gcd(d,180);
return{q:t(`Passa <b>${d}°</b> a radians.`,`Pasa <b>${d}°</b> a radianes.`),ans,
wrong:[{...pf(d,360),why:t('Has fet servir 360° = π rad. Però mitja volta (180°) és π rad, i la volta sencera és 2π.','Has usado 360° = π rad. Pero media vuelta (180°) es π rad, y la vuelta entera es 2π.')},
{...pf(180,d),why:t('Has girat la fracció. De graus a radians es multiplica per π/180: els graus van dalt.','Has dado la vuelta a la fracción. De grados a radianes se multiplica por π/180: los grados van arriba.')},
{...pf(d,90),why:t('Has fet servir 90° = π rad. Recorda: 180° = π rad.','Has usado 90° = π rad. Recuerda: 180° = π rad.')},
{...pf(d===360?330:d+30,180),why:t('Revisa la simplificació de la fracció.','Revisa la simplificación de la fracción.')}],
sol:[t(`Recorda: 180° = π rad. Multiplica per ${F('π','180')}.`,`Recuerda: 180° = π rad. Multiplica por ${F('π','180')}.`),
`${d} · ${F('π','180')} = ${F(d+'π','180')}`,
t(`Simplifica dividint entre ${g}: <b>${ans.h} rad</b>`,`Simplifica dividiendo entre ${g}: <b>${ans.h} rad</b>`)]};
};
G.rad2deg=()=>{
const d=pick(DEGS);const r=pf(d,180);const [p,q]=r.k.split('/').map(Number);
const inv=180*q/p;
return{q:t(`Passa <b>${r.h} rad</b> a graus.`,`Pasa <b>${r.h} rad</b> a grados.`),ans:op(d+'°',d),
wrong:[op(2*d+'°',2*d,t('Has fet π = 360°. Però π rad és mitja volta: 180°.','Has hecho π = 360°. Pero π rad es media vuelta: 180°.')),
op(num(d/2)+'°',num(d/2),t('Has fet π = 90°. Recorda: π rad = 180°.','Has hecho π = 90°. Recuerda: π rad = 180°.')),
op(num(inv)+'°',num(inv),t('Has girat la fracció. Només cal canviar π per 180°.','Has dado la vuelta a la fracción. Solo hay que cambiar π por 180°.')),
op((d===360?330:d+30)+'°',d===360?330:d+30,t('Revisa el càlcul: canvia π per 180° i opera.','Revisa el cálculo: cambia π por 180° y opera.')),
op((d-15)+'°',d-15,t('Revisa el càlcul: canvia π per 180° i opera.','Revisa el cálculo: cambia π por 180° y opera.'))],
sol:[t('Canvia π per 180°.','Cambia π por 180°.'),
q===1?`${p===1?'':p+' · '}180° = <b>${d}°</b>`:`${F((p===1?'':p+' · ')+'180°',q)} = ${F(p*180+'°',q)} = <b>${d}°</b>`]};
};
G.dec2sex=()=>{
const A=R(12,78);const m=pick([6,9,12,15,18,24,27,36,42,45,48,51,54]);const dec=m/60;const decs=num(dec,2).split(',')[1];
const x=num(A+dec,2);
return{q:t(`Escriu <b>${x}°</b> en graus i minuts.`,`Escribe <b>${x}°</b> en grados y minutos.`),ans:op(`${A}° ${m}'`,`${A}-${m}`),
wrong:[op(`${A}° ${decs.length===1?decs+'0':decs}'`,`${A}-${Number(decs.length===1?decs+'0':decs)}`,t(`Has copiat els decimals com si foren minuts. Però 1° té 60', no 100': cal multiplicar 0,${decs} per 60.`,`Has copiado los decimales como si fueran minutos. Pero 1° tiene 60', no 100': hay que multiplicar 0,${decs} por 60.`)),
op(`${A}° ${m}''`,`${A}-s${m}`,t(`Els ${m} són minuts ('), no segons ('').`,`Los ${m} son minutos ('), no segundos ('').`)),
op(`${A+1}° ${60-m}'`,`${A+1}-${60-m}`,t('Has arrodonit cap amunt. La part sencera es queda igual: només es transformen els decimals.','Has redondeado hacia arriba. La parte entera se queda igual: solo se transforman los decimales.'))],
sol:[t(`La part sencera són els graus: <b>${A}°</b>`,`La parte entera son los grados: <b>${A}°</b>`),
t(`Els decimals × 60 donen els minuts: 0,${decs} · 60 = <b>${m}'</b>`,`Los decimales × 60 dan los minutos: 0,${decs} · 60 = <b>${m}'</b>`),
`${x}° = <b>${A}° ${m}'</b>`]};
};
G.resta=()=>{
const sup=Math.random()<.5;const T=sup?180:90;const A=R(12,sup?150:78);const B=pick([12,18,24,25,35,36,42,47,48,53]);

$('#app').innerHTML=`<div class="barra"><button id="tor">← ${enPartit?t('Tornar al partit','Volver al partido'):t('Blocs','Bloques')}</button><span>${pag===0?t('Abans de començar','Antes de empezar'):t('Escalfament','Calentamiento')} · ${pag+1}/${P.length}</span></div>
<div class="carta"><h2>${p.h}</h2>${p.b}<div class="punts">${P.map((_,i)=>`<i class="${i===pag?'on':''}"></i>`).join('')}</div></div>
<div class="fila">${pag>0?`<button class="sec" id="ant">← ${t('Anterior','Anterior')}</button>`:''}${pag<P.length-1?`<button class="gran" id="seg">${t('Següent','Siguiente')} →</button>`:(enPartit?`<button class="gran" id="seg">${t('Tornar al partit','Volver al partido')}</button>`:`<button class="gran" id="seg">🎾 ${t('Jugar el partit','Jugar el partido')}</button>`)}</div>`;
$('#tor').onclick=()=>enPartit?pregunta(true):inici();
if($('#ant'))$('#ant').onclick=()=>teoria(B,pag-1,enPartit);
$('#seg').onclick=()=>pag<P.length-1?teoria(B,pag+1,enPartit):(enPartit?pregunta(true):partit(B));
scrollTo(0,0);
}

function partit(B){
S={B,pt:[0,0],jc:[0,0],ult:null,q:null,encerts:0,total:0,errors:{},ratxa:0,millor:0,pistes:0};
try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:'jugar/mathpoint',title:'Jugar Math Point',event:true})}catch(e){}
nova();
}
function nova(){
const fl=flojos();const gs=S.B.gens.filter(x=>x!==S.ult);let tot=0;const pes=gs.map(x=>{const w=1+(fl[x]||0)/2;tot+=w;return w});let u=Math.random()*tot,g=gs[gs.length-1];for(let j=0;j<gs.length;j++){u-=pes[j];if(u<0){g=gs[j];break}}S.ult=g;
const Q=G[g]();Q.gen=g;
if(Q.steps){Q.pas=0;Q.vis={r0:true};const st=Q.steps[0];Q.ops=montaOps(st.ans,st.wrong)}else Q.ops=montaOps(Q.ans,Q.wrong);
S.q=Q;pregunta(false);
}
function flojos(){try{return JSON.parse(localStorage.getItem('mp-flojos')||'{}')}catch(e){return{}}}
function anota(g,ok){try{const f=flojos();f[g]=Math.max(0,Math.min(6,(f[g]||0)+(ok?-1:2)));localStorage.setItem('mp-flojos',JSON.stringify(f))}catch(e){}}
function pistaTxt(Q){if(Q.steps){const k=Q.steps[Q.pas].k;const a=Q.taula.a;
if(k==='a')return t(`Quin valor de x fa que ${divi(a)} siga 0?`,`¿Qué valor de x hace que ${divi(a)} sea 0?`);
if(k[0]==='p')return t(`Multiplica el número de baix de la columna anterior pel de l'esquerra (${MN(a)}).`,`Multiplica el número de abajo de la columna anterior por el de la izquierda (${MN(a)}).`);
return t('Suma els dos números de la columna.','Suma los dos números de la columna.')}
return Q.sol[0]}
function montaOps(ans,wrong){const seen=new Set([ans.k]);const w=[];
for(const o of wrong){if(!seen.has(o.k)&&o.h!==ans.h){seen.add(o.k);w.push(o)}if(w.length===3)break}
return shuffle([{...ans,ok:true},...w])}
function txtPunts(){
const [a,b]=S.pt;const N=['0','15','30','40'];
if(a>=3&&b>=3){if(a===b)return[t('Iguals','Iguales'),''];return a>b?[t('Avant.','Vent.'),'']:['',t('Avant.','Vent.')]}
return[N[a],N[b]];
}
function marcador(){
const [pa,pb]=txtPunts();
return`<div class="marcador"><div class="nom"><i class="s"></i>${t('Tu','Tú')}</div><div class="jocs">${S.jc[0]}</div><div class="pts">${pa}</div><div class="sep"></div><div class="nom"><i></i>${t('La màquina','La máquina')}</div><div class="jocs">${S.jc[1]}</div><div class="pts">${pb}</div></div>`;
}
function pregunta(tornant){
const Q=S.q;
$('#app').innerHTML=`<div class="barra"><button id="ix">✕</button><span>${S.B.nom()}</span><button id="te">📖 ${t('Teoria','Teoría')}</button></div>${marcador()}
<div class="aviso" id="av"></div>
<div class="carta"><div class="enun">${Q.q}</div>${Q.fig?`<div class="fig">${Q.fig}</div>`:''}${Q.taula?taulaHTML(Q.taula,Q.vis,Q.steps[Q.pas].k,null)+`<div class="pas">${t('Què va en la casella groga?','¿Qué va en la casilla amarilla?')}</div>`:''}${Q.dades?`<div class="dades">${t('Dades','Datos')}: ${Q.dades}</div>`:''}${Q.calc?`<div class="calc">🧮 ${t('Pots fer servir la calculadora.','Puedes usar la calculadora.')}</div>`:''}
<div class="opcions">${Q.ops.map((o,i)=>`<button class="op" data-i="${i}">${o.h}</button>`).join('')}</div><div id="pz">${Q.pistaVista===Q.pas?`<div class="pistab">💡 ${pistaTxt(Q)}</div>`:`<button class="ajuda" id="pb">💡 ${t('Pista','Pista')}</button>`}</div></div>`;
if($('#pb'))$('#pb').onclick=()=>{Q.pistaVista=Q.pas;S.pistes++;$('#pz').innerHTML=`<div class="pistab">💡 ${pistaTxt(Q)}</div>`};
$('#ix').onclick=inici;
$('#te').onclick=()=>teoria(S.B,0,true);
document.querySelectorAll('.op').forEach(b=>b.onclick=()=>respon(+b.dataset.i));
if(!tornant)scrollTo(0,0);
}
function pilota(cl){const b=document.createElement('div');b.className='pilota '+cl;document.body.appendChild(b);setTimeout(()=>b.remove(),800)}
function respon(i){
const Q=S.q;const o=Q.ops[i];
if(Q.steps&&o.ok&&Q.pas<Q.steps.length-1){Q.vis[Q.steps[Q.pas].k]=true;Q.pas++;const st=Q.steps[Q.pas];Q.ops=montaOps(st.ans,st.wrong);pregunta(true);return}
if(Q.steps){if(o.ok)Q.steps.forEach(x=>Q.vis[x.k]=true);else Q.mal=Q.steps[Q.pas].k}
S.total++;
document.querySelectorAll('.op').forEach((b,j)=>{b.disabled=true;if(Q.ops[j].ok)b.classList.add('bo');else if(j===i)b.classList.add('mal')});
const qui=o.ok?0:1;if(o.ok){S.encerts++;S.ratxa++;S.millor=Math.max(S.millor,S.ratxa)}else{S.errors[Q.gen]=(S.errors[Q.gen]||0)+1;S.ratxa=0}anota(Q.gen,o.ok);
S.pt[qui]++;
let joc=null;
if(S.pt[qui]>=4&&S.pt[qui]-S.pt[1-qui]>=2){S.jc[qui]++;S.pt=[0,0];joc=qui}
pilota(o.ok?'anim-a':'anim-b');
const av=$('#av');
if(o.ok){
av.textContent=joc===0?t('Joc per a tu!','¡Juego para ti!'):[3,5,8,12].includes(S.ratxa)?t(`${S.ratxa} seguits! 🔥`,`¡${S.ratxa} seguidos! 🔥`):pick([t('Punt!','¡Punto!'),t('Directe!','¡Directo!'),t('Ben jugat!','¡Bien jugado!'),'Ace!']);
setTimeout(()=>{if(S.jc[0]>=2)final();else nova()},joc===0?1300:850);
}else{
av.textContent=joc===1?t('Joc per a la màquina','Juego para la máquina'):t('Fora!','¡Fuera!');
setTimeout(()=>ull(o),700);
}
}
function ull(o){
const Q=S.q;
$('#app').innerHTML=`<div class="barra"><span></span><span>${S.B.nom()}</span><span></span></div>${marcador()}
<div class="carta ull"><div class="etiq">${t('Ull de falcó','Ojo de halcón')}</div><h2>${t('Has triat','Has elegido')} ${o.h}</h2>
<div class="error">${o.why}</div>
<div class="enun" style="font-size:16px;color:#5d6b7a">${Q.q}</div>${Q.fig?`<div class="fig">${Q.fig}</div>`:''}${Q.taula?taulaHTML(Q.taula,Object.fromEntries(['a',...Q.steps.map(x=>x.k),'r0'].map(k=>[k,1])),null,Q.mal):''}
<h3>${t('Així es fa','Así se hace')}</h3><ol class="passos">${Q.sol.map(s=>`<li>${s}</li>`).join('')}</ol>
<p>${t('Resposta bona','Respuesta buena')}: <b>${Q.steps?Q.steps[Q.pas].ans.h:Q.ans.h}</b></p></div>
<button class="gran" id="sg">${S.jc[1]>=2?t('Veure el resultat','Ver el resultado'):t('Següent punt','Siguiente punto')} →</button>`;
$('#sg').onclick=()=>S.jc[1]>=2?final():nova();
scrollTo(0,0);
}
const NOMG={taula:()=>t('Taula de Ruffini','Tabla de Ruffini'),residu:()=>t('Teorema del residu','Teorema del resto'),candidats:()=>t('Possibles arrels','Posibles raíces'),factor:()=>t('Factoritzar','Factorizar'),equacio:()=>t('Equacions de grau 3','Ecuaciones de grado 3'),deg2rad:()=>t('Graus → radians','Grados → radianes'),rad2deg:()=>t('Radians → graus','Radianes → grados'),dec2sex:()=>t('Decimals → minuts','Decimales → minutos'),resta:()=>t('Complementaris i suplementaris','Complementarios y suplementarios'),'raó':()=>t('Triar la raó','Elegir la razón'),hip:()=>t('Pitàgores + raó','Pitágoras + razón'),ident:()=>t(SN()+'² + cos² = 1',SN()+'² + cos² = 1'),notable:()=>t('Angles notables','Ángulos notables'),diag:()=>t('Diagonals (Pitàgores)','Diagonales (Pitágoras)'),creuat:()=>t('Trobar un angle','Hallar un ángulo'),altura:()=>t('Altures amb tangent','Alturas con tangente'),escala:()=>t('Altures amb '+SN(),'Alturas con '+SN()),ombra:()=>t('Ombres (Tales)','Sombras (Tales)'),raok:()=>t('k, k² i k³','k, k² y k³'),xarxa:()=>t('Pilota i xarxa','Pelota y red')};
function final(){
const guanya=S.jc[0]>=2;const pc=Math.round(100*S.encerts/S.total);
if(guanya)guardaRec(S.B.id,`${S.jc[0]}-${S.jc[1]}`);
const errs=Object.entries(S.errors).sort((a,b)=>b[1]-a[1]);
$('#app').innerHTML=`<div class="carta res"><div class="etiq" style="color:${guanya?'#1f8a4c':'#c8412f'}">${guanya?t('Partit guanyat','Partido ganado'):t('Partit perdut','Partido perdido')}</div>
<div class="gros">${S.jc[0]} – ${S.jc[1]}</div><p>${t('Has encertat','Has acertado')} <b>${S.encerts}</b> ${t('de','de')} <b>${S.total}</b> (${pc}%)</p><p>${t('Millor ratxa','Mejor racha')}: <b>${S.millor}</b>${S.pistes?` · ${t('Pistes','Pistas')}: <b>${S.pistes}</b>`:''}</p>
${errs.length?`<h3>${t('Per a repassar','Para repasar')}</h3><p>${errs.map(([g,n])=>`${NOMG[g]()} (${n})`).join(' · ')}</p><p style="font-size:14px;color:#5d6b7a">${t('En el pròxim partit et tocaran més preguntes d\'això.','En el próximo partido te saldrán más preguntas de esto.')}</p>`:`<p>${t('Cap error. Partit perfecte!','Ningún error. ¡Partido perfecto!')}</p>`}</div>
<div class="carta" style="text-align:left"><div class="secc-t">💡 ${t('Sabies que…?','¿Sabías que…?')}</div><p>${pick(CURIOS[S.B.id]())}</p></div>
<button class="gran" id="re">🎾 ${guanya?t('Un altre partit','Otro partido'):t('Revenja','Revancha')}</button>
<div class="fila"><button class="sec" id="te">📖 ${t('Repassar teoria','Repasar teoría')}</button><button class="sec" id="bl">${t('Blocs','Bloques')}</button></div>`;
$('#re').onclick=()=>partit(S.B);
$('#te').onclick=()=>teoria(S.B,0,false);
$('#bl').onclick=inici;
scrollTo(0,0);
}
document.documentElement.lang=LANG==='va'?'ca-valencia':'es';
inici();
</script>
</body>
</html>
