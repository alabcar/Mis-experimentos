<!doctype html>
<html lang="ca-valencia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f2a1c">
<title>Números Open</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--nit:#0f2a1c;--gespa:#2f7d46;--terra:#c8643b;--dura:#2c5f9e;--lila:#6b4fa0;--groc:#d9f03a;--tinta:#1d2733;--paper:#fbfaf4;--bo:#1f8a4c;--mal:#c8412f;--suau:#5d6b7a;--blau:#2c5f9e}
html,body{min-height:100%}
html{background:#0b1f15}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(ellipse at 50% -10%,#3b6e4f 0%,#163c28 45%,#0b1f15 100%) fixed;color:var(--tinta);overflow-x:hidden;font-size:17px;line-height:1.45}
#app{max-width:540px;margin:0 auto;padding:12px 14px 40px;display:flex;flex-direction:column;gap:12px}
.carta{background:var(--paper);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.cap{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:8px;color:#fff}
.titol{font-size:36px;font-weight:900;letter-spacing:.5px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.titol span{color:var(--groc)}
.lema{opacity:.9;margin-top:6px;font-size:15px}
.vict{margin-top:6px;font-size:14px;opacity:.9}
.idioma{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:10px;padding:6px 12px;font-weight:800;font-size:16px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.intro{color:#e8f2ea;font-size:15px}
.bloc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border-radius:14px;padding:12px 14px;box-shadow:0 4px 12px rgba(0,0,0,.3);border-left:10px solid var(--gespa)}
.bloc .ic{width:48px;height:48px;border-radius:12px;background:var(--groc);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;flex:none}
.bloc b{display:block;font-size:17px}
.bloc .sub{font-size:13.5px;color:var(--suau);display:block}
.bloc .trof{margin-left:auto;font-size:13px;font-weight:800;color:var(--bo);white-space:nowrap}
.bloc .trof i{font-style:normal;filter:grayscale(1);opacity:.35}
.bloc .trof i.on{filter:none;opacity:1}
.s-terra{border-left-color:var(--terra)}.s-dura{border-left-color:var(--dura)}.s-gespa{border-left-color:var(--gespa)}.s-lila{border-left-color:var(--lila)}.s-or{border-left-color:#d4a017;background:linear-gradient(90deg,#fff8dc,#fbfaf4)}
.gran{display:block;width:100%;background:var(--groc);color:var(--tinta);font-weight:900;font-size:18px;padding:14px;border-radius:14px;box-shadow:0 4px 0 #a9bd22}
.gran:active{transform:translateY(2px);box-shadow:0 2px 0 #a9bd22}
.sec{display:block;width:100%;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);font-weight:700;padding:11px;border-radius:14px}
.carta .sec{color:var(--tinta);border-color:#c9ccd1}
.fila{display:flex;gap:10px}.fila>*{flex:1}
.barra{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;font-size:14px}
.barra button{background:rgba(255,255,255,.16);border-radius:10px;padding:7px 11px;font-weight:700;font-size:14px;color:#fff}
.barra span{text-align:center;flex:1;opacity:.9}
h2{font-size:21px;margin-bottom:8px;line-height:1.2}
h3{font-size:17px;margin:14px 0 6px}
p{margin:7px 0}
ul.ll{margin:6px 0 6px 20px}ul.ll li{margin:4px 0}
.marcador{display:grid;grid-template-columns:1fr auto;background:#101820;color:#fff;border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.marcador div{padding:7px 12px;font-weight:800}
.marcador .pts{background:var(--groc);color:#101820;text-align:center;min-width:56px;font-size:19px}
.marcador .sep{grid-column:1/-1;height:1px;background:#2d3946;padding:0}
.marcador .nom small{font-weight:600;opacity:.7;margin-left:6px;font-size:12px}
.ratxa{color:#fff;font-size:14px;text-align:center;min-height:20px}
.tipus{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--suau);margin-bottom:6px}
.enun{font-size:18.5px}
.enun .gr{font-size:24px;font-weight:800;display:block;text-align:center;margin:10px 0}
.opcions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.op{background:#fff;border:2px solid #d6d9de;border-radius:12px;padding:12px 6px;font-size:19px;font-weight:700;min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--tinta)}
.op:active{background:#f3f6e0}
.op.bo{border-color:var(--bo);background:#e3f4ea}.op.mal{border-color:var(--mal);background:#fbe6e2}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.rd{white-space:nowrap}
.ov{border-top:2px solid currentColor;padding:1px 2px 0;margin-left:1px}
.rd sup.ix{font-size:.62em;margin-right:-3px;vertical-align:.9em}
sup{font-size:.68em;line-height:0}
.pant{display:flex;align-items:center;gap:8px;margin-top:12px}
.pant .cx{flex:1;background:#fff;border:2px solid #d6d9de;border-radius:12px;min-height:54px;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;font-variant-numeric:tabular-nums}
.pant .cx:empty::before{content:"?";color:#c3c7cd}
.pant .ud{font-weight:800;font-size:20px}
.teclat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.teclat button{background:#eef0f3;border-radius:10px;padding:12px 0;font-size:21px;font-weight:800;box-shadow:0 3px 0 #c9cdd3}
.teclat button:active{transform:translateY(2px);box-shadow:0 1px 0 #c9cdd3}
.teclat .ok{background:var(--groc);box-shadow:0 3px 0 #a9bd22;grid-row:span 2}
.nota{font-size:13.5px;color:var(--suau);margin-top:8px}
.lin{display:block;margin:8px auto 0;max-width:100%;touch-action:manipulation}
.rbots{display:flex;gap:8px;margin-top:8px}
.rbots button{flex:1;background:#eef0f3;border-radius:10px;padding:10px 4px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #c9cdd3}
.rtxt{text-align:center;font-size:22px;font-weight:800;margin-top:8px;min-height:30px}
.ajuda{background:transparent;border:2px dashed #c9ccd1;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;margin-top:12px;color:var(--suau)}
.pistab{background:#fff6cf;border-radius:10px;padding:10px;margin-top:12px;font-size:15px}
.ull{border-left:8px solid var(--mal)}.ull.ok{border-left-color:var(--bo)}
.etiq{font-size:13px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--mal)}
.ull.ok .etiq{color:var(--bo)}
.error{background:#fbe6e2;border-radius:10px;padding:10px;margin:8px 0}
.bona{background:#e3f4ea;border-radius:10px;padding:10px;margin:8px 0;font-size:19px;font-weight:700}
.passos{counter-reset:p;list-style:none;margin:6px 0}
.passos li{counter-increment:p;position:relative;padding:7px 0 7px 34px;border-bottom:1px dashed #d8dbe0}
.passos li:last-child{border-bottom:0}
.passos li::before{content:counter(p);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--blau);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.exemple{background:#eef2e4;border-radius:12px;padding:10px 12px;margin:10px 0}
.exemple .etq,.compte .etq,.perque .etq{font-size:12px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--gespa);display:block;margin-bottom:2px}
.compte{background:#fbe6e2;border-radius:12px;padding:10px 12px;margin:10px 0}.compte .etq{color:var(--mal)}
.perque{background:#e6eefa;border-radius:12px;padding:10px 12px;margin:10px 0}.perque .etq{color:var(--blau)}
.regla{background:#101820;color:#fff;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:17px}
.regla b{color:var(--groc)}
.taula{border-collapse:collapse;width:100%;margin:8px 0;font-size:15.5px}
.taula td,.taula th{border:1px solid #d6d9de;padding:6px 5px;text-align:center;vertical-align:middle}
.taula th{background:#eef0f3}
.punts{display:flex;justify-content:center;gap:6px;margin-top:14px}
.punts i{width:8px;height:8px;border-radius:50%;background:#d0d4da}.punts i.on{background:var(--gespa)}
.final{text-align:center}
.final .gran-ic{font-size:64px;line-height:1.1}
.peu{color:#cfe0d4;font-size:13px;text-align:center}
.pilota{position:fixed;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4ff7a,#c5dc1f 60%,#9fb514);z-index:9;pointer-events:none;top:40%;left:50%}
.pilota.tu{animation:tu .7s ease-in forwards}.pilota.ella{animation:ella .7s ease-in forwards}
@keyframes tu{0%{transform:translate(-50%,120px) scale(1.4)}100%{transform:translate(-50%,-320px) scale(.4);opacity:.2}}
@keyframes ella{0%{transform:translate(-50%,-320px) scale(.4)}100%{transform:translate(-50%,200px) scale(1.6);opacity:.2}}
.sacseja{animation:sac .35s}
@keyframes sac{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
let LANG=(()=>{try{return localStorage.getItem('no-idioma')||'va'}catch(e){return'va'}})();
document.documentElement.lang=LANG==='va'?'ca-valencia':'es';
const t=(va,es)=>LANG==='va'?va:es;
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const MN=x=>x<0?'−'+(-x):String(x);
const num=(x,d=3)=>{let s=Math.abs(x).toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return(x<0&&+s!==0?'−':'')+s.replace('.',',')};
const eur=x=>x.toFixed(2).replace('.',',')+' €';
const r2=x=>Math.round(x*100)/100;
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const fr=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;if(d===1)return MN(n);return(n<0?'−':'')+F(Math.abs(n),d)};
const pw=(b,e)=>`${b}<sup>${typeof e==='number'?MN(e):e}</sup>`;
const P10=e=>pw('10',e);
const sci=(m,e)=>`${num(m,4)}·${P10(e)}`;
const rad=(k,r,i=2)=>{const ix=i>2?`<sup class="ix">${i}</sup>`:'';const c=k===1?'':k===-1?'−':MN(k);return`<span class="rd">${c}${ix}√<span class="ov">${r}</span></span>`};
function simp(n,i=2){let k=1;for(let f=2;Math.pow(f,i)<=n;f++){const q=Math.pow(f,i);while(n%q===0){n/=q;k*=f}}return[k,n]}
const LOG=b=>b===10?'log ':`log<sub>${b}</sub> `;
const iv=(a,b,ac,bc)=>({a,b,ac:a===-Infinity?false:ac,bc:b===Infinity?false:bc});
const ivTxt=I=>`${I.a===-Infinity?'(−∞':(I.ac?'[':'(')+MN(I.a)}, ${I.b===Infinity?'+∞)':MN(I.b)+(I.bc?']':')')}`;
const ivEq=(A,B)=>A.a===B.a&&A.b===B.b&&(A.a===-Infinity||A.ac===B.ac)&&(B.b===Infinity||A.bc===B.bc);
function desTxt(I){
if(I.a===-Infinity)return`x ${I.bc?'≤':'&lt;'} ${MN(I.b)}`;
if(I.b===Infinity)return`x ${I.ac?'≥':'&gt;'} ${MN(I.a)}`;
return`${MN(I.a)} ${I.ac?'≤':'&lt;'} x ${I.bc?'≤':'&lt;'} ${MN(I.b)}`;
}
const COLS=['#2c5f9e','#c8643b','#1f8a4c','#6b4fa0'];
function linia(ints,lo,hi,o={}){
const W=330,rows=Math.max(1,ints.length),H=46+rows*16,x0=20,x1=W-20,st=(x1-x0)/(hi-lo),y=H-24;
const X=v=>v===-Infinity?6:v===Infinity?W-6:x0+(v-lo)*st;
let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" class="lin" ${o.id?`id="${o.id}"`:''}>`;
s+=`<line x1="4" y1="${y}" x2="${W-4}" y2="${y}" stroke="#1d2733" stroke-width="2"/><path d="M${W-4} ${y}l-8 -5v10z" fill="#1d2733"/>`;
for(let v=lo;v<=hi;v++){const x=X(v);s+=`<line x1="${x}" y1="${y-5}" x2="${x}" y2="${y+5}" stroke="#1d2733" stroke-width="${v===0?2.5:1.3}"/>`;s+=`<text x="${x}" y="${y+19}" font-size="12" text-anchor="middle" fill="#1d2733" font-weight="${v===0?800:500}">${v<0?'−'+(-v):v}</text>`}
ints.forEach((I,k)=>{const c=I.col||COLS[k%4];const yy=y-12-k*16;const xa=X(I.a),xb=X(I.b);
s+=`<line x1="${xa}" y1="${yy}" x2="${xb}" y2="${yy}" stroke="${c}" stroke-width="6" stroke-linecap="round" opacity="${I.op||1}"/>`;
if(I.a===-Infinity)s+=`<path d="M2 ${yy}l10 -7v14z" fill="${c}"/>`;else s+=`<circle cx="${xa}" cy="${yy}" r="6" fill="${I.ac?c:'#fff'}" stroke="${c}" stroke-width="3"/>`;
if(I.b===Infinity)s+=`<path d="M${W-2} ${yy}l-10 -7v14z" fill="${c}"/>`;else if(I.b!==null)s+=`<circle cx="${xb}" cy="${yy}" r="6" fill="${I.bc?c:'#fff'}" stroke="${c}" stroke-width="3"/>`;
if(I.lb)s+=`<text x="${(Math.max(xa,8)+Math.min(xb,W-8))/2}" y="${yy-8}" font-size="12" font-weight="800" text-anchor="middle" fill="${c}">${I.lb}</text>`;
});
if(o.clic)for(let v=lo;v<=hi;v++){s+=`<rect data-v="${v}" x="${X(v)-st/2}" y="0" width="${st}" height="${H}" fill="transparent" style="cursor:pointer"/>`}
return s+'</svg>';
}
function parseNum(s){s=s.replace(/−/g,'-').replace(/,/g,'.').trim();if(!s)return NaN;
if(s.includes('/')){const [a,b]=s.split('/');if(a===''||b===undefined||b==='')return NaN;const x=+a,y=+b;if(!isFinite(x)||!isFinite(y)||y===0)return NaN;return x/y}
const x=+s;return isFinite(x)?x:NaN}
const NOMS={N:()=>t('ℕ naturals','ℕ naturales'),Z:()=>t('ℤ enters','ℤ enteros'),Q:()=>t('ℚ racionals','ℚ racionales'),I:()=>t('𝕀 irracionals','𝕀 irracionales')};
</script>
<script>
const G={};
const NT=n=>t(n[0],n[1]);

G.classif=()=>{
const L=[
['√49','N',['√49 = 7, perquè 7² = 49. És un nombre natural.','√49 = 7, porque 7² = 49. Es un número natural.']],
['−√25','Z',['−√25 = −5. És un enter negatiu: no és natural, perquè els naturals no porten signe menys.','−√25 = −5. Es un entero negativo: no es natural, porque los naturales no llevan signo menos.']],
[F('−12',4),'Z',['−12 : 4 = −3. La divisió és exacta i dona un enter negatiu.','−12 : 4 = −3. La división es exacta y da un entero negativo.']],
[F('√144',4),'N',['√144 = 12 i 12 : 4 = 3. Encara que porta arrel i fracció, val 3: és natural.','√144 = 12 y 12 : 4 = 3. Aunque lleva raíz y fracción, vale 3: es natural.']],
[F(3,8),'Q',['3/8 = 0,375. És una fracció que no dona un enter: és racional (decimal exacte).','3/8 = 0,375. Es una fracción que no da un entero: es racional (decimal exacto).']],
['2,<span class="ov">36</span>','Q',['És un decimal periòdic pur: 2,363636… = 2 + 36/99 = 26/11. Tot decimal periòdic és una fracció, per tant és racional.','Es un decimal periódico puro: 2,363636… = 2 + 36/99 = 26/11. Todo decimal periódico es una fracción, por tanto es racional.']],
['−0,75','Q',['−0,75 = −3/4. Té un nombre finit de decimals: és racional.','−0,75 = −3/4. Tiene un número finito de decimales: es racional.']],
['√12','I',['12 no és quadrat perfecte (3² = 9 i 4² = 16), així que √12 = 3,4641016… té infinites xifres sense període: és irracional.','12 no es cuadrado perfecto (3² = 9 y 4² = 16), así que √12 = 3,4641016… tiene infinitas cifras sin periodo: es irracional.']],
['π','I',['π = 3,14159265… té infinites xifres decimals que no es repeteixen mai en bloc: és irracional.','π = 3,14159265… tiene infinitas cifras decimales que nunca se repiten en bloque: es irracional.']],
['1,010010001…','I',['Les xifres segueixen un patró (cada vegada un 0 més), però cap bloc es repeteix sempre igual: no és periòdic, és irracional.','Las cifras siguen un patrón (cada vez un 0 más), pero ningún bloque se repite siempre igual: no es periódico, es irracional.']],
[`√<span class="ov">${F(16,9)}</span>`,'Q',['√(16/9) = 4/3, perquè (4/3)² = 16/9. És una fracció: racional.','√(16/9) = 4/3, porque (4/3)² = 16/9. Es una fracción: racional.']],
[rad(-1,8,3),'Z',['∛8 = 2 (perquè 2³ = 8), així que −∛8 = −2: enter.','∛8 = 2 (porque 2³ = 8), así que −∛8 = −2: entero.']],
['1 + √2','I',['√2 és irracional i, si li sumes un racional, continua sent irracional: 1 + √2 = 2,4142135…','√2 es irracional y, si le sumas un racional, sigue siendo irracional: 1 + √2 = 2,4142135…']],
[rad(1,10,3),'I',['10 no és cub perfecte (2³ = 8, 3³ = 27): ∛10 = 2,1544… és irracional.','10 no es cubo perfecto (2³ = 8, 3³ = 27): ∛10 = 2,1544… es irracional.']],
['√0,25','Q',['√0,25 = 0,5, perquè 0,5² = 0,25. És un decimal exacte: racional.','√0,25 = 0,5, porque 0,5² = 0,25. Es un decimal exacto: racional.']]
];
const it=pick(L);const w=NT(it[2]);
return{tip:t('Conjunts de nombres','Conjuntos de números'),kind:'op',
txt:t('Quin és el conjunt <b>més xicotet</b> al qual pertany aquest nombre?','¿Cuál es el conjunto <b>más pequeño</b> al que pertenece este número?')+`<span class="gr">${it[0]}</span>`,
ok:NOMS[it[1]](),bad:['N','Z','Q','I'].filter(x=>x!==it[1]).map(x=>[NOMS[x](),w]),
expl:[w,t('Recorda la cadena: ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ. Els irracionals 𝕀 són els reals que <b>no</b> es poden escriure com a fracció (decimals infinits no periòdics).','Recuerda la cadena: ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ. Los irracionales 𝕀 son los reales que <b>no</b> se pueden escribir como fracción (decimales infinitos no periódicos).')],
pista:t('Primer calcula el nombre si pots (arrels exactes, divisions). Després mira: té signe menys? té decimals? són periòdics?','Primero calcula el número si puedes (raíces exactas, divisiones). Después mira: ¿tiene signo menos? ¿tiene decimales? ¿son periódicos?')};
};

G.aprox=()=>{
const L=[['π',Math.PI],['√2',Math.SQRT2],['√3',Math.sqrt(3)],['√5',Math.sqrt(5)],['e',Math.E],['2/3',2/3],['√7',Math.sqrt(7)],['√10',Math.sqrt(10)]];
const [n,v]=pick(L);const d=R(1,3);const LL=[null,[t('les dècimes','las décimas'),1],[t('les centèsimes','las centésimas'),2],[t('les mil·lèsimes','las milésimas'),3]];
const lloc=LL[d][0];const p=Math.pow(10,d);const arr=Math.round(v*p)/p,tru=Math.trunc(v*p)/p;const vs=num(v,7)+'…';
const ty=R(0,2);
if(ty<2){const ans=ty===0?arr:tru;const alt=ty===0?tru:arr;const seg=num(Math.trunc(v*p*10)%10,0);
return{tip:t('Aproximacions','Aproximaciones'),kind:'num',ans,tol:1e-9,fmt:num(ans,d),
txt:(ty===0?t(`<b>Arrodoneix</b> ${n} = ${vs} a ${lloc}.`,`<b>Redondea</b> ${n} = ${vs} a ${lloc}.`):t(`<b>Trunca</b> ${n} = ${vs} a ${lloc}.`,`<b>Trunca</b> ${n} = ${vs} a ${lloc}.`)),

function ivRand(){const ty=R(0,5);const a=R(-6,3),b=R(a+2,6);
if(ty<4)return iv(a,b,ty===1||ty===3,ty===2||ty===3);
if(ty===4)return iv(a,Infinity,Math.random()<.5,false);
return iv(-Infinity,b,false,Math.random()<.5)}
const W_INF=()=>t('L\'infinit no és un nombre que es puga «tocar»: <b>sempre</b> porta parèntesi.','El infinito no es un número que se pueda «tocar»: <b>siempre</b> lleva paréntesis.');
const W_CL=()=>t('Fixa\'t en els signes: <b>&lt;</b> o <b>&gt;</b> (estricte) vol dir que l\'extrem <b>no</b> entra → parèntesi ( ). <b>≤</b> o <b>≥</b> vol dir que <b>sí</b> entra → claudàtor [ ].','Fíjate en los signos: <b>&lt;</b> o <b>&gt;</b> (estricto) quiere decir que el extremo <b>no</b> entra → paréntesis ( ). <b>≤</b> o <b>≥</b> quiere decir que <b>sí</b> entra → corchete [ ].');
G.desig=()=>{

else if(I.b===Infinity){bad.push([ivTxt(iv(I.a,Infinity,!I.ac,false)),W_CL()]);bad.push([`${I.ac?'[':'('}${MN(I.a)}, +∞]`,W_INF()]);bad.push([ivTxt(iv(-Infinity,I.a,false,I.ac)),t(`x ${I.ac?'≥':'&gt;'} ${MN(I.a)} vol dir nombres <b>majors</b> que ${MN(I.a)}: van cap a la dreta, cap a +∞.`,`x ${I.ac?'≥':'&gt;'} ${MN(I.a)} quiere decir números <b>mayores</b> que ${MN(I.a)}: van hacia la derecha, hacia +∞.`)])}

G.opera=()=>{

t('Cada extrem conserva el claudàtor o parèntesi de l\'interval d\'on ve.','Cada extremo conserva el corchete o paréntesis del intervalo de donde viene.'),
`A ${sim} B = <b>${ivTxt(res)}</b>`+linia([{...A,lb:'A',op:.5},{...B,lb:'B',op:.5},{...res,col:'#1d2733',lb:'A'+sim+'B'}],-7,7)];
const txt=t(`Si A = <b>${ivTxt(A)}</b> i B = <b>${ivTxt(B)}</b>, `,`Si A = <b>${ivTxt(A)}</b> y B = <b>${ivTxt(B)}</b>, `);
const base={tip:uni?t('Unió d\'intervals','Unión de intervalos'):t('Intersecció d\'intervals','Intersección de intervalos'),expl:exp,pista:t('Dibuixa A i B l\'un damunt de l\'altre i mira on hi ha ratlla.','Dibuja A y B uno encima del otro y mira dónde hay raya.')};
if(Math.random()<.5)return{...base,kind:'recta',ansI:res,rec:{lo:-7,hi:7,given:[{...A,lb:'A',op:.35},{...B,lb:'B',op:.35}]},txt:txt+t(`marca <b>A ${sim} B</b>.`,`marca <b>A ${sim} B</b>.`)};
const bad=[[ivTxt(alt),uni?t('Això és la <b>intersecció</b> (el tros comú). La unió és tot el que està pintat en A o en B.','Eso es la <b>intersección</b> (el trozo común). La unión es todo lo que está pintado en A o en B.'):t('Això és la <b>unió</b> (tot junt). La intersecció és només el tros comú.','Eso es la <b>unión</b> (todo junto). La intersección es solo el trozo común.')]];
if(res.a!==-Infinity)bad.push([ivTxt(iv(res.a,res.b,!res.ac,res.bc)),t('Revisa l\'extrem esquerre: ha de conservar el claudàtor o parèntesi de l\'interval d\'on ve.','Revisa el extremo izquierdo: tiene que conservar el corchete o paréntesis del intervalo de donde viene.')]);
if(res.b!==Infinity)bad.push([ivTxt(iv(res.a,res.b,res.ac,!res.bc)),t('Revisa l\'extrem dret: ha de conservar el claudàtor o parèntesi de l\'interval d\'on ve.','Revisa el extremo derecho: tiene que conservar el corchete o paréntesis del intervalo de donde viene.')]);

G.signe=()=>{
const a=R(2,5),n=a>=4?R(2,3):R(2,4);const ty=R(0,3);let h,v,ex;
if(ty===0){h=`(−${a})<sup>${n}</sup>`;v=Math.pow(-a,n);ex=t(`El parèntesi fa que el signe també s'eleve. Exponent ${n%2?'senar':'parell'} → resultat ${n%2?'negatiu':'positiu'}.`,`El paréntesis hace que el signo también se eleve. Exponente ${n%2?'impar':'par'} → resultado ${n%2?'negativo':'positivo'}.`)}
else if(ty===1){h=`−${a}<sup>${n}</sup>`;v=-Math.pow(a,n);ex=t(`Sense parèntesi, l'exponent només afecta el ${a}: −${a}<sup>${n}</sup> = −(${a}<sup>${n}</sup>). El menys es queda fora.`,`Sin paréntesis, el exponente solo afecta al ${a}: −${a}<sup>${n}</sup> = −(${a}<sup>${n}</sup>). El menos se queda fuera.`)}
else if(ty===2){h=`(−${a})<sup>0</sup>`;v=1;ex=t('Qualsevol nombre (diferent de 0) elevat a 0 val 1, també els negatius si van entre parèntesis.','Cualquier número (distinto de 0) elevado a 0 vale 1, también los negativos si van entre paréntesis.')}
else{h=`−${a}<sup>0</sup>`;v=-1;ex=t(`Sense parèntesi: −${a}<sup>0</sup> = −(${a}<sup>0</sup>) = −1. L'exponent no afecta el signe.`,`Sin paréntesis: −${a}<sup>0</sup> = −(${a}<sup>0</sup>) = −1. El exponente no afecta al signo.`)}
const errs=[[-v,t('Revisa el signe: mira si el menys està dins del parèntesi (s\'eleva) o fora (no s\'eleva).','Revisa el signo: mira si el menos está dentro del paréntesis (se eleva) o fuera (no se eleva).')]];
if(ty<2)errs.push([a*n,t('Una potència no és multiplicar la base per l\'exponent: és multiplicar la base per ella mateixa.','Una potencia no es multiplicar la base por el exponente: es multiplicar la base por sí misma.')],[-a*n,t('Una potència no és multiplicar la base per l\'exponent.','Una potencia no es multiplicar la base por el exponente.')]);
if(ty>=2)errs.push([0,t('a<sup>0</sup> val 1, no 0. Pensa: a<sup>3</sup> : a<sup>3</sup> = a<sup>0</sup>, i un nombre dividit per ell mateix és 1.','a<sup>0</sup> vale 1, no 0. Piensa: a<sup>3</sup> : a<sup>3</sup> = a<sup>0</sup>, y un número dividido por sí mismo es 1.')]);
return{tip:t('Signes i potències','Signos y potencias'),kind:'num',ans:v,tol:1e-9,fmt:MN(v),txt:t('Calcula:','Calcula:')+`<span class="gr">${h}</span>`,errs,
expl:[ex,ty<2?`${ty===0?`(−${a})·`.repeat(n).slice(0,-1):`−(${(a+'·').repeat(n).slice(0,-1)})`} = <b>${MN(v)}</b>`:`${h} = <b>${MN(v)}</b>`],pista:t('Mira bé si el signe menys està dins del parèntesi.','Mira bien si el signo menos está dentro del paréntesis.')};
};

G.simpl=()=>{
for(;;){const a=pick([2,2,3]);const E=a===2?R(-4,4):R(-2,3);const p=R(-3,6),r=pick([2,-2,3,-1,4]),s=pick([2,-1,3,-2]);const q=E-p+r*s;if(Math.abs(q)>8||q===0)continue;
const num_=p+q,den=r*s;const val=E>=0?Math.pow(a,E):1/Math.pow(a,-E);const fm=E>=0?MN(Math.pow(a,E)):fr(1,Math.pow(a,-E));const qq=q<0?`(${MN(q)})`:q;const dd=den<0?`(${MN(den)})`:den;
const w=p+q-r-s;const errs=[];if(Math.abs(w)<=7&&w!==E)errs.push([w>=0?Math.pow(a,w):1/Math.pow(a,-w),t(`En (${pw(a,r)})<sup>${MN(s)}</sup> els exponents es <b>multipliquen</b> (${MN(r)}·${MN(s)} = ${MN(den)}), no se sumen.`,`En (${pw(a,r)})<sup>${MN(s)}</sup> los exponentes se <b>multiplican</b> (${MN(r)}·${MN(s)} = ${MN(den)}), no se suman.`)]);
const w2=num_+den;if(Math.abs(w2)<=7&&w2!==E)errs.push([w2>=0?Math.pow(a,w2):1/Math.pow(a,-w2),t('El denominador resta: l\'exponent final és el de dalt <b>menys</b> el de baix.','El denominador resta: el exponente final es el de arriba <b>menos</b> el de abajo.')]);
errs.push([-val,t('Totes les potències són de base positiva: el resultat no pot ser negatiu.','Todas las potencias son de base positiva: el resultado no puede ser negativo.')]);
return{tip:t('Simplificar potències','Simplificar potencias'),kind:'num',ans:val,tol:1e-9,fmt:fm,
txt:t('Simplifica i calcula el valor (pots escriure fraccions amb /):','Simplifica y calcula el valor (puedes escribir fracciones con /):')+`<span class="gr">${F(pw(a,p)+' · '+pw(a,q),'('+pw(a,r)+')<sup>'+MN(s)+'</sup>')}</span>`,errs,
expl:[t(`Numerador: ${pw(a,p)} · ${pw(a,q)} = ${pw(a,num_)} (sumem: ${MN(p)} + ${qq} = ${MN(num_)}).`,`Numerador: ${pw(a,p)} · ${pw(a,q)} = ${pw(a,num_)} (sumamos: ${MN(p)} + ${qq} = ${MN(num_)}).`),
t(`Denominador: (${pw(a,r)})<sup>${MN(s)}</sup> = ${pw(a,den)} (multipliquem: ${MN(r)} · ${s<0?'('+MN(s)+')':s} = ${MN(den)}).`,`Denominador: (${pw(a,r)})<sup>${MN(s)}</sup> = ${pw(a,den)} (multiplicamos: ${MN(r)} · ${s<0?'('+MN(s)+')':s} = ${MN(den)}).`),
t(`Divisió: ${pw(a,num_)} : ${pw(a,den)} = ${pw(a,E)} (${MN(num_)} − ${dd} = ${MN(E)}).`,`División: ${pw(a,num_)} : ${pw(a,den)} = ${pw(a,E)} (${MN(num_)} − ${dd} = ${MN(E)}).`),
`${pw(a,E)} = <b>${fm}</b>`],pista:t('Fes-ho per parts: primer dalt (sumar exponents), després baix (multiplicar), i al final divideix (restar).','Hazlo por partes: primero arriba (sumar exponentes), después abajo (multiplicar), y al final divide (restar).')}}
};

G.base=()=>{
const b=pick([2,3]);const B=b===2?[[2,1],[4,2],[8,3],[16,4]]:[[3,1],[9,2],[27,3]];
const f=shuffle(B).slice(0,3);const ks=f.map(()=>{let k=R(-3,4);return k===0?2:k});const tot=f.reduce((s,x,i)=>s+x[1]*ks[i],0);const sk=ks.reduce((s,x)=>s+x,0);const sb=f.reduce((s,x,i)=>s+x[1]+ks[i],0);
const h=f.map((x,i)=>pw(x[0],ks[i])).join(' · ');
return{tip:t('Canvi de base','Cambio de base'),kind:'op',txt:t(`Escriu com una sola potència de base ${b}:`,`Escribe como una sola potencia de base ${b}:`)+`<span class="gr">${h}</span>`,ok:pw(b,tot),
bad:[[pw(b,sk),t(`No pots sumar els exponents directament si les bases són diferents. Primer escriu cada base com a potència de ${b}.`,`No puedes sumar los exponentes directamente si las bases son distintas. Primero escribe cada base como potencia de ${b}.`)],[pw(b,sb),t(`En (${b}<sup>a</sup>)<sup>k</sup> els exponents es <b>multipliquen</b>, no se sumen.`,`En (${b}<sup>a</sup>)<sup>k</sup> los exponentes se <b>multiplican</b>, no se suman.`)],[pw(b,-tot),t('Revisa els signes dels exponents.','Revisa los signos de los exponentes.')],[pw(b,tot+2),t('Revisa la suma final dels exponents, terme a terme.','Revisa la suma final de los exponentes, término a término.')],[pw(b*b,tot),t('La base és '+b+', no '+(b*b)+'.','La base es '+b+', no '+(b*b)+'.')]],
expl:[t(`Escrivim cada base com a potència de ${b}: `,`Escribimos cada base como potencia de ${b}: `)+f.filter(x=>x[1]>1).map(x=>`${x[0]} = ${pw(b,x[1])}`).join(', '),
f.map((x,i)=>x[1]>1?`(${pw(b,x[1])})<sup>${MN(ks[i])}</sup> = ${pw(b,x[1]*ks[i])}`:`${pw(b,ks[i])}`).join(' ; '),
t(`Sumem exponents: ${f.map((x,i)=>MN(x[1]*ks[i])).join(' + ').replace(/\+ −/g,'− ')} = ${MN(tot)}`,`Sumamos exponentes: ${f.map((x,i)=>MN(x[1]*ks[i])).join(' + ').replace(/\+ −/g,'− ')} = ${MN(tot)}`),`<b>${pw(b,tot)}</b>`],
pista:b===2?t('4 = 2², 8 = 2³, 16 = 2⁴.','4 = 2², 8 = 2³, 16 = 2⁴.'):t('9 = 3², 27 = 3³.','9 = 3², 27 = 3³.')};
};

function stdStr(D,e){const L=D.length;let s;if(e>=0){s=D+'0'.repeat(Math.max(0,e+1-L));s=s.replace(/\B(?=(\d{3})+(?!\d))/g,' ')}else s='0,'+'0'.repeat(-e-1)+D;return s}
G.escriu=()=>{
const D=pick([String(R(11,99)),String(R(101,999))]).replace(/0+$/,'')||'5';const m=+(D[0]+'.'+D.slice(1));const e=Math.random()<.5?R(4,10):R(-7,-2);
const s=stdStr(D,e);const un=+(D.slice(0,2)+'.'+D.slice(2));
const bad=[[sci(m,e+(e>0?-1:1)),t('Compta bé quants llocs es mou la coma: fins a deixar <b>una sola xifra</b> (no nul·la) davant.','Cuenta bien cuántos lugares se mueve la coma: hasta dejar <b>una sola cifra</b> (no nula) delante.')],[sci(m,-e),t('El signe de l\'exponent: nombres <b>grans</b> → exponent positiu; nombres <b>menuts</b> (0,…) → exponent negatiu.','El signo del exponente: números <b>grandes</b> → exponente positivo; números <b>pequeños</b> (0,…) → exponente negativo.')]];
if(D.length>1)bad.push([sci(un,e-1),t('Té el mateix valor, però no és notació científica: davant de la coma hi ha d\'haver <b>una sola xifra</b>, de l\'1 al 9.','Tiene el mismo valor, pero no es notación científica: delante de la coma tiene que haber <b>una sola cifra</b>, del 1 al 9.')]);
else bad.push([sci(m,e+(e>0?1:-1)),t('Compta bé quants llocs es mou la coma.','Cuenta bien cuántos lugares se mueve la coma.')]);
return{tip:t('Notació científica','Notación científica'),kind:'op',txt:t('Escriu en notació científica:','Escribe en notación científica:')+`<span class="gr">${s}</span>`,ok:sci(m,e),bad,
expl:[t('Posem la coma darrere de la primera xifra que no és zero: ','Ponemos la coma detrás de la primera cifra que no es cero: ')+num(m,4),
e>0?t(`Per passar de ${num(m,4)} a ${s} la coma es mou <b>${e}</b> llocs a la dreta → multipliquem per ${P10(e)}.`,`Para pasar de ${num(m,4)} a ${s} la coma se mueve <b>${e}</b> lugares a la derecha → multiplicamos por ${P10(e)}.`):t(`Per passar de ${num(m,4)} a ${s} la coma es mou <b>${-e}</b> llocs a l'esquerra → multipliquem per ${P10(e)}.`,`Para pasar de ${num(m,4)} a ${s} la coma se mueve <b>${-e}</b> lugares a la izquierda → multiplicamos por ${P10(e)}.`),
`${s} = <b>${sci(m,e)}</b>`],pista:t('Deixa una sola xifra davant de la coma i compta quants llocs l\'has moguda.','Deja una sola cifra delante de la coma y cuenta cuántos lugares la has movido.')};
};

G.mult=()=>{
const A=R(11,99),B=R(11,99);const a=A/10,b=B/10;const m=R(-8,9),n=R(-8,9);const pr=A*B/100;let ma=pr,ex=m+n;if(ma>=10){ma=A*B/1000;ex++}
const nn=n<0?`(${MN(n)})`:n;
const bad=[[sci(ma,m*n),t('En multiplicar potències de 10, els exponents se <b>sumen</b>, no es multipliquen.','Al multiplicar potencias de 10, los exponentes se <b>suman</b>, no se multiplican.')],[sci(r2(a+b)>=10?r2(a+b)/10:r2(a+b),m+n),t('Les mantisses (els nombres de davant) es <b>multipliquen</b>, no se sumen.','Las mantisas (los números de delante) se <b>multiplican</b>, no se suman.')]];
if(pr>=10){bad.push([`${num(pr,4)}·${P10(m+n)}`,t(`El valor és correcte però no està en notació científica: ${num(pr,4)} té dues xifres davant de la coma. Passa\'n una a l\'exponent.`,`El valor es correcto pero no está en notación científica: ${num(pr,4)} tiene dos cifras delante de la coma. Pasa una al exponente.`)]);bad.push([sci(ma,m+n),t('Has corregit la mantissa (dividint per 10) però t\'has oblidat de <b>sumar 1</b> a l\'exponent.','Has corregido la mantisa (dividiendo por 10) pero te has olvidado de <b>sumar 1</b> al exponente.')])}

expl:[t(`Multipliquem les mantisses: ${num(a)} · ${num(b)} = ${num(pr,4)}`,`Multiplicamos las mantisas: ${num(a)} · ${num(b)} = ${num(pr,4)}`),t(`Sumem els exponents: ${MN(m)} + ${nn} = ${MN(m+n)}`,`Sumamos los exponentes: ${MN(m)} + ${nn} = ${MN(m+n)}`),
pr>=10?t(`${num(pr,4)} no és entre 1 i 10: ${num(pr,4)} = ${num(ma,4)}·10, així que l'exponent puja 1 → <b>${sci(ma,ex)}</b>`,`${num(pr,4)} no está entre 1 y 10: ${num(pr,4)} = ${num(ma,4)}·10, así que el exponente sube 1 → <b>${sci(ma,ex)}</b>`):t(`${num(pr,4)} ja és entre 1 i 10 → <b>${sci(ma,ex)}</b>`,`${num(pr,4)} ya está entre 1 y 10 → <b>${sci(ma,ex)}</b>`)],
pista:t('Números amb números (multiplica), potències amb potències (suma exponents). Al final, revisa que davant de la coma hi haja una sola xifra.','Números con números (multiplica), potencias con potencias (suma exponentes). Al final, revisa que delante de la coma haya una sola cifra.')};
};

G.div=()=>{
const [a,b]=pick([[1.2,4],[1.5,5],[2.4,8],[3,6],[6.4,8],[1.8,2],[8.4,2.1],[9,1.5],[7.5,2.5],[4.8,1.6],[2.8,7],[9.6,3],[6.3,9],[3.6,1.2]]);
const m=R(-6,9),n=R(-6,9);const q=Math.round(a/b*1e6)/1e6;let ma=q,ex=m-n;if(q<1){ma=Math.round(q*10*1e6)/1e6;ex--}const nn=n<0?`(${MN(n)})`:n;
const bad=[[sci(ma,m+n),t('En dividir potències de 10, els exponents es <b>resten</b>.','Al dividir potencias de 10, los exponentes se <b>restan</b>.')],[sci(ma,n-m+(q<1?-1:0)),t('L\'ordre de la resta importa: exponent del dividend <b>menys</b> exponent del divisor.','El orden de la resta importa: exponente del dividendo <b>menos</b> exponente del divisor.')]];
if(q<1)bad.push([`${num(q,4)}·${P10(m-n)}`,t(`El valor és correcte però no és notació científica: ${num(q,4)} és menor que 1. Cal ${num(ma,4)} i baixar 1 l'exponent.`,`El valor es correcto pero no es notación científica: ${num(q,4)} es menor que 1. Hay que poner ${num(ma,4)} y bajar 1 el exponente.`)]);
bad.push([sci(ma,ex+1),t('Revisa l\'exponent: després de dividir les mantisses, l\'exponent és la resta dels exponents.','Revisa el exponente: después de dividir las mantisas, el exponente es la resta de los exponentes.')]);
if(q>=1)bad.push([sci(Math.round(b/a*1e4)/1e4<1?Math.round(b/a*1e5)/1e4:Math.round(b/a*1e4)/1e4,m-n),t('Has dividit al revés les mantisses.','Has dividido al revés las mantisas.')]);
return{tip:t('Dividir en notació científica','Dividir en notación científica'),kind:'op',txt:t('Calcula i dona el resultat en notació científica:','Calcula y da el resultado en notación científica:')+`<span class="gr">(${sci(a,m)}) : (${sci(b,n)})</span>`,ok:sci(ma,ex),bad,
expl:[t(`Dividim les mantisses: ${num(a)} : ${num(b)} = ${num(q,4)}`,`Dividimos las mantisas: ${num(a)} : ${num(b)} = ${num(q,4)}`),t(`Restem els exponents: ${MN(m)} − ${nn} = ${MN(m-n)}`,`Restamos los exponentes: ${MN(m)} − ${nn} = ${MN(m-n)}`),
q<1?t(`${num(q,4)} és menor que 1: ${num(q,4)} = ${num(ma,4)}·${P10(-1)}, així que l'exponent baixa 1 → <b>${sci(ma,ex)}</b>`,`${num(q,4)} es menor que 1: ${num(q,4)} = ${num(ma,4)}·${P10(-1)}, así que el exponente baja 1 → <b>${sci(ma,ex)}</b>`):t(`${num(q,4)} ja és entre 1 i 10 → <b>${sci(ma,ex)}</b>`,`${num(q,4)} ya está entre 1 y 10 → <b>${sci(ma,ex)}</b>`)],
pista:t('Divideix els números, resta els exponents i revisa que la mantissa quede entre 1 i 10.','Divide los números, resta los exponentes y revisa que la mantisa quede entre 1 y 10.')};
};

G.suma=()=>{

return{tip:mes?t('Sumar en notació científica','Sumar en notación científica'):t('Restar en notació científica','Restar en notación científica'),kind:'op',txt:t('Calcula i dona el resultat en notació científica:','Calcula y da el resultado en notación científica:')+`<span class="gr">${sci(a,m)} ${sg} ${sci(b,n)}</span>`,ok:sci(ma,ex),bad,

t(`Traiem factor comú: (${num(a)} ${sg} ${bs})·${P10(m)} = ${num(S/Math.pow(10,d+1),5)}·${P10(m)}`,`Sacamos factor común: (${num(a)} ${sg} ${bs})·${P10(m)} = ${num(S/Math.pow(10,d+1),5)}·${P10(m)}`),
S/Math.pow(10,d+1)>=10||S/Math.pow(10,d+1)<1?t(`Ajustem perquè hi haja una sola xifra davant de la coma: <b>${sci(ma,ex)}</b>`,`Ajustamos para que haya una sola cifra delante de la coma: <b>${sci(ma,ex)}</b>`):t(`Ja està en notació científica: <b>${sci(ma,ex)}</b>`,`Ya está en notación científica: <b>${sci(ma,ex)}</b>`)],
pista:t('Abans de sumar, posa els dos nombres amb la mateixa potència de 10.','Antes de sumar, pon los dos números con la misma potencia de 10.')};
};

G.context=()=>{

G.potfrac=()=>{
const a=pick([2,3,5,7,'x']);let m=R(1,5),n=R(2,5);if(m===n)m=n===5?4:n+1;const fx=`${m}/${n}`;const rr=`${n>2?`<sup class="ix">${n}</sup>`:''}√<span class="ov">${m===1?a:pw(a,m)}</span>`;const rad2=(i,inner)=>`<span class="rd">${i>2?`<sup class="ix">${i}</sup>`:''}√<span class="ov">${inner}</span></span>`;
if(Math.random()<.5)return{tip:t('Arrel → potència','Raíz → potencia'),kind:'op',txt:t('Escriu com a potència d\'exponent fraccionari:','Escribe como potencia de exponente fraccionario:')+`<span class="gr"><span class="rd">${rr}</span></span>`,ok:pw(a,fx),
bad:[[pw(a,`${n}/${m}`),t('L\'<b>índex</b> de l\'arrel va al <b>denominador</b>, i l\'exponent del radicand al numerador.','El <b>índice</b> de la raíz va al <b>denominador</b>, y el exponente del radicando al numerador.')],[pw(a,m*n),t('No es multipliquen: l\'arrel <b>divideix</b> l\'exponent entre l\'índex.','No se multiplican: la raíz <b>divide</b> el exponente entre el índice.')],[pw(a,m-n),t('L\'arrel no resta: ⁿ√(a<sup>m</sup>) = a<sup>m/n</sup>.','La raíz no resta: ⁿ√(a<sup>m</sup>) = a<sup>m/n</sup>.')]],
expl:[t('Regla: ⁿ√(a<sup>m</sup>) = a<sup>m/n</sup>. L\'exponent de dins va dalt, l\'índex de l\'arrel va baix.','Regla: ⁿ√(a<sup>m</sup>) = a<sup>m/n</sup>. El exponente de dentro va arriba, el índice de la raíz va abajo.'),n===2?t('Si no es veu l\'índex, és 2 (arrel quadrada).','Si no se ve el índice, es 2 (raíz cuadrada).'):t(`Ací l'índex és ${n} i l'exponent ${m}.`,`Aquí el índice es ${n} y el exponente ${m}.`),`<span class="rd">${rr}</span> = <b>${pw(a,fx)}</b>`],pista:t('Índex baix, exponent dalt.','Índice abajo, exponente arriba.')};
return{tip:t('Potència → arrel','Potencia → raíz'),kind:'op',txt:t('Escriu en forma de radical:','Escribe en forma de radical:')+`<span class="gr">${pw(a,fx)}</span>`,ok:`<span class="rd">${rr}</span>`,
bad:[[rad2(m,n===1?a:pw(a,n)),t('Al revés: el <b>denominador</b> és l\'índex de l\'arrel i el numerador és l\'exponent de dins.','Al revés: el <b>denominador</b> es el índice de la raíz y el numerador es el exponente de dentro.')],[`${m}·${rad2(n,a)}`,t('L\'exponent no multiplica l\'arrel: va dins, elevant la base.','El exponente no multiplica la raíz: va dentro, elevando la base.')],[rad2(n,typeof a==='number'?a*m:m+'x'),t('L\'exponent eleva la base (potència), no la multiplica.','El exponente eleva la base (potencia), no la multiplica.')]],
expl:[t('Regla: a<sup>m/n</sup> = ⁿ√(a<sup>m</sup>). El denominador és l\'índex; el numerador, l\'exponent del radicand.','Regla: a<sup>m/n</sup> = ⁿ√(a<sup>m</sup>). El denominador es el índice; el numerador, el exponente del radicando.'),`${pw(a,fx)} = <b><span class="rd">${rr}</span></b>`],pista:t('El denominador de la fracció és l\'índex de l\'arrel.','El denominador de la fracción es el índice de la raíz.')};
};

G.valor=()=>{
const [b,m,n]=pick([[8,2,3],[27,2,3],[16,3,4],[32,3,5],[9,3,2],[4,-1,2],[125,-2,3],[81,3,4],[25,3,2],[64,2,3],[100,-1,2],[1000,2,3],[16,-1,4],[4,3,2],[8,-1,3],[49,-1,2],[36,3,2]]);
const r=Math.round(Math.pow(b,1/n));const v=m>0?Math.pow(r,m):1/Math.pow(r,-m);const fm=m>0?MN(v):fr(1,Math.pow(r,-m));
const errs=[[b*m/n,t('L\'exponent fraccionari <b>no</b> multiplica la base: vol dir arrel i potència.','El exponente fraccionario <b>no</b> multiplica la base: quiere decir raíz y potencia.')]];if(m<0)errs.push([-1/v,t('L\'exponent negatiu no fa negatiu el resultat: fa l\'invers.','El exponente negativo no hace negativo el resultado: hace el inverso.')],[1/v,t('Quasi: falta fer l\'invers per l\'exponent negatiu.','Casi: falta hacer el inverso por el exponente negativo.')]);
return{tip:t('Exponent fraccionari','Exponente fraccionario'),kind:'num',ans:v,tol:1e-9,fmt:fm,txt:t('Calcula sense calculadora (pots escriure fraccions amb /):','Calcula sin calculadora (puedes escribir fracciones con /):')+`<span class="gr">${pw(b,`${MN(m)}/${n}`)}</span>`,errs,
expl:[t(`El denominador ${n} és l'arrel: ${rad(1,b,n)} = ${r}, perquè ${pw(r,n)} = ${b}.`,`El denominador ${n} es la raíz: ${rad(1,b,n)} = ${r}, porque ${pw(r,n)} = ${b}.`),m>0?t(`El numerador ${m} és la potència: ${pw(r,m)} = ${v}.`,`El numerador ${m} es la potencia: ${pw(r,m)} = ${v}.`):t(`El numerador ${MN(m)} és potència i invers: ${pw(r,m)} = ${F(1,pw(r,-m))}.`,`El numerador ${MN(m)} es potencia e inverso: ${pw(r,m)} = ${F(1,pw(r,-m))}.`),`${pw(b,`${MN(m)}/${n}`)} = <b>${fm}</b>`],pista:t('Primer fes l\'arrel (denominador) perquè queda un número més menut, després eleva (numerador).','Primero haz la raíz (denominador) porque queda un número más pequeño, después eleva (numerador).')};
};

G.extreu=()=>{
const cub=Math.random()<.3;const i=cub?3:2;let k,r;
if(cub){k=pick([2,3]);r=pick([2,3,4,5])}else{r=pick([2,3,5,6,7,10]);k=R(2,7);while(k*k*r>300)k--}
const n=Math.pow(k,i)*r;const ok=rad(k,r,i);
if(Math.random()<.25){return{tip:t('Introduir factors','Introducir factores'),kind:'op',txt:t('Introdueix el factor dins de l\'arrel:','Introduce el factor dentro de la raíz:')+`<span class="gr">${ok}</span>`,ok:rad(1,n,i),
bad:[[rad(1,k*r,i),t(`Per entrar un factor a l'arrel l'has d'elevar a l'índex: ${k} → ${pw(k,i)} = ${Math.pow(k,i)}.`,`Para meter un factor en la raíz hay que elevarlo al índice: ${k} → ${pw(k,i)} = ${Math.pow(k,i)}.`)],[rad(1,Math.pow(k,i)+r,i),t('El factor entra multiplicant, no sumant.','El factor entra multiplicando, no sumando.')],[rad(1,k*Math.pow(r,i),i),t('Has elevat el número equivocat: el que entra és el de fora.','Has elevado el número equivocado: el que entra es el de fuera.')]],
expl:[t(`Per entrar ${k} dins l'arrel l'elevem a l'índex ${i}: ${k} = ${rad(1,pw(k,i),i)}.`,`Para meter ${k} dentro de la raíz lo elevamos al índice ${i}: ${k} = ${rad(1,pw(k,i),i)}.`),`${ok} = ${rad(1,`${pw(k,i)}·${r}`,i)} = <b>${rad(1,n,i)}</b>`],pista:t('El factor entra elevat a l\'índex.','El factor entra elevado al índice.')}}
const bad=[[rad(Math.pow(k,i),r,i),t(`Has tret ${pw(k,i)} sense fer-ne l'arrel. Fora va l'arrel: ${rad(1,pw(k,i),i)} = ${k}.`,`Has sacado ${pw(k,i)} sin hacer su raíz. Fuera va la raíz: ${rad(1,pw(k,i),i)} = ${k}.`)]];
const d=[2,3,5,7].find(p=>k%p===0&&p<k);if(d)bad.push([rad(d,n/Math.pow(d,i),i),t('És correcte però incomplet: encara pots traure més factors de dins de l\'arrel.','Es correcto pero incompleto: todavía puedes sacar más factores de dentro de la raíz.')]);
if(r!==k)bad.push([rad(r,Math.pow(k,i),i),t('Has deixat dins el que havia d\'eixir i has tret el que no és potència perfecta.','Has dejado dentro lo que debía salir y has sacado lo que no es potencia perfecta.')]);
bad.push([rad(k,r*i,i),t('Revisa la descomposició del radicand.','Revisa la descomposición del radicando.')]);
return{tip:t('Extraure factors','Extraer factores'),kind:'op',txt:t('Simplifica traient factors de l\'arrel:','Simplifica sacando factores de la raíz:')+`<span class="gr">${rad(1,n,i)}</span>`,ok,bad,
expl:[t(`Busquem dins de ${n} un ${cub?'cub':'quadrat'} perfecte: ${n} = ${Math.pow(k,i)} · ${r}, i ${Math.pow(k,i)} = ${pw(k,i)}.`,`Buscamos dentro de ${n} un ${cub?'cubo':'cuadrado'} perfecto: ${n} = ${Math.pow(k,i)} · ${r}, y ${Math.pow(k,i)} = ${pw(k,i)}.`),`${rad(1,n,i)} = ${rad(1,`${pw(k,i)}·${r}`,i)} = ${rad(1,pw(k,i),i)}·${rad(1,r,i)}`,t(`${rad(1,pw(k,i),i)} = ${k} surt fora: <b>${ok}</b>`,`${rad(1,pw(k,i),i)} = ${k} sale fuera: <b>${ok}</b>`)],
pista:cub?t('Busca un divisor que siga cub perfecte: 8, 27, 64…','Busca un divisor que sea cubo perfecto: 8, 27, 64…'):t('Busca el quadrat perfecte més gran que divideix el número: 4, 9, 16, 25, 36, 49…','Busca el cuadrado perfecto más grande que divide al número: 4, 9, 16, 25, 36, 49…')};
};

G.sumrad=()=>{
for(;;){const r=pick([2,3,5]);const k1=R(2,5),k2=R(2,4);const c1=R(1,3),c2=R(1,2);const mes=Math.random()<.6;const co=mes?c1*k1+c2*k2:c1*k1-c2*k2;if(co===0||k1===k2)continue;
const n1=k1*k1*r,n2=k2*k2*r;if(n1>200||n2>200)continue;const sg=mes?'+':'−';const T=(c,n)=>`${c===1?'':c}√${n}`;
const okh=rad(co,r);const sr=mes?n1+n2:n1-n2;
const bad=[[mes||sr>0?rad(mes?c1+c2:c1-c2,sr):rad(c1*k1*k1+(mes?1:-1)*c2*k2*k2,r),t('Els radicands no es poden sumar: √a + √b ≠ √(a + b). Per exemple √9 + √16 = 3 + 4 = 7, però √25 = 5. Només se sumen radicals <b>semblants</b> (mateix radicand).','Los radicandos no se pueden sumar: √a + √b ≠ √(a + b). Por ejemplo √9 + √16 = 3 + 4 = 7, pero √25 = 5. Solo se suman radicales <b>semejantes</b> (mismo radicando).')],
[rad(mes?c1+c2:c1-c2,r),t(`Has vist que tots dos són múltiples de √${r}, però en traure el factor has de multiplicar-lo pel coeficient que ja hi havia.`,`Has visto que los dos son múltiplos de √${r}, pero al sacar el factor tienes que multiplicarlo por el coeficiente que ya había.`)],
[rad(c1*k1*k1+(mes?1:-1)*c2*k2*k2,r),t('Fora de l\'arrel ix l\'<b>arrel</b> del quadrat (k), no el quadrat sencer (k²).','Fuera de la raíz sale la <b>raíz</b> del cuadrado (k), no el cuadrado entero (k²).')],[rad(-co,r),t('Revisa el signe del resultat.','Revisa el signo del resultado.')],[rad(c1*k1*c2*k2,r),t('Els coeficients se <b>sumen</b> (o resten), no es multipliquen.','Los coeficientes se <b>suman</b> (o restan), no se multiplican.')]];
return{tip:t('Sumar radicals','Sumar radicales'),kind:'op',txt:t('Calcula i simplifica:','Calcula y simplifica:')+`<span class="gr"><span class="rd">${T(c1,n1)} ${sg} ${T(c2,n2)}</span></span>`,ok:okh,bad,
expl:[t('Simplifiquem cada radical per veure si són semblants:','Simplificamos cada radical para ver si son semejantes:'),`${c1===1?'':c1+'·'}√${n1} = ${c1===1?'':c1+'·'}√(${k1*k1}·${r}) = ${c1===1?'':c1+'·'}${k1}√${r} = ${c1*k1}√${r}`,`${c2===1?'':c2+'·'}√${n2} = ${c2===1?'':c2+'·'}√(${k2*k2}·${r}) = ${c2===1?'':c2+'·'}${k2}√${r} = ${c2*k2}√${r}`,t(`Ara són semblants (els dos porten √${r}) i sumem els coeficients: ${c1*k1} ${sg} ${c2*k2} = ${MN(co)} → <b>${okh}</b>`,`Ahora son semejantes (los dos llevan √${r}) y sumamos los coeficientes: ${c1*k1} ${sg} ${c2*k2} = ${MN(co)} → <b>${okh}</b>`)],
pista:t('Simplifica cada arrel per separat: hauria d\'aparéixer la mateixa arrel en totes dues.','Simplifica cada raíz por separado: debería aparecer la misma raíz en las dos.')}}
};

G.multrad=()=>{
const [a,b,i]=pick([[6,3,2],[2,8,2],[5,10,2],[3,12,2],[6,15,2],[2,6,2],[10,15,2],[14,7,2],[3,15,2],[2,10,2],[4,2,3],[9,6,3],[4,10,3],[2,12,3]]);
const n=a*b;const [k,r]=simp(n,i);const okh=r===1?String(k):rad(k,r,i);
const bad=[[rad(1,a+b,i),t('Les arrels del mateix índex es <b>multipliquen</b> multiplicant els radicands: √a · √b = √(a·b). No se sumen.','Las raíces del mismo índice se <b>multiplican</b> multiplicando los radicandos: √a · √b = √(a·b). No se suman.')],[rad(1,n,i),t(`És correcte, però no està simplificat: ${n} = ${pw(k,i)}·${r} i el ${k} pot eixir de l'arrel.`,`Es correcto, pero no está simplificado: ${n} = ${pw(k,i)}·${r} y el ${k} puede salir de la raíz.`)],[rad(Math.pow(k,i),r,i),t('Fora de l\'arrel ix l\'arrel del factor, no el factor sencer.','Fuera de la raíz sale la raíz del factor, no el factor entero.')]];
return{tip:t('Multiplicar radicals','Multiplicar radicales'),kind:'op',txt:t('Multiplica i simplifica:','Multiplica y simplifica:')+`<span class="gr">${rad(1,a,i)} · ${rad(1,b,i)}</span>`,ok:okh,bad,
expl:[t('Mateix índex → multipliquem dins d\'una sola arrel:','Mismo índice → multiplicamos dentro de una sola raíz:')+` ${rad(1,a,i)} · ${rad(1,b,i)} = ${rad(1,`${a}·${b}`,i)} = ${rad(1,n,i)}`,`${n} = ${pw(k,i)}·${r}`,t(`Traiem ${k} fora: <b>${okh}</b>`,`Sacamos ${k} fuera: <b>${okh}</b>`)],pista:t('Primer ajunta-ho tot en una arrel; després busca una potència perfecta dins.','Primero júntalo todo en una raíz; después busca una potencia perfecta dentro.')};
};

G.racio=()=>{
const [k,n]=pick([[6,3],[10,5],[4,2],[3,6],[5,10],[12,6],[14,7],[2,8],[9,3],[15,5],[6,8],[4,12]]);
const [s,tq]=simp(n);const g=gcd(k*s,n);const nu=k*s/g,de=n/g;const okh=de===1?rad(nu,tq):F(rad(nu,tq),de);
const ex=[t(`Multipliquem dalt i baix per √${n}, perquè √${n}·√${n} = ${n}:`,`Multiplicamos arriba y abajo por √${n}, porque √${n}·√${n} = ${n}:`)+` ${F(k,'√'+n)} = ${F(k+'·√'+n,'√'+n+'·√'+n)} = ${F(k+'√'+n,n)}`];
if(s>1)ex.push(t(`Simplifiquem √${n} = ${s}√${tq}: ${F(k+'·'+s+'√'+tq,n)} = ${F(k*s+'√'+tq,n)}`,`Simplificamos √${n} = ${s}√${tq}: ${F(k+'·'+s+'√'+tq,n)} = ${F(k*s+'√'+tq,n)}`));
ex.push(t(`Simplifiquem la fracció (entre ${g}): <b>${okh}</b>`,`Simplificamos la fracción (entre ${g}): <b>${okh}</b>`));
return{tip:t('Racionalitzar','Racionalizar'),kind:'op',txt:t('Racionalitza (lleva l\'arrel del denominador) i simplifica:','Racionaliza (quita la raíz del denominador) y simplifica:')+`<span class="gr">${F(k,rad(1,n))}</span>`,ok:okh,
bad:[[rad(k,n),t(`Has multiplicat dalt per √${n} però no baix. Si multipliques dalt i baix pel mateix, la fracció no canvia; i baix queda √${n}·√${n} = ${n}.`,`Has multiplicado arriba por √${n} pero no abajo. Si multiplicas arriba y abajo por lo mismo, la fracción no cambia; y abajo queda √${n}·√${n} = ${n}.`)],[F(rad(k,n),n*n),t(`√${n}·√${n} = ${n}, no ${n*n}.`,`√${n}·√${n} = ${n}, no ${n*n}.`)],[fr(k,n),t(`No pots llevar l'arrel sense més: √${n} no val ${n}.`,`No puedes quitar la raíz sin más: √${n} no vale ${n}.`)]],

errs:[[r2(P*p/100),t(`Això és només el ${p} % (el que ${up?'puja':'es descompta'}). Falta ${up?'sumar-lo al':'restar-lo del'} preu inicial.`,`Eso es solo el ${p} % (lo que ${up?'sube':'se descuenta'}). Falta ${up?'sumarlo al':'restarlo del'} precio inicial.`)],[up?P+p:P-p,t(`El ${p} % no són ${p} €: és ${p} de cada 100.`,`El ${p} % no son ${p} €: es ${p} de cada 100.`)],[r2(P*(up?1-p/100:1+p/100)),t(up?'Has calculat una baixada i era una pujada.':'Has calculat una pujada i era una baixada.',up?'Has calculado una bajada y era una subida.':'Has calculado una subida y era una bajada.')]],
expl:[t(`Índex de variació: ${up?'1 + ':'1 − '}${num(p/100,2)} = ${num(idx,2)}`,`Índice de variación: ${up?'1 + ':'1 − '}${num(p/100,2)} = ${num(idx,2)}`),`${eur(P)} · ${num(idx,2)} = <b>${eur(v)}</b>`,t(`Comprovació: el ${p} % de ${num(P)} és ${num(r2(P*p/100),2)} i ${num(P)} ${up?'+':'−'} ${num(r2(P*p/100),2)} = ${num(v,2)}.`,`Comprobación: el ${p} % de ${num(P)} es ${num(r2(P*p/100),2)} y ${num(P)} ${up?'+':'−'} ${num(r2(P*p/100),2)} = ${num(v,2)}.`)],pista:t('Multiplica pel índex de variació (1 + p/100 si puja, 1 − p/100 si baixa).','Multiplica por el índice de variación (1 + p/100 si sube, 1 − p/100 si baja).')};
};

G.pencad=()=>{
const [a,b]=pick([[20,-20],[10,-10],[50,-50],[25,-20],[30,-10],[10,-20],[20,-10],[40,-25],[50,-20],[10,10],[20,30],[-10,-10],[-20,-50],[60,-25]]);
const ia=1+a/100,ib=1+b/100;const tot=Math.round((ia*ib-1)*10000)/100;
const D=x=>x>0?t(`puja un ${x} %`,`sube un ${x} %`):t(`baixa un ${-x} %`,`baja un ${-x} %`);
return{tip:t('Percentatges encadenats','Porcentajes encadenados'),kind:'num',ans:tot,tol:1e-6,fmt:(tot>0?'+':'')+num(tot,2)+' %',ud:'%',
txt:t(`Un preu primer <b>${D(a)}</b> i després <b>${D(b)}</b>. Quina és la variació total en %? (escriu un número negatiu si al final ha baixat)`,`Un precio primero <b>${D(a)}</b> y después <b>${D(b)}</b>. ¿Cuál es la variación total en %? (escribe un número negativo si al final ha bajado)`),
errs:a+b!==tot?[[a+b,t('Els percentatges encadenats <b>no</b> se sumen: el segon percentatge s\'aplica sobre un preu que ja ha canviat. Cal multiplicar els índexs.','Los porcentajes encadenados <b>no</b> se suman: el segundo porcentaje se aplica sobre un precio que ya ha cambiado. Hay que multiplicar los índices.')]]:[],
expl:[t(`Índexs: ${num(ia,2)} i ${num(ib,2)}`,`Índices: ${num(ia,2)} y ${num(ib,2)}`),t(`Índex total = ${num(ia,2)} · ${num(ib,2)} = ${num(ia*ib,4)}`,`Índice total = ${num(ia,2)} · ${num(ib,2)} = ${num(ia*ib,4)}`),
tot===0?t('Índex 1 → el preu queda igual: <b>0 %</b>','Índice 1 → el precio queda igual: <b>0 %</b>'):tot>0?t(`${num(ia*ib,4)} > 1 → puja un <b>${num(tot,2)} %</b>`,`${num(ia*ib,4)} > 1 → sube un <b>${num(tot,2)} %</b>`):t(`${num(ia*ib,4)} < 1 → baixa un <b>${num(-tot,2)} %</b> (1 − ${num(ia*ib,4)} = ${num(-tot/100,4)})`,`${num(ia*ib,4)} < 1 → baja un <b>${num(-tot,2)} %</b> (1 − ${num(ia*ib,4)} = ${num(-tot/100,4)})`),
t('Prova amb 100 €: ','Prueba con 100 €: ')+`100 → ${num(100*ia,2)} → ${num(100*ia*ib,2)} €`],pista:t('Multiplica els dos índexs de variació. Prova amb un preu de 100 €.','Multiplica los dos índices de variación. Prueba con un precio de 100 €.')};
};

G.pinv=()=>{
const O=pick([40,60,80,120,200,250,160]);const p=pick([10,20,25,40,50]);const up=Math.random()<.4;const idx=up?1+p/100:1-p/100;const Fv=r2(O*idx);
return{tip:t('Calcular el preu inicial','Calcular el precio inicial'),kind:'num',ans:O,tol:0.006,fmt:eur(O),ud:'€',
txt:up?t(`Després de pujar un ${p} %, un abonament costa ${eur(Fv)}. Quant costava abans?`,`Después de subir un ${p} %, un abono cuesta ${eur(Fv)}. ¿Cuánto costaba antes?`):t(`Amb un descompte del ${p} % has pagat ${eur(Fv)} per una bossa de tennis. Quant costava sense descompte?`,`Con un descuento del ${p} % has pagado ${eur(Fv)} por una bolsa de tenis. ¿Cuánto costaba sin descuento?`),
errs:[[r2(Fv*(up?1-p/100:1+p/100)),t(`El ${p} % es calcula sobre el preu <b>inicial</b>, no sobre el final. Per tornar enrere has de <b>dividir</b> per l'índex, no aplicar el percentatge al revés.`,`El ${p} % se calcula sobre el precio <b>inicial</b>, no sobre el final. Para volver atrás tienes que <b>dividir</b> por el índice, no aplicar el porcentaje al revés.`)],[r2(Fv*idx),t('Has tornat a aplicar el canvi. Per desfer-lo has de dividir per l\'índex.','Has vuelto a aplicar el cambio. Para deshacerlo tienes que dividir por el índice.')]],
expl:[t(`Preu inicial · ${num(idx,2)} = ${num(Fv,2)}`,`Precio inicial · ${num(idx,2)} = ${num(Fv,2)}`),t(`Preu inicial = ${num(Fv,2)} : ${num(idx,2)} = <b>${eur(O)}</b>`,`Precio inicial = ${num(Fv,2)} : ${num(idx,2)} = <b>${eur(O)}</b>`),t(`Comprovació: ${num(O)} · ${num(idx,2)} = ${num(Fv,2)} ✓`,`Comprobación: ${num(O)} · ${num(idx,2)} = ${num(Fv,2)} ✓`)],pista:t('Al revés que multiplicar per l\'índex és… dividir per l\'índex.','Lo contrario de multiplicar por el índice es… dividir por el índice.')};
};

G.pquin=()=>{
for(;;){const B=pick([80,120,200,250,40,60,150,300,25]);const p=pick([5,10,12,15,20,25,30,35,40,45,60,75,8]);const A=B*p/100;if(A!==Math.round(A))continue;
const ctx=pick([[t(`De ${B} primers servicis, Luca n'ha encertat ${A}.`,`De ${B} primeros saques, Luca ha acertado ${A}.`),t('Quin percentatge ha encertat?','¿Qué porcentaje ha acertado?')],[t(`En un club de ${B} socis, ${A} juguen a pàdel.`,`En un club de ${B} socios, ${A} juegan al pádel.`),t('Quin percentatge representen?','¿Qué porcentaje representan?')],[t(`Una samarreta de ${B} € té un descompte de ${A} €.`,`Una camiseta de ${B} € tiene un descuento de ${A} €.`),t('Quin percentatge de descompte és?','¿Qué porcentaje de descuento es?')]]);
return{tip:t('Quin tant per cent?','¿Qué tanto por ciento?'),kind:'num',ans:p,tol:1e-6,fmt:p+' %',ud:'%',txt:ctx[0]+' '+ctx[1],
errs:[[A/B,t(`${num(A/B,4)} és la proporció en tant per u. Per passar a tant per cent multiplica per 100.`,`${num(A/B,4)} es la proporción en tanto por uno. Para pasar a tanto por ciento multiplica por 100.`)],[r2(B/A*100),t('Has dividit al revés: és la part entre el total.','Has dividido al revés: es la parte entre el total.')]],
expl:[t('Percentatge = part : total · 100','Porcentaje = parte : total · 100'),`${A} : ${B} = ${num(A/B,4)}`,`${num(A/B,4)} · 100 = <b>${p} %</b>`],pista:t('Divideix la part entre el total i multiplica per 100.','Divide la parte entre el total y multiplica por 100.')}}
};

G.pinteres=()=>{
const C=pick([500,1000,1200,2000,800,1500]);const r=pick([2,3,4,5]);const n=pick([2,3]);const v=r2(C*Math.pow(1+r/100,n));
return{tip:t('Interés compost','Interés compuesto'),kind:'num',ans:v,tol:0.011,fmt:eur(v),ud:'€',
txt:t(`Luca guarda ${eur(C)} en un compte al <b>${r} % anual d'interés compost</b>. Quants diners tindrà al cap de <b>${n} anys</b>? (arrodoneix als cèntims)`,`Luca guarda ${eur(C)} en una cuenta al <b>${r} % anual de interés compuesto</b>. ¿Cuánto dinero tendrá al cabo de <b>${n} años</b>? (redondea a los céntimos)`),
errs:[[r2(C*(1+r*n/100)),t('Això és interés <b>simple</b> (sempre el mateix interés cada any). En el compost, cada any l\'interés es calcula sobre els diners que ja tens, interessos inclosos.','Eso es interés <b>simple</b> (siempre el mismo interés cada año). En el compuesto, cada año el interés se calcula sobre el dinero que ya tienes, intereses incluidos.')],[r2(C*Math.pow(1+r/100,n)-C),t('Això són només els interessos guanyats. La pregunta és quants diners tindrà en total.','Eso son solo los intereses ganados. La pregunta es cuánto dinero tendrá en total.')],[r2(C*Math.pow(1+r,n)),t(`El ${r} % és ${num(r/100,2)}: l'índex és ${num(1+r/100,2)}, no ${1+r}.`,`El ${r} % es ${num(r/100,2)}: el índice es ${num(1+r/100,2)}, no ${1+r}.`)]],
expl:[t('Fórmula: C<sub>final</sub> = C · (1 + r/100)<sup>n</sup>','Fórmula: C<sub>final</sub> = C · (1 + r/100)<sup>n</sup>'),`${num(C)} · ${pw(num(1+r/100,2),n)} = ${num(C)} · ${num(Math.pow(1+r/100,n),6)}`,`= <b>${eur(v)}</b>`,t(`Cada any multipliques per ${num(1+r/100,2)}: `,`Cada año multiplicas por ${num(1+r/100,2)}: `)+Array.from({length:n+1},(_,i)=>num(r2(C*Math.pow(1+r/100,i)),2)).join(' → ')],pista:t('Cada any els diners es multipliquen per (1 + r/100).','Cada año el dinero se multiplica por (1 + r/100).')};
};
</script>

{id:'log',ic:'log',sup:'terra',nom:()=>t('Logaritmes','Logaritmos'),sub:()=>t('Definició, propietats, equacions exponencials','Definición, propiedades, ecuaciones exponenciales'),gens:['ldef','linc','lprop','laprox','lexist','lexp'],

{id:'perc',ic:'%',sup:'dura',nom:()=>t('Percentatges','Porcentajes'),sub:()=>t('Índex de variació, encadenats, interés compost','Índice de variación, encadenados, interés compuesto'),gens:['pindex','pfinal','pencad','pinv','pquin','pinteres'],
curio:()=>t('Si alguna cosa baixa un 50 %, després ha de pujar un 100 % (no un 50 %) per tornar al preu inicial. Les botigues ho saben molt bé.','Si algo baja un 50 %, después tiene que subir un 100 % (no un 50 %) para volver al precio inicial. Las tiendas lo saben muy bien.')}
];

reals:()=>[
{h:t('Per a què serveix?','¿Para qué sirve?'),b:`<p>${t('Els <b>nombres reals</b> són tots els nombres que pots col·locar en una recta: enters, fraccions, decimals i també nombres com √2 o π, que tenen infinits decimals sense repetició.','Los <b>números reales</b> son todos los números que puedes colocar en una recta: enteros, fracciones, decimales y también números como √2 o π, que tienen infinitos decimales sin repetición.')}</p>
<p>${t('La diagonal d\'una pista de tennis, la longitud d\'una circumferència o el costat d\'un quadrat de 2 m² són nombres reals que no es poden escriure exactament amb una fracció.','La diagonal de una pista de tenis, la longitud de una circunferencia o el lado de un cuadrado de 2 m² son números reales que no se pueden escribir exactamente con una fracción.')}</p>

${PQ(t('Amb els intervals podem escriure, en molt poc espai, infinits nombres alhora. També són la forma de donar les solucions de les inequacions.','Con los intervalos podemos escribir, en muy poco espacio, infinitos números a la vez. También son la forma de dar las soluciones de las inecuaciones.'))}`},
{h:t('Els conjunts de nombres','Los conjuntos de números'),b:`<table class="taula"><tr><th>${t('Conjunt','Conjunto')}</th><th>${t('Què són','Qué son')}</th><th>${t('Exemples','Ejemplos')}</th></tr>

{h:t('Aproximacions i errors','Aproximaciones y errores'),b:`<p>${t('Com que molts reals tenen infinits decimals, en la pràctica en fem servir una <b>aproximació</b>.','Como muchos reales tienen infinitos decimales, en la práctica usamos una <b>aproximación</b>.')}</p>

${PQ(t('L\'error relatiu diu si una aproximació és bona: equivocar-se 1 cm en una pista de 24 m és molt menys greu que equivocar-se 1 cm en una pilota de 6,7 cm.','El error relativo dice si una aproximación es buena: equivocarse 1 cm en una pista de 24 m es mucho menos grave que equivocarse 1 cm en una pelota de 6,7 cm.'))}`},

<tr><td>x &gt; 1</td><td>(1, +∞)</td><td>${t('semirecta','semirrecta')}</td></tr>
<tr><td>x ≤ 4</td><td>(−∞, 4]</td><td>${t('semirecta','semirrecta')}</td></tr></table>
${RG(t('<b>[ ]</b> claudàtor = l\'extrem <b>entra</b> (≤, ≥) → punt ple ●<br><b>( )</b> parèntesi = l\'extrem <b>no entra</b> (&lt;, &gt;) → punt buit ○<br><b>∞</b> sempre porta parèntesi','<b>[ ]</b> corchete = el extremo <b>entra</b> (≤, ≥) → punto lleno ●<br><b>( )</b> paréntesis = el extremo <b>no entra</b> (&lt;, &gt;) → punto hueco ○<br><b>∞</b> siempre lleva paréntesis'))}
${EX('[−2, 3)  ⟺  −2 ≤ x &lt; 3',linia([iv(-2,3,true,false)],-5,5))}
${EX('(1, +∞)  ⟺  x &gt; 1',linia([iv(1,Infinity,false,false)],-5,5))}
${CP(t('S\'escriu sempre de menor a major: (−2, 3), mai (3, −2).','Se escribe siempre de menor a mayor: (−2, 3), nunca (3, −2).'))}`},
{h:t('Unió, intersecció i valor absolut','Unión, intersección y valor absoluto'),b:`<ul class="ll"><li>${t('<b>A ∪ B</b> (unió): els nombres que són en A <b>o</b> en B.','<b>A ∪ B</b> (unión): los números que están en A <b>o</b> en B.')}</li><li>${t('<b>A ∩ B</b> (intersecció): els nombres que són en A <b>i</b> en B alhora.','<b>A ∩ B</b> (intersección): los números que están en A <b>y</b> en B a la vez.')}</li></ul>
${EX(t('A = [−3, 2) i B = (0, 5]','A = [−3, 2) y B = (0, 5]'),linia([{...iv(-3,2,true,false),lb:'A'},{...iv(0,5,false,true),lb:'B'}],-5,6)+t('<p>A ∩ B = <b>(0, 2)</b>: el tros on hi ha les dues ratlles. El 0 no entra (no és en B) i el 2 tampoc (no és en A).</p><p>A ∪ B = <b>[−3, 5]</b>: tot el que està pintat.</p>','<p>A ∩ B = <b>(0, 2)</b>: el trozo donde están las dos rayas. El 0 no entra (no está en B) y el 2 tampoco (no está en A).</p><p>A ∪ B = <b>[−3, 5]</b>: todo lo que está pintado.</p>'))}
<h3>${t('Valor absolut i entorns','Valor absoluto y entornos')}</h3>
<p>${t('|x| és la <b>distància</b> de x al 0 (sempre positiva): |−4| = 4. I |x − a| és la distància entre x i a.','|x| es la <b>distancia</b> de x al 0 (siempre positiva): |−4| = 4. Y |x − a| es la distancia entre x y a.')}</p>
${RG(t('|x − a| ≤ r ⟺ a − r ≤ x ≤ a + r ⟺ [a − r, a + r]<br>(entorn de centre <b>a</b> i radi <b>r</b>)','|x − a| ≤ r ⟺ a − r ≤ x ≤ a + r ⟺ [a − r, a + r]<br>(entorno de centro <b>a</b> y radio <b>r</b>)'))}
${EX('|x − 2| &lt; 3',t('Distància a 2 menor que 3: de 2 − 3 = −1 fins a 2 + 3 = 5 → <b>(−1, 5)</b>','Distancia a 2 menor que 3: de 2 − 3 = −1 hasta 2 + 3 = 5 → <b>(−1, 5)</b>')+linia([iv(-1,5,false,false)],-3,7))}
${CP(t('|x + 1| ≤ 2 vol dir |x − (−1)| ≤ 2: el centre és <b>−1</b>, no 1. Solució: [−3, 1].','|x + 1| ≤ 2 quiere decir |x − (−1)| ≤ 2: el centro es <b>−1</b>, no 1. Solución: [−3, 1].'))}`}
],
pot:()=>[
{h:t('Per a què serveix?','¿Para qué sirve?'),b:`<p>${t('Les potències són una manera curta d\'escriure multiplicacions repetides: 2·2·2·2·2 = 2⁵. Apareixen sempre que alguna cosa es <b>duplica</b>, <b>triplica</b> o creix (o decreix) en la mateixa proporció una vegada i una altra.','Las potencias son una manera corta de escribir multiplicaciones repetidas: 2·2·2·2·2 = 2⁵. Aparecen siempre que algo se <b>duplica</b>, <b>triplica</b> o crece (o decrece) en la misma proporción una y otra vez.')}</p>
<ul class="ll"><li>${t('Un quadre de 128 jugadors (2⁷) necessita 7 rondes per tindre campió.','Un cuadro de 128 jugadores (2⁷) necesita 7 rondas para tener campeón.')}</li><li>${t('Els bacteris que es divideixen cada hora: 2ⁿ al cap de n hores.','Las bacterias que se dividen cada hora: 2ⁿ al cabo de n horas.')}</li><li>${t('La memòria dels mòbils: 1 kB = 2¹⁰ bytes, 1 GB = 2³⁰ bytes.','La memoria de los móviles: 1 kB = 2¹⁰ bytes, 1 GB = 2³⁰ bytes.')}</li></ul>
${PQ(t('Les propietats de les potències et permeten fer càlculs enormes de cap, sense calculadora, i són la base de la notació científica, els radicals i els logaritmes.','Las propiedades de las potencias te permiten hacer cálculos enormes de cabeza, sin calculadora, y son la base de la notación científica, los radicales y los logaritmos.'))}`},
{h:t('Exponent zero i negatiu','Exponente cero y negativo'),b:`${RG(t('aⁿ = a · a · … · a (n vegades) &nbsp; a = <b>base</b>, n = <b>exponent</b><br>a¹ = a &nbsp;&nbsp; a⁰ = 1 (a ≠ 0)<br>a<sup>−n</sup> = 1 / aⁿ &nbsp;&nbsp; (a/b)<sup>−n</sup> = (b/a)ⁿ','aⁿ = a · a · … · a (n veces) &nbsp; a = <b>base</b>, n = <b>exponente</b><br>a¹ = a &nbsp;&nbsp; a⁰ = 1 (a ≠ 0)<br>a<sup>−n</sup> = 1 / aⁿ &nbsp;&nbsp; (a/b)<sup>−n</sup> = (b/a)ⁿ'))}
${PQ(t('a³ : a³ = 1 (un nombre dividit per ell mateix), però per la regla de la divisió a³ : a³ = a<sup>3−3</sup> = a⁰. Per tant a⁰ = 1.<br>I a² : a⁵ = a<sup>−3</sup>, però també = (a·a)/(a·a·a·a·a) = 1/a³. Per això a<sup>−3</sup> = 1/a³.','a³ : a³ = 1 (un número dividido por sí mismo), pero por la regla de la división a³ : a³ = a<sup>3−3</sup> = a⁰. Por tanto a⁰ = 1.<br>Y a² : a⁵ = a<sup>−3</sup>, pero también = (a·a)/(a·a·a·a·a) = 1/a³. Por eso a<sup>−3</sup> = 1/a³.'))}
${EX('',`2<sup>−3</sup> = ${F(1,'2³')} = <b>${F(1,8)}</b> &nbsp;&nbsp; 10<sup>−2</sup> = ${F(1,100)} = <b>0,01</b> &nbsp;&nbsp; (${F(2,3)})<sup>−2</sup> = (${F(3,2)})² = <b>${F(9,4)}</b>`)}
${CP(t('L\'exponent negatiu <b>no</b> fa negatiu el resultat: 2<sup>−3</sup> = 1/8, no −8 ni −6.','El exponente negativo <b>no</b> hace negativo el resultado: 2<sup>−3</sup> = 1/8, no −8 ni −6.'))}`},
{h:t('Potències i signes','Potencias y signos'),b:`<p>${t('Si la base és negativa, el resultat depén de l\'exponent:','Si la base es negativa, el resultado depende del exponente:')}</p>
${RG(t('(−a)<sup>parell</sup> → <b>positiu</b> &nbsp;&nbsp; (−2)⁴ = 16<br>(−a)<sup>senar</sup> → <b>negatiu</b> &nbsp;&nbsp; (−2)³ = −8','(−a)<sup>par</sup> → <b>positivo</b> &nbsp;&nbsp; (−2)⁴ = 16<br>(−a)<sup>impar</sup> → <b>negativo</b> &nbsp;&nbsp; (−2)³ = −8'))}
${CP(t('Mira el parèntesi! <b>(−3)²</b> = (−3)·(−3) = 9, però <b>−3²</b> = −(3·3) = −9. Sense parèntesi, l\'exponent només afecta el número, no el signe. Igual: (−5)⁰ = 1 però −5⁰ = −1.','¡Mira el paréntesis! <b>(−3)²</b> = (−3)·(−3) = 9, pero <b>−3²</b> = −(3·3) = −9. Sin paréntesis, el exponente solo afecta al número, no al signo. Igual: (−5)⁰ = 1 pero −5⁰ = −1.'))}
${CP(t('Una potència no és «base per exponent»: 3⁴ = 3·3·3·3 = 81, no 12.','Una potencia no es «base por exponente»: 3⁴ = 3·3·3·3 = 81, no 12.'))}`},
{h:t('Propietats','Propiedades'),b:`<table class="taula"><tr><th>${t('Operació','Operación')}</th><th>${t('Regla','Regla')}</th><th>${t('Exemple','Ejemplo')}</th></tr>
<tr><td>${t('Producte, mateixa base','Producto, misma base')}</td><td>aᵐ · aⁿ = a<sup>m+n</sup></td><td>2³ · 2⁴ = 2⁷</td></tr>
<tr><td>${t('Quocient, mateixa base','Cociente, misma base')}</td><td>aᵐ : aⁿ = a<sup>m−n</sup></td><td>5² : 5⁶ = 5<sup>−4</sup></td></tr>
<tr><td>${t('Potència de potència','Potencia de potencia')}</td><td>(aᵐ)ⁿ = a<sup>m·n</sup></td><td>(3²)<sup>−3</sup> = 3<sup>−6</sup></td></tr>
<tr><td>${t('Mateix exponent','Mismo exponente')}</td><td>aⁿ · bⁿ = (a·b)ⁿ</td><td>2³ · 5³ = 10³</td></tr>
<tr><td>${t('Mateix exponent','Mismo exponente')}</td><td>aⁿ : bⁿ = (a/b)ⁿ</td><td>6⁴ : 3⁴ = 2⁴</td></tr></table>
${CP(t('• 2³ · 2⁴ ≠ 4⁷ (la base no es multiplica).<br>• 2³ + 2⁴ ≠ 2⁷ (per a sumes <b>no</b> hi ha regla: 8 + 16 = 24).<br>• En (aᵐ)ⁿ es multipliquen; en aᵐ·aⁿ se sumen.','• 2³ · 2⁴ ≠ 4⁷ (la base no se multiplica).<br>• 2³ + 2⁴ ≠ 2⁷ (para sumas <b>no</b> hay regla: 8 + 16 = 24).<br>• En (aᵐ)ⁿ se multiplican; en aᵐ·aⁿ se suman.'))}`},
{h:t('Simplificar amb canvi de base','Simplificar con cambio de base'),b:`<p>${t('Si les bases són diferents però són potències del mateix número (4 = 2², 8 = 2³, 9 = 3²…), primer les escrivim totes amb la mateixa base.','Si las bases son distintas pero son potencias del mismo número (4 = 2², 8 = 2³, 9 = 3²…), primero las escribimos todas con la misma base.')}</p>
${EX('',`${F('2³ · 4<sup>−1</sup>','8²')}<ol class="passos"><li>${t('Canvi de base','Cambio de base')}: 4<sup>−1</sup> = (2²)<sup>−1</sup> = 2<sup>−2</sup> ; 8² = (2³)² = 2⁶</li><li>${t('Numerador','Numerador')}: 2³ · 2<sup>−2</sup> = 2<sup>3+(−2)</sup> = 2¹</li><li>${t('Divisió','División')}: 2¹ : 2⁶ = 2<sup>1−6</sup> = 2<sup>−5</sup></li><li>2<sup>−5</sup> = <b>${F(1,32)}</b></li></ol>`)}
${EX('',`${F('3<sup>4</sup> · 9<sup>−3</sup>','27<sup>−1</sup>')} = ${F('3⁴ · 3<sup>−6</sup>','3<sup>−3</sup>')} = ${F('3<sup>−2</sup>','3<sup>−3</sup>')} = 3<sup>−2−(−3)</sup> = 3¹ = <b>3</b>`)}
${PQ(t('Treballar amb exponents és molt més ràpid que calcular cada potència: 8² = 64 i 2⁵ = 32 es veuen de seguida que donen 2.','Trabajar con exponentes es mucho más rápido que calcular cada potencia.'))}`},
{h:t('Resum','Resumen'),b:RG('a⁰ = 1 &nbsp;·&nbsp; a<sup>−n</sup> = 1/aⁿ &nbsp;·&nbsp; (a/b)<sup>−n</sup> = (b/a)ⁿ<br>aᵐ·aⁿ = a<sup>m+n</sup> &nbsp;·&nbsp; aᵐ:aⁿ = a<sup>m−n</sup> &nbsp;·&nbsp; (aᵐ)ⁿ = a<sup>m·n</sup><br>(−a)<sup>'+t('parell','par')+'</sup> > 0 &nbsp;·&nbsp; (−a)<sup>'+t('senar','impar')+'</sup> < 0 &nbsp;·&nbsp; −a² ≠ (−a)²')+`<p>${t('Estratègia: tot a la mateixa base → suma/resta/multiplica exponents → calcula al final.','Estrategia: todo a la misma base → suma/resta/multiplica exponentes → calcula al final.')}</p>`}
],
cient:()=>[
{h:t('Per a què serveix?','¿Para qué sirve?'),b:`<p>${t('La massa de la Terra és 5 970 000 000 000 000 000 000 000 kg. La d\'un àtom d\'hidrogen, 0,000 000 000 000 000 000 000 000 001 67 kg. Escriure i operar amb això és impossible sense equivocar-se.','La masa de la Tierra es 5 970 000 000 000 000 000 000 000 kg. La de un átomo de hidrógeno, 0,000 000 000 000 000 000 000 000 001 67 kg. Escribir y operar con eso es imposible sin equivocarse.')}</p>
<p>${t('Amb notació científica: 5,97·10²⁴ kg i 1,67·10<sup>−27</sup> kg. Curt, clar i es veu de seguida quin és més gran.','Con notación científica: 5,97·10²⁴ kg y 1,67·10<sup>−27</sup> kg. Corto, claro y se ve enseguida cuál es mayor.')}</p>
${PQ(t('La fan servir la física, la química, la biologia i l\'astronomia. I la calculadora: quan veus «2.5E-6» vol dir 2,5·10<sup>−6</sup>.','La usan la física, la química, la biología y la astronomía. Y la calculadora: cuando ves «2.5E-6» quiere decir 2,5·10<sup>−6</sup>.'))}`},
{h:t('Com s\'escriu','Cómo se escribe'),b:`${RG(t('a · 10ⁿ &nbsp; amb &nbsp; <b>1 ≤ a &lt; 10</b> &nbsp; (una sola xifra no nul·la davant de la coma)<br>n = nombre de llocs que es mou la coma','a · 10ⁿ &nbsp; con &nbsp; <b>1 ≤ a &lt; 10</b> &nbsp; (una sola cifra no nula delante de la coma)<br>n = número de lugares que se mueve la coma'))}
${EX(t('Nombre gran → exponent positiu','Número grande → exponente positivo'),t('47 000 000: posem la coma darrere del 4 → 4,7. De 4,7 a 47 000 000 la coma es mou 7 llocs a la dreta → <b>4,7·10⁷</b>','47 000 000: ponemos la coma detrás del 4 → 4,7. De 4,7 a 47 000 000 la coma se mueve 7 lugares a la derecha → <b>4,7·10⁷</b>'))}
${EX(t('Nombre menut → exponent negatiu','Número pequeño → exponente negativo'),t('0,000 52: la primera xifra no nul·la és el 5 → 5,2. De 5,2 a 0,000 52 la coma es mou 4 llocs a l\'esquerra → <b>5,2·10<sup>−4</sup></b>','0,000 52: la primera cifra no nula es el 5 → 5,2. De 5,2 a 0,000 52 la coma se mueve 4 lugares a la izquierda → <b>5,2·10<sup>−4</sup></b>'))}
${CP(t('52·10<sup>−5</sup> té el mateix valor, però <b>no</b> és notació científica (52 té dues xifres). Tampoc 0,52·10<sup>−3</sup>.','52·10<sup>−5</sup> tiene el mismo valor, pero <b>no</b> es notación científica (52 tiene dos cifras). Tampoco 0,52·10<sup>−3</sup>.'))}
${PQ(t('Comparar és fàcil: mana l\'exponent. 3·10<sup>−5</sup> &gt; 9·10<sup>−6</sup> perquè −5 &gt; −6.','Comparar es fácil: manda el exponente. 3·10<sup>−5</sup> &gt; 9·10<sup>−6</sup> porque −5 &gt; −6.'))}`},
{h:t('Multiplicar i dividir','Multiplicar y dividir'),b:`${RG(t('<b>Multiplicar:</b> mantisses × mantisses, exponents se <b>sumen</b><br><b>Dividir:</b> mantisses : mantisses, exponents es <b>resten</b><br>Al final: ajusta perquè la mantissa quede entre 1 i 10','<b>Multiplicar:</b> mantisas × mantisas, exponentes se <b>suman</b><br><b>Dividir:</b> mantisas : mantisas, exponentes se <b>restan</b><br>Al final: ajusta para que la mantisa quede entre 1 y 10'))}
${EX('',`(3·10⁵) · (4·10<sup>−2</sup>)<ol class="passos"><li>3 · 4 = 12</li><li>5 + (−2) = 3 → 12·10³</li><li>${t('12 no és entre 1 i 10: 12 = 1,2·10, l\'exponent puja 1','12 no está entre 1 y 10: 12 = 1,2·10, el exponente sube 1')} → <b>1,2·10⁴</b></li></ol>`)}
${EX('',`(1,2·10³) : (4·10<sup>−5</sup>)<ol class="passos"><li>1,2 : 4 = 0,3</li><li>3 − (−5) = 8 → 0,3·10⁸</li><li>${t('0,3 és menor que 1: 0,3 = 3·10<sup>−1</sup>, l\'exponent baixa 1','0,3 es menor que 1: 0,3 = 3·10<sup>−1</sup>, el exponente baja 1')} → <b>3·10⁷</b></li></ol>`)}
${CP(t('Si la mantissa es fa més gran (12 → 1,2), l\'exponent puja; si es fa més menuda (0,3 → 3), l\'exponent baixa. El valor no pot canviar.','Si la mantisa se hace más grande (12 → 1,2), el exponente sube; si se hace más pequeña (0,3 → 3), el exponente baja. El valor no puede cambiar.'))}`},
{h:t('Sumar i restar','Sumar y restar'),b:`<p>${t('Només podem sumar mantisses si les potències de 10 són <b>iguals</b>. Si no ho són, primer les igualem (normalment a la més gran).','Solo podemos sumar mantisas si las potencias de 10 son <b>iguales</b>. Si no lo son, primero las igualamos (normalmente a la mayor).')}</p>
${EX('',`3,2·10⁵ + 4·10⁴<ol class="passos"><li>4·10⁴ = 0,4·10⁵ ${t('(la coma es mou 1 lloc a l\'esquerra i l\'exponent puja 1)','(la coma se mueve 1 lugar a la izquierda y el exponente sube 1)')}</li><li>(3,2 + 0,4)·10⁵</li><li><b>3,6·10⁵</b></li></ol>`)}
${EX('',`7,5·10<sup>−3</sup> − 8·10<sup>−5</sup><ol class="passos"><li>8·10<sup>−5</sup> = 0,08·10<sup>−3</sup></li><li>(7,5 − 0,08)·10<sup>−3</sup> = <b>7,42·10<sup>−3</sup></b></li></ol>`)}
${CP(t('3,2·10⁵ + 4·10⁴ ≠ 7,2·10⁵ i ≠ 7,2·10⁹. En les sumes els exponents <b>no</b> se sumen.','3,2·10⁵ + 4·10⁴ ≠ 7,2·10⁵ y ≠ 7,2·10⁹. En las sumas los exponentes <b>no</b> se suman.'))}
${PQ(t('Si un nombre és moltíssim més gran que l\'altre (10⁹ + 10²), la suma quasi no canvia el gran: per això en ciència sovint es «menysprea» el menut.','Si un número es muchísimo mayor que el otro (10⁹ + 10²), la suma casi no cambia el grande: por eso en ciencia a menudo se «desprecia» el pequeño.'))}`}
],
rad:()=>[
{h:t('Per a què serveix?','¿Para qué sirve?'),b:`<p>${t('Les arrels desfan les potències: si un quadrat té 50 m² d\'àrea, el seu costat és √50 m. Si un cub té 27 cm³, la seua aresta és ∛27 = 3 cm.','Las raíces deshacen las potencias: si un cuadrado tiene 50 m² de área, su lado es √50 m. Si un cubo tiene 27 cm³, su arista es ∛27 = 3 cm.')}</p>
<p>${t('Amb Pitàgores apareixen contínuament: la diagonal d\'una pista d\'individuals (23,77 × 8,23 m) és √(23,77² + 8,23²) ≈ 25,15 m.','Con Pitágoras aparecen continuamente: la diagonal de una pista de individuales (23,77 × 8,23 m) es √(23,77² + 8,23²) ≈ 25,15 m.')}</p>
${PQ(t('Treballar amb radicals <b>exactes</b> (5√2 en lloc de 7,0710678…) evita errors d\'arrodoniment i fa que els resultats siguen més clars. Racionalitzar, a més, facilita dividir i comparar.','Trabajar con radicales <b>exactos</b> (5√2 en lugar de 7,0710678…) evita errores de redondeo y hace que los resultados sean más claros. Racionalizar, además, facilita dividir y comparar.'))}`},
{h:t('Radicals i potències','Radicales y potencias'),b:`${RG(t('ⁿ√a = b ⟺ bⁿ = a &nbsp;&nbsp; (n = <b>índex</b>, a = <b>radicand</b>)<br>ⁿ√(aᵐ) = a<sup>m/n</sup>','ⁿ√a = b ⟺ bⁿ = a &nbsp;&nbsp; (n = <b>índice</b>, a = <b>radicando</b>)<br>ⁿ√(aᵐ) = a<sup>m/n</sup>'))}
<ul class="ll"><li>${t('Índex parell (√, ⁴√…): el radicand ha de ser ≥ 0. √(−4) no existeix en ℝ.','Índice par (√, ⁴√…): el radicando tiene que ser ≥ 0. √(−4) no existe en ℝ.')}</li><li>${t('Índex senar (∛…): qualsevol radicand. ∛(−8) = −2.','Índice impar (∛…): cualquier radicando. ∛(−8) = −2.')}</li></ul>
${EX('',`${rad(1,'x³',5)} = x<sup>3/5</sup> &nbsp;&nbsp; 7<sup>2/3</sup> = ${rad(1,'7²',3)}<br>8<sup>2/3</sup> = (∛8)² = 2² = <b>4</b> &nbsp;&nbsp; 16<sup>3/4</sup> = (⁴√16)³ = 2³ = <b>8</b><br>4<sup>−1/2</sup> = ${F(1,'√4')} = <b>${F(1,2)}</b>`)}
${PQ(t('Com que les arrels són potències d\'exponent fraccionari, totes les propietats de les potències funcionen també amb arrels.','Como las raíces son potencias de exponente fraccionario, todas las propiedades de las potencias funcionan también con raíces.'))}
${CP(t('8<sup>2/3</sup> no és 8·2/3. Primer fes l\'arrel (denominador) i després la potència (numerador).','8<sup>2/3</sup> no es 8·2/3. Primero haz la raíz (denominador) y después la potencia (numerador).'))}`},
{h:t('Extraure i introduir factors','Extraer e introducir factores'),b:`<p>${t('Si dins de l\'arrel hi ha un factor elevat a l\'índex, pot eixir fora sense arrel.','Si dentro de la raíz hay un factor elevado al índice, puede salir fuera sin raíz.')}</p>
${EX('',`√72<ol class="passos"><li>${t('Descomponem','Descomponemos')}: 72 = 2³·3² = 2²·2·3² ${t('o bé','o bien')} 72 = 36 · 2</li><li>√72 = √36 · √2</li><li>√36 = 6 → <b>6√2</b></li></ol>`)}
${EX('',`∛54 = ∛(27·2) = ∛27 · ∛2 = <b>3∛2</b>`)}

{h:t('Equacions exponencials','Ecuaciones exponenciales'),b:`<p>${t('La incògnita està a l\'exponent. Dos mètodes:','La incógnita está en el exponente. Dos métodos:')}</p>

TEORIA.reals=(f=>()=>{const p=f();p.push({h:t('Resum','Resumen'),b:RG(t('ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ · 𝕀 = decimals infinits no periòdics<br>[ ] entra ● · ( ) no entra ○ · ∞ sempre amb ( )<br>A ∪ B = en A o en B · A ∩ B = en A i en B<br>|x − a| ≤ r ⟺ [a − r, a + r]<br>Error absolut = |real − aproximat|','ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ · 𝕀 = decimales infinitos no periódicos<br>[ ] entra ● · ( ) no entra ○ · ∞ siempre con ( )<br>A ∪ B = en A o en B · A ∩ B = en A y en B<br>|x − a| ≤ r ⟺ [a − r, a + r]<br>Error absoluto = |real − aproximado|'))});return p})(TEORIA.reals);
TEORIA.cient=(f=>()=>{const p=f();p.push({h:t('Resum','Resumen'),b:RG(t('a · 10ⁿ amb 1 ≤ a &lt; 10<br>Gran → n positiu · Menut (0,…) → n negatiu<br>× : mantisses ×, exponents + · ÷ : mantisses ÷, exponents −<br>+ / − : primer iguala exponents<br>Al final, ajusta: mantissa més gran → exponent baixa; més menuda → puja','a · 10ⁿ con 1 ≤ a &lt; 10<br>Grande → n positivo · Pequeño (0,…) → n negativo<br>× : mantisas ×, exponentes + · ÷ : mantisas ÷, exponentes −<br>+ / − : primero iguala exponentes<br>Al final, ajusta: mantisa más grande → exponente baja; más pequeña → sube'))});return p})(TEORIA.cient);
TEORIA.rad=(f=>()=>{const p=f();p.push({h:t('Resum','Resumen'),b:RG('ⁿ√(aᵐ) = a<sup>m/n</sup><br>√(k²·r) = k√r · '+t('introduir','introducir')+': k√r = √(k²·r)<br>a√r + b√r = (a+b)√r · √a·√b = √(ab)<br>'+F('k','√n')+' = '+F('k√n','n')+' · '+t('conjugat de','conjugado de')+' √p + q = √p − q<br>(a+b)(a−b) = a² − b²')});return p})(TEORIA.rad);
TEORIA.log=(f=>()=>{const p=f();p.push({h:t('Resum','Resumen'),b:RG(t('log<sub>b</sub> x = y ⟺ b<sup>y</sup> = x · només x &gt; 0<br>log 1 = 0 · log<sub>b</sub> b = 1 · log = base 10<br>log(xy) = log x + log y · log(x/y) = log x − log y<br>log xⁿ = n log x · log<sub>b</sub> x = log x / log b<br>bˣ = c → iguala bases o pren logaritmes','log<sub>b</sub> x = y ⟺ b<sup>y</sup> = x · solo x &gt; 0<br>log 1 = 0 · log<sub>b</sub> b = 1 · log = base 10<br>log(xy) = log x + log y · log(x/y) = log x − log y<br>log xⁿ = n log x · log<sub>b</sub> x = log x / log b<br>bˣ = c → iguala bases o toma logaritmos'))});return p})(TEORIA.log);
TEORIA.perc=(f=>()=>{const p=f();p.push({h:t('Resum','Resumen'),b:RG(t('Pujar p % → ×(1 + p/100) · Baixar p % → ×(1 − p/100)<br>Encadenats → multiplica índexs<br>Inicial = final : índex<br>% = part : total · 100<br>Interés compost: C·(1 + r/100)ⁿ','Subir p % → ×(1 + p/100) · Bajar p % → ×(1 − p/100)<br>Encadenados → multiplica índices<br>Inicial = final : índice<br>% = parte : total · 100<br>Interés compuesto: C·(1 + r/100)ⁿ'))});return p})(TEORIA.perc);
TEORIA.slam=()=>[{h:t('Gran Slam','Gran Slam'),b:`<p>${t('Totes les pistes barrejades en un <b>super tie-break a 10 punts</b> (cal guanyar de 2). Les preguntes que més falles eixiran més sovint.','Todas las pistas mezcladas en un <b>super tie-break a 10 puntos</b> (hay que ganar de 2). Las preguntas que más fallas saldrán más a menudo.')}</p><p>${t('Si dubtes en alguna, el botó 📖 et porta a la teoria de la pista corresponent i després tornes al punt.','Si dudas en alguna, el botón 📖 te lleva a la teoría de la pista correspondiente y luego vuelves al punto.')}</p>`}];
