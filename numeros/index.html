<script>
let S={};
const GB={};BLOCS.forEach(b=>b.gens.forEach(g=>GB[g]=b));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}};

function canviaIdioma(){LANG=LANG==='va'?'es':'va';try{localStorage.setItem('no-idioma',LANG)}catch(e){}document.documentElement.lang=LANG==='va'?'ca-valencia':'es';inici()}

function inici(){

const bt=(b,i)=>`<button class="bloc s-${b.sup}" data-i="${i}"><span class="ic">${b.ic}</span><span><b>${b.nom()}</b><span class="sub">${b.sub()}</span></span><span class="trof"><i class="${vt[b.id]?'on':''}">🏆</i>${vt[b.id]?'×'+vt[b.id]:''}</span></button>`;
$('#app').innerHTML=`<div class="cap"><div><div class="titol">Números <span>Open</span></div><div class="lema">${t('Mates de 4t d\'ESO · Bloc de nombres','Mates de 4º de ESO · Bloque de números')}</div><div class="vict">🏆 ${t('Tie-breaks guanyats','Tie-breaks ganados')}: <b>${tot}</b></div></div><button class="idioma" id="lg">${LANG==='va'?'es':'va'}</button></div>
<div class="intro"><p>${t('Cada pista és un tema. Primer fas l\'<b>escalfament</b> (teoria amb exemples resolts) i després jugues un <b>tie-break a 7</b> contra la màquina: cada pregunta és un punt. Si falles, l\'<b>ull de falcó</b> t\'explica pas a pas on estava l\'error.','Cada pista es un tema. Primero haces el <b>calentamiento</b> (teoría con ejemplos resueltos) y después juegas un <b>tie-break a 7</b> contra la máquina: cada pregunta es un punto. Si fallas, el <b>ojo de halcón</b> te explica paso a paso dónde estaba el error.')}</p></div>
${BLOCS.map(bt).join('')}${bt(SLAM,'s')}
<p class="peu">${t('Hi ha preguntes de triar, d\'escriure el resultat amb el teclat i de marcar intervals a la recta.','Hay preguntas de elegir, de escribir el resultado con el teclado y de marcar intervalos en la recta.')}</p>`;
$('#lg').onclick=canviaIdioma;
document.querySelectorAll('.bloc').forEach(b=>b.onclick=()=>teoria(b.dataset.i==='s'?SLAM:BLOCS[+b.dataset.i],0,false));
scrollTo(0,0);
}

function teoria(B,pag,enPartit){
const P=TEORIA[B.id]();const p=P[pag];
$('#app').innerHTML=`<div class="barra"><button id="tor">← ${enPartit?t('Al partit','Al partido'):t('Pistes','Pistas')}</button><span>${B.nom()} · ${pag+1}/${P.length}</span>${enPartit?'':`<button id="salt">🎾 ${t('Jugar','Jugar')}</button>`}</div>
<div class="carta"><h2>${p.h}</h2>${p.b}<div class="punts">${P.map((_,i)=>`<i class="${i===pag?'on':''}"></i>`).join('')}</div></div>
<div class="fila">${pag>0?`<button class="sec" id="ant">← ${t('Anterior','Anterior')}</button>`:''}${pag<P.length-1?`<button class="gran" id="seg">${t('Següent','Siguiente')} →</button>`:(enPartit?`<button class="gran" id="seg">${t('Tornar al partit','Volver al partido')}</button>`:`<button class="gran" id="seg">🎾 ${B.meta?t('Jugar el super tie-break','Jugar el super tie-break'):t('Jugar el tie-break','Jugar el tie-break')}</button>`)}</div>`;
$('#tor').onclick=()=>enPartit?pregunta(true):inici();
if($('#salt'))$('#salt').onclick=()=>partit(B);
if($('#ant'))$('#ant').onclick=()=>teoria(B,pag-1,enPartit);
$('#seg').onclick=()=>pag<P.length-1?teoria(B,pag+1,enPartit):(enPartit?pregunta(true):partit(B));
scrollTo(0,0);
}

function partit(B){S={B,meta:B.meta||7,pt:[0,0],ult:[],q:null,ok:0,tot:0,ratxa:0,millor:0,mal:{}};nova()}
function tria(){
const fl=LS('no-flojos','{}');const gs=S.B.gens.filter(x=>!S.ult.includes(x));let tot=0;const w=gs.map(x=>{const v=1+(fl[x]||0)/2;tot+=v;return v});let u=Math.random()*tot;
for(let j=0;j<gs.length;j++){u-=w[j];if(u<0)return gs[j]}return gs[gs.length-1]}
function nova(){
const g=tria();S.ult.push(g);if(S.ult.length>Math.min(3,S.B.gens.length-2))S.ult.shift();
const Q=G[g]();Q.gen=g;if(Q.errs)Q.errs=Q.errs.filter(([v])=>Math.abs(v-Q.ans)>Math.max(Q.tol,1e-9));
if(Q.kind==='op'){const seen=new Set([Q.ok]);const b=[];for(const x of Q.bad){if(!seen.has(x[0])){seen.add(x[0]);b.push({h:x[0],why:x[1]})}if(b.length===3)break}Q.ops=shuffle([{h:Q.ok,ok:true},...b])}
S.q=Q;S.inp='';S.rs={a:null,b:null,ac:true,bc:true};S.pista=false;pregunta(false);
}
function anota(g,ok){const f=LS('no-flojos','{}');f[g]=Math.max(0,Math.min(6,(f[g]||0)+(ok?-1:2)));LSW('no-flojos',f)}
function marcador(){const srv=(Math.floor((S.pt[0]+S.pt[1]+1)/2))%2===0;
return`<div class="marcador"><div class="nom">${srv?'🎾 ':''}${t('Tu','Tú')}</div><div class="pts">${S.pt[0]}</div><div class="sep"></div><div class="nom">${srv?'':'🎾 '}${t('La màquina','La máquina')}<small>${t('tie-break a','tie-break a')} ${S.meta}</small></div><div class="pts">${S.pt[1]}</div></div>`}
function estat(){const [a,b]=S.pt,m=S.meta;if(a>=m-1&&a>b)return'🔥 '+t('Punt de partit per a tu!','¡Punto de partido para ti!');if(b>=m-1&&b>a)return'⚠️ '+t('Punt de partit per a la màquina','Punto de partido para la máquina');if(S.ratxa>=3)return`⚡ ${t('Ratxa','Racha')}: ${S.ratxa}`;return''}

function pregunta(tornant){
const Q=S.q;let cos='';
if(Q.kind==='op')cos=`<div class="opcions">${Q.ops.map((o,i)=>`<button class="op" data-i="${i}">${o.h}</button>`).join('')}</div>`;
else if(Q.kind==='num')cos=`<div class="pant"><div class="cx" id="cx">${S.inp.replace(/-/g,'−')}</div>${Q.ud?`<span class="ud">${Q.ud}</span>`:''}</div>
<div class="teclat">${['7','8','9','⌫','4','5','6','−','1','2','3','/','0',',','OK'].map(k=>`<button data-k="${k}" class="${k==='OK'?'ok':''}"${k==='OK'?' style="grid-row:span 1;grid-column:span 2"':''}>${k}</button>`).join('')}</div>
<p class="nota">${Q.ud?t(`Escriu només el número (en ${Q.ud==='€'?'euros':'%'}). `,`Escribe solo el número (en ${Q.ud==='€'?'euros':'%'}). `):''}${t('Usa la coma per als decimals i / per a fraccions (3/4).','Usa la coma para los decimales y / para fracciones (3/4).')}</p>`;
else cos=`<div id="rl">${rectaSVG()}</div><div class="rtxt" id="rt">${rTxt()}</div><div class="rbots"><button id="minf">← −∞</button><button id="rclr">${t('Esborra','Borra')}</button><button id="pinf">+∞ →</button></div><button class="gran" id="rok" style="margin-top:10px">${t('Comprovar','Comprobar')}</button><p class="nota">${t('Toca un número per posar un extrem; toca\'l una altra vegada per canviar ● (entra) ↔ ○ (no entra).','Toca un número para poner un extremo; tócalo otra vez para cambiar ● (entra) ↔ ○ (no entra).')}</p>`;
$('#app').innerHTML=`<div class="barra"><button id="ix">✕</button><span>${S.B.nom()}</span><button id="te">📖 ${t('Teoria','Teoría')}</button></div>${marcador()}<div class="ratxa">${estat()}</div>
<div class="carta" id="cq"><div class="tipus">${Q.tip}</div><div class="enun">${Q.txt}</div>${cos}<div id="pz">${S.pista?`<div class="pistab">💡 ${Q.pista}</div>`:`<button class="ajuda" id="pb">💡 ${t('Pista','Pista')}</button>`}</div></div>`;
if($('#pb'))$('#pb').onclick=()=>{S.pista=true;$('#pz').innerHTML=`<div class="pistab">💡 ${Q.pista}</div>`};
$('#ix').onclick=inici;
$('#te').onclick=()=>teoria(S.B.id==='slam'?GB[Q.gen]:S.B,1,true);
if(Q.kind==='op')document.querySelectorAll('.op').forEach(b=>b.onclick=()=>respon(+b.dataset.i));
else if(Q.kind==='num')document.querySelectorAll('.teclat button').forEach(b=>b.onclick=()=>tecla(b.dataset.k));
else{$('#rl').onclick=e=>{const r=e.target.closest('rect');if(r)toca(+r.dataset.v)};$('#minf').onclick=()=>{const s=S.rs;if(s.a!==null&&s.a!==-Infinity&&s.b===null){s.b=s.a;s.bc=s.ac}s.a=-Infinity;s.ac=false;redib()};$('#pinf').onclick=()=>{const s=S.rs;if(s.b!==null&&s.b!==Infinity&&s.a===null){s.a=s.b;s.ac=s.bc}s.b=Infinity;s.bc=false;if(s.a===null){}redib()};$('#rclr').onclick=()=>{S.rs={a:null,b:null,ac:true,bc:true};redib()};$('#rok').onclick=()=>{const s=S.rs;if(s.a===null||s.b===null){$('#cq').classList.remove('sacseja');void $('#cq').offsetWidth;$('#cq').classList.add('sacseja');return}respon(s)}}
if(!tornant)scrollTo(0,0);
}
function rectaSVG(){const Q=S.q,s=S.rs;const ints=Q.rec.given.slice();if(s.a!==null||s.b!==null){const a=s.a!==null?s.a:s.b,b=s.b!==null?s.b:null;ints.push({a,b:b===null?a:b,ac:s.a!==null?s.ac:s.bc,bc:s.bc,col:'#1d2733'})}return linia(ints,Q.rec.lo,Q.rec.hi,{clic:true})}
function rTxt(){const s=S.rs;if(s.a===null&&s.b===null)return'<span style="color:#c3c7cd">( , )</span>';if(s.a===null||s.b===null){const v=s.a!==null?s.a:s.b;return`${v===-Infinity?'(−∞':v===Infinity?'+∞':MN(v)} , ?`}return ivTxt(iv(s.a,s.b,s.ac,s.bc))}
function redib(){$('#rl').innerHTML=rectaSVG();$('#rt').innerHTML=rTxt()}
function toca(v){const s=S.rs;
if(s.a===v)s.ac=!s.ac;else if(s.b===v)s.bc=!s.bc;
else if(s.a===null)s.a=v;else if(s.b===null)s.b=v;
else if(s.a===-Infinity)s.b=v;else if(s.b===Infinity)s.a=v;
else{if(Math.abs(v-s.a)<=Math.abs(v-s.b))s.a=v;else s.b=v}
if(s.a!==null&&s.b!==null&&s.a!==-Infinity&&s.b!==Infinity&&s.a>s.b){[s.a,s.b]=[s.b,s.a];[s.ac,s.bc]=[s.bc,s.ac]}
redib()}
function tecla(k){if(k==='OK'){const v=parseNum(S.inp);if(isNaN(v)){$('#cq').classList.remove('sacseja');void $('#cq').offsetWidth;$('#cq').classList.add('sacseja');return}respon(v);return}
if(k==='⌫')S.inp=S.inp.slice(0,-1);else if(k==='−'){S.inp=S.inp.startsWith('-')?S.inp.slice(1):'-'+S.inp}else if(S.inp.length<12)S.inp+=k;$('#cx').textContent=S.inp.replace(/-/g,'−')}
document.addEventListener('keydown',e=>{if(!S.q||!$('#cx'))return;const k=e.key;if(/^[0-9]$/.test(k))tecla(k);else if(k===','||k==='.')tecla(',');else if(k==='/')tecla('/');else if(k==='-')tecla('−');else if(k==='Backspace')tecla('⌫');else if(k==='Enter')tecla('OK');else return;e.preventDefault()});

function pilota(cl){const b=document.createElement('div');b.className='pilota '+cl;document.body.appendChild(b);setTimeout(()=>b.remove(),800)}
function respon(x){
const Q=S.q;let ok,dada,why=null;
if(Q.kind==='op'){const o=Q.ops[x];ok=!!o.ok;dada=o.h;why=o.why;document.querySelectorAll('.op').forEach((b,i)=>{b.disabled=true;if(Q.ops[i].ok)b.classList.add('bo');else if(i===x)b.classList.add('mal')})}
else if(Q.kind==='num'){ok=Math.abs(x-Q.ans)<=Q.tol+1e-12;dada=num(x,6);if(!ok){const e=(Q.errs||[]).find(([v])=>Math.abs(v-x)<=Math.max(Q.tol,1e-9)+1e-12);if(e)why=e[1];else why=Q.gw||null}}
else{const s=S.rs;const I=iv(s.a,s.b,s.ac,s.bc);ok=ivEq(I,Q.ansI);dada=ivTxt(I);if(!ok){const A=Q.ansI;if(I.a===A.a&&I.b===A.b)why=W_CL();else if((A.a===-Infinity)!==(I.a===-Infinity)||(A.b===Infinity)!==(I.b===Infinity))why=t('Revisa cap a on va l\'interval: «major que» va cap a la dreta (+∞) i «menor que» cap a l\'esquerra (−∞).','Revisa hacia dónde va el intervalo: «mayor que» va hacia la derecha (+∞) y «menor que» hacia la izquierda (−∞).');else why=t('Els extrems no són els correctes.','Los extremos no son los correctos.')}}
S.tot++;anota(Q.gen,ok);
if(ok){S.ok++;S.pt[0]++;S.ratxa++;S.millor=Math.max(S.millor,S.ratxa);pilota('tu')}else{S.pt[1]++;S.ratxa=0;S.mal[Q.gen]=(S.mal[Q.gen]||0)+1;pilota('ella')}
setTimeout(()=>ull(ok,dada,why),Q.kind==='op'?650:250);
}
function acabat(){const [a,b]=S.pt;return(a>=S.meta||b>=S.meta)&&Math.abs(a-b)>=2}
function ull(ok,dada,why){
const Q=S.q;const fi=acabat();
const sol=Q.kind==='op'?Q.ok:Q.kind==='num'?Q.fmt:ivTxt(Q.ansI);
$('#app').innerHTML=`<div class="barra"><button id="ix">✕</button><span>${S.B.nom()}</span><span></span></div>${marcador()}
<div class="carta ull ${ok?'ok':''}"><div class="etiq">${ok?t('Punt per a tu','Punto para ti'):t('Ull de falcó · punt per a la màquina','Ojo de halcón · punto para la máquina')}</div>
<h2>${ok?pick([t('Bona bola!','¡Buena bola!'),t('Directa guanyadora!','¡Directa ganadora!'),t('Ace!','¡Ace!'),t('Quin revés!','¡Qué revés!')]):pick([t('Fora per poc!','¡Fuera por poco!'),t('A la xarxa!','¡A la red!'),t('Bola llarga','Bola larga')])}</h2>
<div class="enun" style="font-size:16px;color:var(--suau)">${Q.txt}</div>
${ok?'':`<div class="error">${t('Has respost','Has respondido')}: <b>${dada}</b>${why?`<p>${why}</p>`:''}</div>`}
<div class="bona">${t('Resposta correcta','Respuesta correcta')}: ${sol}</div>
<h3>${t('Pas a pas','Paso a paso')}</h3><ol class="passos">${Q.expl.map(x=>`<li>${x}</li>`).join('')}</ol></div>
<button class="gran" id="seg">${fi?t('Veure el resultat','Ver el resultado'):t('Següent punt','Siguiente punto')} →</button>`;
$('#ix').onclick=inici;$('#seg').onclick=()=>fi?final():nova();scrollTo(0,0);
}
function final(){
const guany=S.pt[0]>S.pt[1];if(guany){const v=LS('no-vict','{}');v[S.B.id]=(v[S.B.id]||0)+1;LSW('no-vict',v)}
const pitj=Object.entries(S.mal).sort((a,b)=>b[1]-a[1]).slice(0,3);
$('#app').innerHTML=`<div class="carta final"><div class="gran-ic">${guany?'🏆':'🎾'}</div><h2>${guany?t('Tie-break guanyat!','¡Tie-break ganado!'):t('Aquesta vegada ha guanyat la màquina','Esta vez ha ganado la máquina')}</h2>
<p style="font-size:28px;font-weight:900">${S.pt[0]} – ${S.pt[1]}</p>
<p>${t('Encerts','Aciertos')}: <b>${S.ok}/${S.tot}</b> · ${t('Millor ratxa','Mejor racha')}: <b>${S.millor}</b></p>
${pitj.length?`<div class="compte" style="text-align:left"><span class="etq">${t('Per repassar','Para repasar')}</span>${pitj.map(([g])=>`• ${G[g]().tip} (${GB[g].nom()})`).join('<br>')}<p style="font-size:14px">${t('Aquests tipus eixiran més sovint fins que els domines.','Estos tipos saldrán más a menudo hasta que los domines.')}</p></div>`:''}
<div class="perque" style="text-align:left"><span class="etq">${t('Sabies que…?','¿Sabías que…?')}</span>${S.B.curio()}</div></div>
<button class="gran" id="re">🎾 ${t('Revenja','Revancha')}</button><div class="fila"><button class="sec" id="te">📖 ${t('Teoria','Teoría')}</button><button class="sec" id="in">${t('Pistes','Pistas')}</button></div>`;
$('#re').onclick=()=>partit(S.B);$('#te').onclick=()=>teoria(S.B,0,false);$('#in').onclick=inici;scrollTo(0,0);
}
inici();
</script>
</body>
</html>
