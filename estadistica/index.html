<!doctype html>
<html lang="ca-valencia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f6b3a">
<title>Atzar Open</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--verd:#2f6b3a;--pista:#2c5f9e;--linia:#f4f4ee;--groc:#d9f03a;--tinta:#1d2733;--paper:#fbfaf4;--bo:#1f8a4c;--mal:#c8412f;--suau:#5d6b7a}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b1530;color:var(--tinta);overflow-x:hidden;font-size:17px;line-height:1.4}
#fons{position:fixed;inset:0;z-index:0;pointer-events:none}
#fons svg{width:100%;height:100%;display:block}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100%;padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px}
.carta{background:var(--paper);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
h1{font-size:34px;text-shadow:0 2px 6px rgba(0,0,0,.6);line-height:1.05;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.5px}
h1 small{display:block;font-size:15px;font-weight:500;opacity:.9;letter-spacing:0;margin-top:6px}
h2{font-size:21px;margin-bottom:8px}
h3{font-size:17px;margin:12px 0 6px}
p{margin:6px 0}
.cap{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-top:6px}
.idioma{background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:10px;padding:6px 12px;font-weight:700;font-size:16px}
button{font:inherit;cursor:pointer;border:0}
.bloc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border-radius:14px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.2);color:var(--tinta)}
.bloc .ic{width:46px;height:46px;border-radius:50%;background:var(--groc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.bloc b{display:block;font-size:17px}
.bloc span.sub{font-size:14px;color:var(--suau)}
.bloc .rec{margin-left:auto;font-size:13px;color:var(--bo);font-weight:700;white-space:nowrap}
.gran{display:block;width:100%;background:var(--groc);color:var(--tinta);font-weight:800;font-size:18px;padding:14px;border-radius:14px;box-shadow:0 4px 0 #a9bd22}
.gran:active{transform:translateY(2px);box-shadow:0 2px 0 #a9bd22}
.sec{display:block;width:100%;background:rgba(16,24,32,.55);color:#fff;border:2px solid rgba(255,255,255,.7);font-weight:700;padding:11px;border-radius:14px}
.carta .sec{color:var(--tinta);border-color:#c9ccd1}
.fila{display:flex;gap:10px}
.fila>*{flex:1}
.marcador{display:grid;grid-template-columns:1fr auto auto;background:#101820;color:#fff;border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.marcador div{padding:7px 12px;font-weight:700}
.marcador .nom{display:flex;align-items:center;gap:8px}
.marcador .nom i{width:9px;height:9px;border-radius:50%;background:var(--groc);visibility:hidden}
.marcador .nom i.s{visibility:visible}
.marcador .jocs{background:#26313d;text-align:center;min-width:40px}
.marcador .pts{background:var(--groc);color:#101820;text-align:center;min-width:64px}
.marcador .sep{grid-column:1/-1;height:1px;background:#2d3946;padding:0}
.barra{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:14px}
.barra button{background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px}
.enun{font-size:18px}
.fig{display:flex;justify-content:center;margin:10px 0 4px}
.fig svg{max-width:100%;height:auto}
.dades{background:#eef2e4;border-radius:10px;padding:8px 10px;font-size:15px;margin-top:8px}
.calc{font-size:13px;color:var(--suau);margin-top:6px}
.opcions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.op{background:#fff;border:2px solid #d6d9de;border-radius:12px;padding:12px 6px;font-size:19px;font-weight:700;min-height:62px;display:flex;align-items:center;justify-content:center;color:var(--tinta)}
.op:active{background:#f3f6e0}
.op.bo{border-color:var(--bo);background:#e3f4ea}
.op.mal{border-color:var(--mal);background:#fbe6e2}
.op[disabled]{opacity:1}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.ull{border-left:6px solid var(--mal)}
.ull.ok{border-left-color:var(--bo)}
.ull h2{display:flex;align-items:center;gap:8px}
.etiq{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mal)}
.ull.ok .etiq{color:var(--bo)}
.error{background:#fbe6e2;border-radius:10px;padding:10px;margin:8px 0}
.passos{counter-reset:p;list-style:none;margin:6px 0}
.passos li{counter-increment:p;position:relative;padding:6px 0 6px 34px;border-bottom:1px dashed #d8dbe0}
.passos li:last-child{border-bottom:0}
.passos li::before{content:counter(p);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--pista);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.exemple{background:#eef2e4;border-radius:12px;padding:10px 12px;margin:10px 0}
.exemple .etq{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--verd)}
.taula{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px;text-align:center}
.taula td,.taula th{border:1px solid #d6d9de;padding:6px 4px}
.taula th{background:#eef2e4}
.punts{display:flex;justify-content:center;gap:6px;margin-top:10px}
.punts i{width:8px;height:8px;border-radius:50%;background:#c9ccd1}
.punts i.on{background:var(--pista)}
.res{text-align:center}
.res .gros{font-size:44px;font-weight:900;margin:6px 0}
.pilota{position:fixed;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4ff7a,#c8de1c 60%,#9fb20f);z-index:5;pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.anim-a{animation:anA .7s ease-in forwards}
.anim-b{animation:anB .7s ease-in forwards}
@keyframes anA{from{left:50%;top:85%;transform:scale(1)}50%{transform:scale(1.6)}to{left:62%;top:4%;transform:scale(.7)}}
@keyframes anB{from{left:45%;top:2%;transform:scale(.7)}50%{transform:scale(1.5)}to{left:30%;top:95%;transform:scale(1)}}
.aviso{text-align:center;color:#fff;font-weight:800;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.3);min-height:30px}
.ruff{border-collapse:collapse;margin:12px auto 4px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.ruff td{min-width:44px;height:40px;text-align:center;padding:0 4px}.ruff td.esq{border-right:3px solid var(--tinta);color:var(--pista)}.ruff tr.lin td{border-top:3px solid var(--tinta)}.ruff tr.lin td.esq{border-top:0}.ruff td.resid{outline:2px solid var(--suau);outline-offset:-4px;border-radius:6px}.ruff td.cur{background:var(--groc);border-radius:8px}.ruff td.mal{background:#fbe6e2;color:var(--mal);border-radius:8px}.pas{font-size:14px;color:var(--suau);text-align:center}
.secc{margin:10px 0 4px}.secc-t{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--pista)}.perque{font-size:14px;color:var(--suau);background:#eef0f6;border-radius:8px;padding:6px 8px;margin:6px 0}.pistab{background:#fff6c9;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:15px}.ajuda{background:none;color:var(--pista);font-weight:700;font-size:15px;margin-top:10px;padding:4px 0}
.bloc{position:relative;overflow:hidden;color:#fff;background:var(--sup);border:0;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 0 0 3px rgba(255,255,255,.85),inset 0 0 0 7px var(--sup),inset 0 0 0 9px rgba(255,255,255,.55);padding:18px 16px}
.bloc::after{content:"";position:absolute;right:-20px;top:0;bottom:0;width:86px;border-left:3px solid rgba(255,255,255,.5);background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 14px,transparent 14px 28px)}
.bloc>*{position:relative;z-index:1}
.bloc b{text-shadow:0 1px 2px rgba(0,0,0,.35)}
.bloc span.sub{color:rgba(255,255,255,.85)}
.bloc .ic{box-shadow:0 3px 6px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.12);color:var(--tinta)}
.bloc .trof{margin-left:auto;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;min-width:48px}
.bloc .trof i{font-style:normal;font-size:24px;filter:grayscale(1) opacity(.45)}
.bloc .trof i.on{filter:none}
.sup-tierra{--sup:#c0603a}.sup-herba{--sup:#4a8b3c}.sup-dura{--sup:#2c5f9e}.sup-indoor{--sup:#4b3f8f}.sup-verda{--sup:#2f7a64}
.cap{padding-top:22px}.titol{font-size:44px;font-weight:900;color:#fff;line-height:1;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(120,170,255,.45)}
.titol .ii{position:relative;display:inline-block}
.titol .ii::before{content:"";position:absolute;left:50%;top:-6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4ff7a,#c8de1c 60%,#9fb20f);animation:bota 1.1s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes bota{from{transform:translateY(-26px)}to{transform:translateY(0) scale(1.15,.85)}}
.lema{color:#cfe0ff;font-weight:600;font-size:15px;margin-top:8px}
.vict{display:inline-flex;gap:8px;align-items:center;background:#101820;color:#fff;border-radius:8px;padding:4px 10px;font-weight:800;font-size:14px;margin-top:10px;box-shadow:0 2px 0 rgba(255,255,255,.15)}
.vict b{background:var(--groc);color:#101820;border-radius:4px;padding:0 6px}
.intro{background:rgba(10,20,40,.72);color:#eaf1ff;border-radius:14px;padding:12px 14px;font-size:15px;backdrop-filter:blur(3px)}
.carta.preg{background:#0f1b2b;color:#fff;border-top:5px solid var(--groc)}
.carta.preg .enun b{color:var(--groc)}
.carta.preg .fig,.carta.preg .ruff,.carta.preg .dades{background:#fbfaf4;color:var(--tinta);border-radius:12px;padding:6px}
.carta.preg .ruff{padding:0}
.carta.preg .pas,.carta.preg .calc{color:#9fb0c6}
.carta.preg .op{background:#fbfaf4}
.carta.preg .ajuda{color:var(--groc)}
.carta.preg .pistab{color:var(--tinta)}
.peu{color:#fff;font-size:13px;text-align:center;background:rgba(0,0,0,.35);border-radius:10px;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.chip{min-width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4ff7a,#c8de1c 60%,#9fb20f);color:#101820;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.chip.x{opacity:.25;text-decoration:line-through}
.camp{display:inline-flex;align-items:center;justify-content:center;min-width:58px;height:38px;padding:0 6px;margin:2px;border-radius:8px;background:#fff;border:2px dashed #8a98aa;color:#101820;font-weight:800;font-size:18px;vertical-align:middle;font-variant-numeric:tabular-nums}
.camp.act{border:3px solid var(--groc);background:#fffde6;box-shadow:0 0 0 3px rgba(217,240,58,.35)}
.camp.mal{border:2px solid var(--mal);background:#fbe6e2}
.camp.bo{border:2px solid var(--bo);background:#e3f4ea}
.campgran{text-align:center;margin:12px 0 4px;color:#fff;font-size:18px}
.campgran .camp{min-width:150px;height:50px;font-size:24px}
.teclat{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.teclat button{background:#26313d;color:#fff;border-radius:10px;height:48px;font-size:21px;font-weight:800;box-shadow:0 3px 0 #0a1118}
.teclat button:active{transform:translateY(2px);box-shadow:0 1px 0 #0a1118}
.teclat .ok{grid-column:span 3;background:var(--groc);color:#101820;box-shadow:0 3px 0 #a9bd22;font-size:18px}
.teclat .sp{background:#3b4a5c}
.nota{font-size:14px;color:#9fb0c6;margin-top:6px}
.carta.preg .taula{background:#fbfaf4;color:var(--tinta);border-radius:10px;overflow:hidden}
.carta.preg .taula th{background:#dfe8cf}
.opcions.llarg{grid-template-columns:1fr}
.opcions.llarg .op{font-size:16px;min-height:52px;padding:10px 12px;text-align:left;justify-content:flex-start}
.ajuda{background:transparent;color:var(--pista);font-weight:700;margin-top:10px;font-size:15px}
.pistab{background:#fff6c9;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:15px;color:var(--tinta)}
.bbuild{display:flex;justify-content:center;gap:8px;margin-top:10px;background:#fbfaf4;border-radius:12px;padding:10px 6px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:4px;width:56px}
.bcol .pal{width:34px;height:150px;background:repeating-linear-gradient(0deg,#e5e8ee 0 1px,transparent 1px 15px);position:relative;border-bottom:2px solid var(--tinta)}
.bcol .pal i{position:absolute;left:0;right:0;bottom:0;background:var(--pista);transition:height .15s}
.bcol button{width:40px;height:32px;border-radius:8px;background:#26313d;color:#fff;font-size:16px;font-weight:800}
.bcol b{font-size:15px;color:var(--tinta)}
.bcol small{font-size:12px;color:var(--suau);text-align:center;line-height:1.1}
.sim{background:#fbfaf4;border-radius:12px;padding:10px;margin:10px 0;color:var(--tinta)}
.sim .sb{display:flex;gap:8px;margin-top:8px}
.sim .sb button{flex:1;background:var(--pista);color:#fff;border-radius:10px;padding:9px 4px;font-weight:800}
.sim .cnt{font-size:14px;color:var(--suau);text-align:center}
.sim .fil{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
.sim .fil .tr{flex:1;height:22px;background:#e5e8ee;border-radius:6px;position:relative;overflow:hidden}
.sim .fil .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--pista);border-radius:6px}
.sim .fil .tr i.b{background:#c0603a}
.sim .fil .tr u{position:absolute;top:-2px;bottom:-2px;width:3px;background:#101820}
.sim .fil span{min-width:64px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.compte{background:#fde8d8;border-radius:10px;padding:8px 10px;margin:10px 0;font-size:15px}
.compte b:first-child{color:#b5481c}
.serveix{background:#e3ecfa;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:15px}
.formula{background:#101820;color:#fff;border-radius:10px;padding:10px;margin:8px 0;text-align:center;font-size:18px;font-weight:700}
.formula .fr>span:first-child{border-color:#fff}
.ok-camps{font-size:14px;margin:6px 0}
.dau{display:inline-block;width:22px;height:22px;border-radius:5px;background:#fff;border:2px solid #101820;font-weight:800;font-size:13px;text-align:center;line-height:18px;margin:1px;color:#101820}
.mini{font-size:14px;color:var(--suau)}
.taula.mini td,.taula.mini th{padding:3px 2px;font-size:14px}
.bloc .num{font-size:12px;opacity:.8;font-weight:700}
</style>

</head>
<body>
<div id="fons"></div>
<div id="app"></div>
<script>

(function(){
function fons(){
const Hh=800,W=Math.max(400,Math.round(Hh*innerWidth/innerHeight)),yh=246,A=2355,B=194,D=16,cx=W/2;
const P=(X,Y)=>[cx+X*B/(D+Y),yh+A/(D+Y)];
const pl=pts=>pts.map(p=>P(...p).map(v=>v.toFixed(1)).join(',')).join(' ');
const ln=(a,b,w)=>{const p=P(...a),q=P(...b);return`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#f4f4ee" stroke-width="${w||2}" stroke-linecap="round"/>`};
let s=`<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMidYMid slice" id="esc"><defs><linearGradient id="cel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070d22"/><stop offset="1" stop-color="#1d3566"/></linearGradient><radialGradient id="llum"><stop offset="0" stop-color="#fff9d8" stop-opacity=".95"/><stop offset=".25" stop-color="#fff2b0" stop-opacity=".35"/><stop offset="1" stop-color="#fff2b0" stop-opacity="0"/></radialGradient><linearGradient id="gra" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2740"/><stop offset="1" stop-color="#2a3b5c"/></linearGradient></defs>`;
s+=`<rect width="${W}" height="${Hh}" fill="url(#cel)"/>`;
s+=`<rect x="0" y="130" width="${W}" height="${yh-130+30}" fill="url(#gra)"/>`;
const cols=['#e8e1d0','#c94b3c','#3d6fb5','#f0c23b','#ffffff','#5fa46a','#d9874a','#8a6bbf'];
for(let row=0;row<9;row++){const y=140+row*11;for(let x=4+(row%2)*5;x<W;x+=10){if(Math.random()<.82)s+=`<circle cx="${x}" cy="${y}" r="3.3" fill="${cols[Math.floor(Math.random()*cols.length)]}" opacity="${.55+row*.04}"/>`}}
s+=`<rect x="0" y="${yh-20}" width="${W}" height="16" fill="#123b2a"/><rect x="0" y="${yh-20}" width="${W}" height="3" fill="#0b5d3b"/>`;
for(const x of [28,W-28,W*.3,W*.7].slice(0,W>700?4:2)){s+=`<rect x="${x-2}" y="20" width="4" height="120" fill="#3a4660"/><rect x="${x-16}" y="14" width="32" height="12" rx="2" fill="#dfe6f2"/><circle cx="${x}" cy="20" r="90" fill="url(#llum)"/>`}
s+=`<rect x="0" y="${yh}" width="${W}" height="${Hh-yh}" fill="#2b6a45"/>`;
s+=`<polygon points="${pl([[-5.485,-11.885],[5.485,-11.885],[5.485,11.885],[-5.485,11.885]])}" fill="#2c5f9e"/>`;
const L=11.885,Sd=4.115,Db=5.485,Sv=6.4;
s+=ln([-Db,-L],[Db,-L],3)+ln([-Db,L],[Db,L])+ln([-Db,-L],[-Db,L])+ln([Db,-L],[Db,L])+ln([-Sd,-L],[-Sd,L])+ln([Sd,-L],[Sd,L])+ln([-Sd,-Sv],[Sd,-Sv])+ln([-Sd,Sv],[Sd,Sv])+ln([0,-Sv],[0,Sv])+ln([0,-L],[0,-L+.3],3)+ln([0,L],[0,L-.3]);
const n1=P(-6.4,0),n2=P(6.4,0);const nh=0.914*B/D;
s+=`<rect x="${n1[0]}" y="${n1[1]-nh}" width="${n2[0]-n1[0]}" height="${nh}" fill="#0d1622" opacity=".75"/><line x1="${n1[0]}" y1="${n1[1]-nh}" x2="${n2[0]}" y2="${n2[1]-nh}" stroke="#fff" stroke-width="2"/><line x1="${n1[0]}" y1="${n1[1]}" x2="${n1[0]}" y2="${n1[1]-nh*1.15}" stroke="#c9ccd1" stroke-width="3"/><line x1="${n2[0]}" y1="${n2[1]}" x2="${n2[0]}" y2="${n2[1]-nh*1.15}" stroke="#c9ccd1" stroke-width="3"/>`;
s+=`<rect width="${W}" height="${Hh}" fill="#000" opacity=".12"/></svg>`;
document.getElementById('fons').innerHTML=s;
}
fons();let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(fons,200)});
})();

const $=s=>document.querySelector(s);
let LANG='va';
try{const l=localStorage.getItem('ap-idioma');if(l==='es'||l==='va')LANG=l}catch(e){}
const t=(va,es)=>LANG==='va'?va:es;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const sum=a=>a.reduce((x,y)=>x+y,0);
const fact=n=>n<=1?1:n*fact(n-1);
const Cb=(n,k)=>Math.round(fact(n)/(fact(k)*fact(n-k)));
const Vr=(n,k)=>Math.round(fact(n)/fact(n-k));
const r2=x=>Math.round(x*100)/100;
function nf(x,d=2){if(!isFinite(x))return'—';let s=(Math.round(x*10**d)/10**d).toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');if(s==='-0')s='0';return s.replace('.',',')}
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function FS(n,d){const g=gcd(n,d)||1;return d/g===1?String(n/g):F(n/g,d/g)}
function FX(n,d){const g=gcd(n,d)||1;let s=F(n,d);if(g>1)s+=' = '+FS(n,d);if(d/g!==1)s+=' ≈ '+nf(n/d,4);return s}
function sorted(a){return a.slice().sort((x,y)=>x-y)}
function mediana(a){const s=sorted(a),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2}
function quartil(a,k){const s=sorted(a),n=s.length,p=k*n/4;if(Number.isInteger(p))return (s[p-1]+s[p])/2;return s[Math.ceil(p)-1]}
function mitjana(a){return sum(a)/a.length}
function variancia(a){const m=mitjana(a);return sum(a.map(x=>(x-m)**2))/a.length}
function llig(s,unit){s=String(s||'').trim().replace(/\s/g,'').replace(/,/g,'.');let pc=false;if(s.endsWith('%')){s=s.slice(0,-1);pc=unit!=='%'}let v=NaN;if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const p=s.split('/').map(Number);v=p[1]?p[0]/p[1]:NaN}else if(/^-?(\d+\.?\d*|\.\d+)$/.test(s))v=Number(s);if(pc)v/=100;return v}

${serveix(t('Resumir moltes dades en un sol número «típic»: la nota mitjana, el sou mitjà, l\'altura més habitual... Però compte: no sempre la mitjana és el millor resum.','Resumir muchos datos en un solo número «típico»: la nota media, el sueldo medio, la altura más habitual... Pero ojo: no siempre la media es el mejor resumen.'))}
<p><b>${t('Mitjana','Media')}</b> (x̄): ${t('sumes totes les dades i divideixes entre quantes n\'hi ha.','sumas todos los datos y divides entre cuántos hay.')}</p>
<div class="formula">x̄ = ${F('x<sub>1</sub> + x<sub>2</sub> + ... + x<sub>N</sub>','N')}</div>
<p><b>${t('Mediana','Mediana')}</b> (Me): ${t('el valor del mig quan les dades estan <b>ordenades</b>. Si N és imparell, és la dada central; si N és parell, la mitjana de les dues centrals.','el valor del medio cuando los datos están <b>ordenados</b>. Si N es impar, es el dato central; si N es par, la media de los dos centrales.')}</p>
<p><b>${t('Moda','Moda')}</b> (Mo): ${t('el valor que més es repetix (el de f<sub>i</sub> més gran). Pot haver-hi més d\'una.','el valor que más se repite (el de f<sub>i</sub> más grande). Puede haber más de una.')}</p>
${ex(`<p>${t('Asos en 6 partits','Aces en 6 partidos')}: 7, 2, 9, 4, 2, 6</p><ol class="passos"><li>${t('Mitjana','Media')}: (7+2+9+4+2+6)/6 = 30/6 = <b>5</b></li><li>${t('Ordenem','Ordenamos')}: 2, 2, 4, 6, 7, 9. ${t('N = 6 és parell: les centrals són 4 i 6','N = 6 es par: las centrales son 4 y 6')} → Me = (4+6)/2 = <b>5</b></li><li>${t('Moda','Moda')}: <b>2</b> (${t('apareix dues vegades','aparece dos veces')})</li></ol>`)}
${compte(t('Per a la mediana, <b>primer ordena</b>. L\'error més típic és agafar el número del mig tal com estan escrites.','Para la mediana, <b>primero ordena</b>. El error más típico es coger el número del medio tal como están escritos.'))}`},
{t:t('Amb taula de freqüències','Con tabla de frecuencias'),h:`
<p>${t('Si un valor es repetix f<sub>i</sub> vegades, en lloc de sumar-lo f<sub>i</sub> vegades el multipliquem:','Si un valor se repite f<sub>i</sub> veces, en lugar de sumarlo f<sub>i</sub> veces lo multiplicamos:')}</p>
<div class="formula">x̄ = ${F('Σ x<sub>i</sub> · f<sub>i</sub>','N')}</div>
<p>${t('Σ (sigma) vol dir «suma de tots».','Σ (sigma) significa «suma de todos».')}</p>
${ex(`${taulaH(['x<sub>i</sub>','f<sub>i</sub>','x<sub>i</sub>·f<sub>i</sub>','F<sub>i</sub>'],[[0,3,0,3],[1,5,5,8],[2,8,16,16],[3,4,12,20],['Σ',20,33,'']])}
<ol class="passos"><li>x̄ = 33 / 20 = <b>1,65</b></li><li>${t('Moda: la f més gran és 8 → Mo = <b>2</b> (el valor, no el 8!)','Moda: la f más grande es 8 → Mo = <b>2</b> (¡el valor, no el 8!)')}</li><li>${t('Mediana: N = 20, les centrals són la 10a i l\'11a dada. Mirem F: fins a x=1 n\'hi ha 8; fins a x=2, 16. Les dades 10a i 11a valen 2 → Me = <b>2</b>','Mediana: N = 20, los centrales son el 10º y el 11º dato. Miramos F: hasta x=1 hay 8; hasta x=2, 16. Los datos 10º y 11º valen 2 → Me = <b>2</b>')}</li></ol>`)}
${compte(t('No faces (0+1+2+3)/4: eixa és la mitjana dels valors, no de les dades. Cada valor pesa segons quantes vegades apareix.','No hagas (0+1+2+3)/4: esa es la media de los valores, no de los datos. Cada valor pesa según cuántas veces aparece.'))}`},
{t:t('Dades en intervals i trucs','Datos en intervalos y trucos'),h:`
<p>${t('Amb intervals, usem la <b>marca de classe</b> com a x<sub>i</sub>. El resultat és una aproximació.','Con intervalos, usamos la <b>marca de clase</b> como x<sub>i</sub>. El resultado es una aproximación.')}</p>
${ex(`${taulaH([t('Interval','Intervalo'),'x<sub>i</sub>','f<sub>i</sub>','x<sub>i</sub>·f<sub>i</sub>'],[['[150, 160)',155,4,620],['[160, 170)',165,10,1650],['[170, 180)',175,6,1050],['Σ','',20,3320]])}<p>x̄ = 3320 / 20 = <b>166 km/h</b></p>`)}
<h3>${t('Truc: què em cal en el pròxim partit?','Truco: ¿qué me hace falta en el próximo partido?')}</h3>
${ex(`<p>${t('Portes 4 partits amb una mitjana de 6 asos. Quants n\'has de fer en el 5é per a tindre mitjana 7?','Llevas 4 partidos con una media de 6 aces. ¿Cuántos tienes que hacer en el 5º para tener media 7?')}</p><ol class="passos"><li>${t('Total que portes: 4 · 6 = 24 asos','Total que llevas: 4 · 6 = 24 aces')}</li><li>${t('Total que necessites: 5 · 7 = 35 asos','Total que necesitas: 5 · 7 = 35 aces')}</li><li>35 − 24 = <b>11</b> ${t('asos','aces')}</li></ol>`)}
<h3>${t('Quina triar?','¿Cuál elegir?')}</h3>
<p>${t('La mitjana es veu molt afectada pels valors extrems: si 9 amics guanyen 1.000 € i un guanya 100.000 €, la mitjana és 10.900 €, però la mediana (1.000 €) representa millor el grup.','La media se ve muy afectada por los valores extremos: si 9 amigos ganan 1.000 € y uno gana 100.000 €, la media es 10.900 €, pero la mediana (1.000 €) representa mejor al grupo.')}</p>`}],

${serveix(t('Saber si dues coses van juntes: hores d\'entrenament i errors, altura i velocitat de servei, temperatura i aigua que beus... Les empreses ho fan servir per a predir vendes i els científics, per a buscar relacions.','Saber si dos cosas van juntas: horas de entrenamiento y errores, altura y velocidad de saque, temperatura y agua que bebes... Las empresas lo usan para predecir ventas y los científicos, para buscar relaciones.'))}
<p>${t('Si a cada individu li mesurem dues variables (x, y), cada parella és un punt. El conjunt de punts és el <b>núvol de punts</b> o diagrama de dispersió.','Si a cada individuo le medimos dos variables (x, y), cada pareja es un punto. El conjunto de puntos es la <b>nube de puntos</b> o diagrama de dispersión.')}</p>
<p><b>${t('Correlació positiva','Correlación positiva')}</b>: ${t('quan una puja, l\'altra també (el núvol puja cap a la dreta).','cuando una sube, la otra también (la nube sube hacia la derecha).')}<br><b>${t('Correlació negativa','Correlación negativa')}</b>: ${t('quan una puja, l\'altra baixa.','cuando una sube, la otra baja.')}<br><b>${t('Correlació nul·la','Correlación nula')}</b>: ${t('no hi ha relació (punts a l\'atzar).','no hay relación (puntos al azar).')}</p>
<p>${t('És <b>forta</b> si els punts estan molt a prop d\'una recta i <b>feble</b> si estan escampats.','Es <b>fuerte</b> si los puntos están muy cerca de una recta y <b>débil</b> si están dispersos.')}</p>
<div class="fila"><div class="fig">${scatSVG(nuvol(0)||[[0,0]])}</div></div><p class="mini" style="text-align:center">${t('Positiva forta','Positiva fuerte')}</p>
<div class="fila"><div class="fig">${scatSVG(nuvol(3)||[[0,0]])}</div></div><p class="mini" style="text-align:center">${t('Negativa feble','Negativa débil')}</p>`},
{t:t('El coeficient r i la recta','El coeficiente r y la recta'),h:`
<p>${t('El <b>coeficient de correlació</b> r és un número entre −1 i 1 que mesura la relació:','El <b>coeficiente de correlación</b> r es un número entre −1 y 1 que mide la relación:')}</p>
${taulaH(['r',t('Significat','Significado')],[['≈ 1',t('positiva forta','positiva fuerte')],['≈ 0,5',t('positiva feble','positiva débil')],['≈ 0',t('nul·la','nula')],['≈ −0,5',t('negativa feble','negativa débil')],['≈ −1',t('negativa forta','negativa fuerte')]])}
<p>${t('El signe diu la direcció; el valor absolut, la força. r = −0,95 és una relació <b>més forta</b> que r = 0,6.','El signo dice la dirección; el valor absoluto, la fuerza. r = −0,95 es una relación <b>más fuerte</b> que r = 0,6.')}</p>
<p>${t('Quan la correlació és forta, la <b>recta de regressió</b> serveix per a fer prediccions.','Cuando la correlación es fuerte, la <b>recta de regresión</b> sirve para hacer predicciones.')}</p>
${ex(`<p>${t('La recta que relaciona hores d\'entrenament setmanal (x) i % de primers servicis dins (y) és y = 2x + 40. Amb 10 hores: y = 2·10 + 40 = <b>60 %</b>.','La recta que relaciona horas de entrenamiento semanal (x) y % de primeros saques dentro (y) es y = 2x + 40. Con 10 horas: y = 2·10 + 40 = <b>60 %</b>.')}</p>`)}
${compte(t('<b>Correlació no és causa.</b> En estiu es venen més gelats i hi ha més cremades solars, però els gelats no causen cremades: les dues coses depenen d\'una tercera (la calor).','<b>Correlación no es causa.</b> En verano se venden más helados y hay más quemaduras solares, pero los helados no causan quemaduras: las dos cosas dependen de una tercera (el calor).'))}`}],

{t:t('Experiments aleatoris','Experimentos aleatorios'),h:`
${serveix(t('Prendre decisions quan no saps què passarà: el temps que farà, si convé arriscar en el segon servei, les assegurances, els jocs... La probabilitat mesura com de possible és una cosa, de 0 (impossible) a 1 (segur).','Tomar decisiones cuando no sabes qué pasará: el tiempo que hará, si conviene arriesgar en el segundo saque, los seguros, los juegos... La probabilidad mide lo posible que es algo, de 0 (imposible) a 1 (seguro).'))}
<p>${t('Un <b>experiment aleatori</b> és aquell en què no pots saber el resultat abans de fer-lo (llançar un dau, el sorteig de qui trau).','Un <b>experimento aleatorio</b> es aquel en el que no puedes saber el resultado antes de hacerlo (lanzar un dado, el sorteo de quién saca).')}</p>
<p><b>${t('Espai mostral','Espacio muestral')}</b> E: ${t('tots els resultats possibles. Dau: E = {1, 2, 3, 4, 5, 6}.','todos los resultados posibles. Dado: E = {1, 2, 3, 4, 5, 6}.')}</p>
<p><b>${t('Succés','Suceso')}</b>: ${t('un subconjunt de resultats. «Traure parell» = {2, 4, 6}.','un subconjunto de resultados. «Sacar par» = {2, 4, 6}.')}</p>
<p>${t('<b>Segur</b>: passa sempre (E). <b>Impossible</b>: no passa mai (∅). <b>Elemental</b>: un sol resultat.','<b>Seguro</b>: pasa siempre (E). <b>Imposible</b>: no pasa nunca (∅). <b>Elemental</b>: un solo resultado.')}</p>

{t:t('Dos daus: la taula de 36','Dos dados: la tabla de 36'),h:`

${compte(t('(3,4) i (4,3) són resultats <b>diferents</b>: imagina que un dau és roig i l\'altre blau.','(3,4) y (4,3) son resultados <b>distintos</b>: imagina que un dado es rojo y el otro azul.'))}`},

pilota(ok?'anim-a':'anim-b');const av=$('#av');
const acaba=S.jc[0]>=2||S.jc[1]>=2;
if(ok){av.textContent=joc===0?t('Joc per a tu!','¡Juego para ti!'):[3,5,8,12].includes(S.ratxa)?t(`${S.ratxa} seguits! 🔥`,`¡${S.ratxa} seguidos! 🔥`):pick([t('Punt!','¡Punto!'),t('Directe!','¡Directo!'),t('Ben jugat!','¡Bien jugado!'),'Ace!']);
if(S.q.sempre)setTimeout(()=>ull(true,'',acaba),900);else setTimeout(()=>{if(acaba)final();else nova()},joc===0?1300:900)}
else{av.textContent=joc===1?t('Joc per a la màquina','Juego para la máquina'):t('Fora!','¡Fuera!');setTimeout(()=>ull(false,msg,acaba),800)}
}
function ull(ok,msg,acaba){
const Q=S.q;
$('#app').innerHTML=`<div class="barra"><button id="ix">✕</button><span>${S.B.nom()}</span><span></span></div>${marcador()}
<div class="carta ull ${ok?'ok':''}"><div class="etiq">${ok?t('Correcte','Correcto'):t('Ull de falcó','Ojo de halcón')}</div><h2>${ok?'✅ '+t('Molt bé!','¡Muy bien!'):'🦅 '+t('La bola ha eixit','La bola ha salido')}</h2>
${!ok?`<div class="enun mini">${Q.q.replace(/\[\[\w+\]\]/g,'▢')}</div>`:''}
${msg?`<div class="error">${msg}</div>`:''}
<h3>${t('Com es fa','Cómo se hace')}</h3>${pas(Q.sol)}${Q.sim?`<div class="sim" data-sim="pron"></div>`:''}</div>
<button class="gran" id="seg">${acaba?t('Vore el resultat','Ver el resultado'):t('Següent punt','Siguiente punto')} 🎾</button>`;
$('#ix').onclick=inici;$('#seg').onclick=()=>acaba?final():nova();muntaSims();scrollTo(0,0);
}
function final(){
const gu=S.jc[0]>S.jc[1];if(gu)guardaVict(S.B.id);
const pc=S.total?Math.round(100*S.encerts/S.total):0;
const flojos=Object.entries(S.errors).filter(([k,v])=>v>=2).length;
$('#app').innerHTML=`<div class="barra"><button id="ix">✕</button><span>${S.B.nom()}</span><span></span></div>
<div class="carta res"><div style="font-size:54px">${gu?'🏆':'💪'}</div><h2>${gu?t('Has guanyat el torneig!','¡Has ganado el torneo!'):t('Esta vegada ha guanyat la màquina','Esta vez ha ganado la máquina')}</h2>
<div class="gros">${S.jc[0]} – ${S.jc[1]}</div>
<p>${t('Encerts','Aciertos')}: <b>${S.encerts}/${S.total}</b> (${pc}%) · ${t('Millor ratxa','Mejor racha')}: <b>${S.millor}</b></p>
<p class="mini">${gu?t('Les preguntes que fallaves t\'han eixit més vegades: així es reforça el que costa.','Las preguntas que fallabas te han salido más veces: así se refuerza lo que cuesta.'):t('Repassa l\'escalfament (📖) i torna-ho a provar: les preguntes que falles tornaran a eixir.','Repasa el calentamiento (📖) y vuelve a intentarlo: las preguntas que fallas volverán a salir.')}</p>
${flojos?`<p class="mini">${t('Punts febles en este partit','Puntos débiles en este partido')}: ${flojos}</p>`:''}</div>
<button class="gran" id="re">${t('Revenja','Revancha')} 🎾</button>${S.B.teoria?`<button class="sec" id="te">📖 ${t('Repassar la teoria','Repasar la teoría')}</button>`:''}<button class="sec" id="me">${t('Tornar als tornejos','Volver a los torneos')}</button>`;
const B=S.B;$('#ix').onclick=inici;$('#me').onclick=inici;$('#re').onclick=()=>partit(B);if($('#te'))$('#te').onclick=()=>teoria(B,0,false);scrollTo(0,0);
}
function muntaSims(){document.querySelectorAll('.sim').forEach(el=>{const k=el.dataset.sim;if(k==='dau')simDau(el);else if(k==='moneda')simMoneda(el);else if(k==='pron')simPron(el,S.q.sim)})}
function simDau(el){let c=[0,0,0,0,0,0],n=0;const pinta=()=>{el.innerHTML=`<div class="cnt">${t('Tirades','Tiradas')}: <b>${n}</b> · ${t('la ratlla negra marca','la raya negra marca')} ${F(1,6)} ≈ 0,167</div>${c.map((x,i)=>`<div class="fil"><span class="dau">${i+1}</span><div class="tr"><i style="width:${n?x/n*100*3:0}%"></i><u style="left:${100/6*3}%"></u></div><span>${n?nf(x/n,3):'—'}</span></div>`).join('')}<div class="sb"><button data-n="1">+1</button><button data-n="10">+10</button><button data-n="100">+100</button><button data-n="1000">+1000</button><button data-n="0">↺</button></div>`;el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const m=+b.dataset.n;if(!m){c=[0,0,0,0,0,0];n=0}else for(let i=0;i<m;i++){c[Math.floor(Math.random()*6)]++;n++}pinta()})};pinta()}
function simMoneda(el){let c=0,n=0,hist=[];const pinta=()=>{const W=290,H=120;let pth='';hist.forEach((p,i)=>{pth+=(i?'L':'M')+(10+(W-20)*i/Math.max(1,hist.length-1)).toFixed(1)+' '+(H-10-(H-20)*p).toFixed(1)});el.innerHTML=`<div class="cnt">${t('Llançaments','Lanzamientos')}: <b>${n}</b> · ${t('cares','caras')}: <b>${c}</b> · ${t('freqüència relativa','frecuencia relativa')}: <b>${n?nf(c/n,3):'—'}</b></div><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"><line x1="10" x2="${W-10}" y1="${H/2}" y2="${H/2}" stroke="#c0603a" stroke-dasharray="4 3"/><text x="${W-12}" y="${H/2-4}" text-anchor="end" font-size="11" fill="#c0603a">0,5</text><path d="${pth}" fill="none" stroke="#2c5f9e" stroke-width="2"/></svg><div class="sb"><button data-n="10">+10</button><button data-n="100">+100</button><button data-n="1000">+1000</button><button data-n="0">↺</button></div>`;el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const m=+b.dataset.n;if(!m){c=0;n=0;hist=[]}else for(let i=0;i<m;i++){if(Math.random()<.5)c++;n++;if(n<=50||n%Math.ceil(n/200)===0)hist.push(c/n)}pinta()})};pinta()}
function simPron(el,sm){if(!sm)return;let n=0,a=0,b=0;const tot=1000;const pinta=()=>{el.innerHTML=`<div class="cnt">${t('Simulació','Simulación')}: <b>${n}</b> ${sm.unitat}</div><div class="fil"><b style="min-width:22px">A</b><div class="tr"><i style="width:${n?a/n*100:0}%"></i><u style="left:${sm.pa*100}%"></u></div><span>${n?nf(a/n,3):'—'}</span></div><div class="fil"><b style="min-width:22px">B</b><div class="tr"><i class="b" style="width:${n?b/n*100:0}%"></i><u style="left:${sm.pb*100}%"></u></div><span>${n?nf(b/n,3):'—'}</span></div><div class="cnt">${t('Ratlla negra: probabilitat exacta','Raya negra: probabilidad exacta')} (A ≈ ${nf(sm.pa,3)}, B ≈ ${nf(sm.pb,3)})</div>`};const pas=()=>{if(!document.body.contains(el))return;for(let i=0;i<25&&n<tot;i++){const r=sm.fer();if(r[0])a++;if(r[1])b++;n++}pinta();if(n<tot)requestAnimationFrame(pas)};pinta();setTimeout(pas,300)}

inici();
</script>
</body>
</html>
