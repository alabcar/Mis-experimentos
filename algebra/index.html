<!doctype html>
<html lang="ca-valencia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d4f8a">
<title>Àlgebra Open</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--pista:#2c6db0;--fosc:#1d4f8a;--groc:#d9f03a;--tinta:#1d2733;--paper:#fbfaf4;--bo:#1f8a4c;--mal:#c8412f;--suau:#5d6b7a;--verd:#2f6b3a}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta);font-size:17px;line-height:1.45;overflow-x:hidden;background:var(--fosc);background-image:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.55) calc(50% - 1px),rgba(255,255,255,.55) calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(180deg,var(--fosc) 0,var(--pista) 40%,var(--pista) 100%);background-attachment:fixed}
#app{position:relative;max-width:540px;margin:0 auto;min-height:100vh;padding:12px 16px 32px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.cap{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:14px}
.titol{font-size:42px;font-weight:900;color:#fff;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.titol span{color:var(--groc)}
.lema{color:#dbe8ff;font-weight:600;font-size:15px;margin-top:6px}
.vict{display:inline-flex;gap:6px;align-items:center;background:#101820;color:#fff;border-radius:8px;padding:4px 10px;font-weight:700;font-size:14px;margin-top:10px}
.vict b{background:var(--groc);color:#101820;border-radius:4px;padding:0 6px}
.idioma{background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:10px;padding:6px 12px;font-weight:800;font-size:16px}
.intro{background:rgba(10,25,50,.7);color:#eaf1ff;border-radius:14px;padding:12px 14px;font-size:15px}
.peu{color:#fff;font-size:13px;text-align:center;opacity:.85}
.bloc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border-radius:14px;padding:12px 14px;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.bloc .ic{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4ff7a,#c8de1c 60%,#9fb20f);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex:none}
.bloc b{display:block;font-size:17px}
.bloc .sub{font-size:13.5px;color:var(--suau)}
.bloc .rec{margin-left:auto;font-size:14px;font-weight:800;color:var(--bo);white-space:nowrap}
.carta{background:var(--paper);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);overflow-wrap:break-word}
h2{font-size:21px;margin-bottom:8px;line-height:1.2}
h3{font-size:17px;margin:14px 0 6px}
p{margin:6px 0}
.ronda{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--pista);margin-bottom:6px}
.gran{display:block;width:100%;background:var(--groc);color:var(--tinta);font-weight:800;font-size:18px;padding:14px;border-radius:14px;box-shadow:0 4px 0 #a9bd22}
.gran:active{transform:translateY(2px);box-shadow:0 2px 0 #a9bd22}
.sec{display:block;width:100%;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);font-weight:700;padding:11px;border-radius:14px}
.fila{display:flex;gap:10px}.fila>*{flex:1}
.barra{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:14px;gap:8px}
.barra button{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;color:#fff}
.marcador{display:grid;grid-template-columns:1fr auto auto;background:#101820;color:#fff;border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.marcador div{padding:7px 12px;font-weight:700}
.marcador .nom{display:flex;align-items:center;gap:8px}
.marcador .nom i{width:9px;height:9px;border-radius:50%;background:var(--groc);visibility:hidden}
.marcador .nom i.s{visibility:visible}
.marcador .jocs{background:#26313d;text-align:center;min-width:40px}
.marcador .pts{background:var(--groc);color:#101820;text-align:center;min-width:70px}
.marcador .sep{grid-column:1/-1;height:1px;background:#2d3946;padding:0}
.carta.preg{background:#0f1b2b;color:#fff;border-top:5px solid var(--groc)}
.tipus{font-size:12.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#9fb0c6;margin-bottom:8px}
.rally{color:var(--groc)}
.enun{font-size:18px}
.preg .enun b{color:var(--groc)}
.pas{margin-top:12px;color:#cfe0ff;font-weight:600}
.fets{margin-top:10px;font-size:14px;color:#8fe0a9;border-left:3px solid #8fe0a9;padding-left:8px}
.opcions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.op{background:#fbfaf4;color:var(--tinta);border:2px solid #d6d9de;border-radius:12px;padding:11px 10px;font-size:18px;font-weight:700;min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center}
.op.bo{border-color:var(--bo);background:#d9f2e3}
.op.mal{border-color:var(--mal);background:#fbe1dc}
.op[disabled]{opacity:1;cursor:default}
.ajuda{margin-top:12px;background:none;color:var(--groc);font-weight:700;font-size:15px;padding:4px 0}
.pistab{background:#fff8c9;color:var(--tinta);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:15px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.gros{font-size:20px}
.sist{display:inline-block;border-left:3px solid currentColor;padding:2px 0 2px 10px;margin:6px 0;font-weight:700;line-height:1.6}
table.ruff{border-collapse:collapse;margin:10px auto;background:#fbfaf4;color:var(--tinta);border-radius:10px;font-weight:700;font-size:17px}
table.ruff td{padding:5px 9px;text-align:center;min-width:36px}
table.ruff td.esq{border-right:2px solid var(--tinta)}
table.ruff tr.baix td{border-top:2px solid var(--tinta)}
table.ruff td.res{background:#eef2e4}
table.ruff em{color:var(--mal);font-style:normal;font-size:20px}
.teo .ruff{background:#eef2e4}
.exemple{background:#eef2e4;border-radius:12px;padding:10px 12px;margin:10px 0}
.exemple .etq{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--verd)}
.passos{counter-reset:p;list-style:none;margin:6px 0}
.passos li{counter-increment:p;position:relative;padding:6px 0 6px 34px;border-bottom:1px dashed #cfd3d8}
.passos li:last-child{border-bottom:0}
.passos li::before{content:counter(p);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--pista);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.llista{margin:6px 0 6px 20px}
.caixa{background:#101820;color:#fff;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:700;text-align:center;line-height:1.7}
.serv{background:#e4eefb;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15.5px}
.error{background:#fbe6e2;border-radius:10px;padding:10px;margin:8px 0;font-size:15.5px}
.taula{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px;text-align:center}
.taula td,.taula th{border:1px solid #d6d9de;padding:6px 4px}
.taula th{background:#eef2e4}
.ull{border-left:6px solid var(--mal)}
.ull.ok{border-left-color:var(--bo)}
.etiq{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mal)}
.ull.ok .etiq{color:var(--bo)}
.ull .enun{font-size:16px;background:#f0f1ec;border-radius:10px;padding:8px 10px;margin:8px 0}
.calc{font-size:14px;color:var(--suau)}
details summary{cursor:pointer;font-weight:700;color:var(--pista);margin-top:6px}
.joc{background:var(--groc);border-radius:10px;padding:6px 10px;font-weight:800;margin:6px 0;display:inline-block}
.final{text-align:center}
.final .trofeu{font-size:60px}
.final .res{font-size:20px;font-weight:800}
.dato{background:#e4eefb;border-radius:12px;padding:10px 12px;margin-top:12px;text-align:left;font-size:15.5px}
.pilota{position:fixed;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4ff7a,#c8de1c 60%,#9fb20f);z-index:9;pointer-events:none;animation:.75s ease-out forwards}
.pilota.anA{animation-name:anA}.pilota.anB{animation-name:anB}
@keyframes anA{from{left:50%;top:85%;transform:scale(1)}50%{transform:scale(1.6)}to{left:62%;top:4%;transform:scale(.7)}}
@keyframes anB{from{left:45%;top:2%;transform:scale(.7)}50%{transform:scale(1.5)}to{left:30%;top:95%;transform:scale(1)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
let LANG='va';try{LANG=localStorage.getItem('alg-idioma')||'va'}catch(e){}
const t=(va,es)=>LANG==='va'?va:es;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nz=(a,b)=>{let x;do{x=R(a,b)}while(x===0);return x};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const MN=n=>n<0?'−'+(-n):String(n+0);
const PM=n=>n<0?'('+MN(n)+')':String(n);
const SUP=['','','²','³','⁴','⁵','⁶'];
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const B=s=>`<b>${s}</b>`;
function poli(c,v='x'){const n=c.length-1;let s='';c.forEach((k,i)=>{const d=n-i;if(k===0)return;const ab=Math.abs(k);const body=d===0?String(ab):(ab===1?'':ab)+v+SUP[d];s+=s===''?(k<0?'−':'')+body:(k<0?' − ':' + ')+body});return s||'0'}
const pnorm=c=>{let i=0;while(i<c.length-1&&c[i]===0)i++;return c.slice(i).map(x=>x+0)};
function padd(a,b){const n=Math.max(a.length,b.length);const A=Array(n-a.length).fill(0).concat(a),Bb=Array(n-b.length).fill(0).concat(b);return pnorm(A.map((x,i)=>x+Bb[i]))}
const pneg=a=>a.map(x=>-x+0);
function pmul(a,b){const r=Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y));return pnorm(r)}
const pev=(c,x)=>c.reduce((s,k)=>s*x+k,0);
const deRoots=(r,a=1)=>r.reduce((p,x)=>pmul(p,[1,-x]),[a]);
const lin=(r,v='x')=>r===0?v:v+(r>0?' − ':' + ')+Math.abs(r);
const fx=r=>r===0?'x':'('+lin(r)+')';
function facs(rs){const m=new Map();rs.forEach(r=>m.set(r,(m.get(r)||0)+1));return[...m.entries()].map(([r,k])=>fx(r)+(k>1?SUP[k]:'')).join('')}
function qf(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;if(d===1)return MN(n);return(n<0?'−':'')+F(Math.abs(n),d)}
function tm(k,v,first){if(k===0)return'';const ab=Math.abs(k);const body=(ab===1&&v?'':ab)+v;return first?(k<0?'−':'')+body:(k<0?' − ':' + ')+body}
function lin2(a,b,c){const s1=tm(a,'x',true);const s2=tm(b,'y',s1==='');return s1+s2+' = '+MN(c)}
const xs=(arr,v='x')=>arr.slice().sort((p,q)=>p-q).map(r=>v+' = '+MN(r)).join(', ');
const INF='+∞',NINF='−∞';
function iv(a,b,ca,cb){return(a===null?'('+NINF:(ca?'[':'(')+MN(a))+', '+(b===null?INF+')':MN(b)+(cb?']':')'))}
function divs(n){n=Math.abs(n);const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);return d}
function ruff(c,a){const p=[null],r=[c[0]];for(let i=1;i<c.length;i++){p.push(r[i-1]*a);r.push(c[i]+p[i])}return{p,r}}
function pdiv(P,D,mal){const r=P.slice();const q=[];const n=P.length-D.length+1;for(let i=0;i<n;i++){const k=r[i]/D[0];q.push(k);for(let j=0;j<D.length;j++){if(mal&&j>0)r[i+j]+=k*D[j];else r[i+j]-=k*D[j]}}return{q:pnorm(q),r:pnorm(r.slice(n))}}
function ops(ok,mals){const seen=new Set([ok]);const r=[{h:ok,ok:1}];for(const[m,e]of mals){if(r.length>=4)break;if(m==null||seen.has(m))continue;seen.add(m);r.push({h:m,e})}return shuffle(r)}
function taula(c,a,mid,bot,cur){const td=(x,cl)=>`<td${cl?' class="'+cl+'"':''}>${x}</td>`;const n=c.length;
return`<table class="ruff"><tr>${td('','esq')}${c.map((k,i)=>td(MN(k),i===n-1?'res':'')).join('')}</tr><tr>${td(MN(a),'esq')}${c.map((_,i)=>td(i===0||mid[i]==null?'':MN(mid[i]),i===n-1?'res':'')).join('')}</tr><tr class="baix">${td('','esq')}${c.map((_,i)=>td(i===cur?'<em>?</em>':bot[i]==null?'':MN(bot[i]),i===n-1?'res':'')).join('')}</tr></table>`}

const G={};
const P1=(q,o,pista)=>({q,ops:o,pista});
const SIGNE=()=>t('Error de signe. Repassa els signes pas a pas: menys per menys és més, i menys per més és menys.','Error de signo. Repasa los signos paso a paso: menos por menos es más, y menos por más es menos.');

G.suma=()=>{const P=[nz(-4,4),R(-6,6),R(-6,6),nz(-7,7)];const Q=[nz(-5,5),nz(-6,6),nz(-7,7)];
const D=padd(P,pneg(Q));const parc=padd(P,[-Q[0],Q[1],Q[2]]);
return{enun:`P(x) = ${B(poli(P))}<br>Q(x) = ${B(poli(Q))}`,
passos:[P1(t('Calcula P(x) − Q(x)','Calcula P(x) − Q(x)'),ops(poli(D),[
[poli(parc),t('Només has canviat el signe del primer terme de Q. El signe − de davant del parèntesi canvia el signe de TOTS els termes de Q.','Solo has cambiado el signo del primer término de Q. El signo − delante del paréntesis cambia el signo de TODOS los términos de Q.')],
[poli(padd(P,Q)),t('Has sumat en lloc de restar: P − Q vol dir sumar a P l\'oposat de Q.','Has sumado en lugar de restar: P − Q significa sumar a P el opuesto de Q.')],
[poli(padd(P,[-Q[0],-Q[1],Q[2]])),t('Se t\'ha oblidat canviar el signe del terme independent de Q.','Se te ha olvidado cambiar el signo del término independiente de Q.')]]),
t('Canvia el signe de cada terme de Q i després suma els termes del mateix grau.','Cambia el signo de cada término de Q y después suma los términos del mismo grado.'))],
sol:[`P − Q = (${poli(P)}) − (${poli(Q)})`,t('Traiem el parèntesi canviant TOTS els signes de Q: ','Quitamos el paréntesis cambiando TODOS los signos de Q: ')+`${poli(P)} ${poli(pneg(Q)).startsWith('−')?'− '+poli(pneg(Q)).slice(1):'+ '+poli(pneg(Q))}`,t('Agrupem els termes del mateix grau: ','Agrupamos los términos del mismo grado: ')+B(poli(D))]}};

G.prod=()=>{const a=pick([1,1,2,3]),c=pick([1,2]),b=nz(-6,6),d=nz(-6,6);
const ok=[a*c,a*d+b*c,b*d];const ax=poli([a,0]),cx=poli([c,0]);
return{enun:t('Multiplica:','Multiplica:')+` ${B('('+poli([a,b])+')('+poli([c,d])+')')}`,
passos:[P1(t('Quin és el resultat?','¿Cuál es el resultado?'),ops(poli(ok),[
[poli([a*c,0,b*d]),t('T\'has deixat els productes creuats. Cada terme del primer parèntesi es multiplica per CADA terme del segon: són 4 productes.','Te has dejado los productos cruzados. Cada término del primer paréntesis se multiplica por CADA término del segundo: son 4 productos.')],
[poli([a*c,a*d+b*c,-b*d]),t(`Error de signe en l'últim producte: ${PM(b)}·${PM(d)} = ${MN(b*d)}.`,`Error de signo en el último producto: ${PM(b)}·${PM(d)} = ${MN(b*d)}.`)],
[poli([a*c,a*b+c*d,b*d]),t('Els termes en x són ('+ax+')·('+MN(d)+') i ('+MN(b)+')·('+cx+'), no els que has multiplicat.','Los términos en x son ('+ax+')·('+MN(d)+') y ('+MN(b)+')·('+cx+'), no los que has multiplicado.')],
[poli([a*c,a*d-b*c,b*d]),SIGNE()]]),
t('Propietat distributiva: primer·primer, primer·segon, segon·primer, segon·segon.','Propiedad distributiva: primero·primero, primero·segundo, segundo·primero, segundo·segundo.'))],
sol:[`(${ax})·(${cx}) = ${poli([a*c,0,0])}`,`(${ax})·(${MN(d)}) = ${poli([a*d,0])}`,`(${MN(b)})·(${cx}) = ${poli([b*c,0])}`,`(${MN(b)})·(${MN(d)}) = ${MN(b*d)}`,t('Sumem i agrupem: ','Sumamos y agrupamos: ')+B(poli(ok))]}};

G.notable=()=>{const k=pick([1,1,2,3]),a=R(1,7);const kx=poli([k,0]);const tipus=pick(['+','−','·']);
if(tipus==='·'){const ok=[k*k,0,-a*a];return{enun:t('Desenvolupa amb una identitat notable:','Desarrolla con una identidad notable:')+` ${B('('+kx+' + '+a+')('+kx+' − '+a+')')}`,
passos:[P1(t('Quin és el resultat?','¿Cuál es el resultado?'),ops(poli(ok),[
[poli([k*k,0,a*a]),t('Suma per diferència és diferència de quadrats: el segon quadrat va RESTANT.','Suma por diferencia es diferencia de cuadrados: el segundo cuadrado va RESTANDO.')],
[poli([k*k,2*k*a,-a*a]),t('Ací no hi ha terme del mig: els productes creuats +'+k*a+'x i −'+k*a+'x s\'anul·len.','Aquí no hay término del medio: los productos cruzados +'+k*a+'x y −'+k*a+'x se anulan.')],
[k>1?poli([k,0,-a*a]):poli([1,-2*a,-a*a]),k>1?t(`(${kx})² = ${k*k}x², no ${k}x²: el quadrat afecta també al número.`,`(${kx})² = ${k*k}x², no ${k}x²: el cuadrado afecta también al número.`):t('Això no és cap identitat notable: (a + b)(a − b) = a² − b².','Eso no es ninguna identidad notable: (a + b)(a − b) = a² − b².')]]),
t('(a + b)(a − b) = a² − b²','(a + b)(a − b) = a² − b²'))],
sol:[t('Suma per diferència = diferència de quadrats: (a + b)(a − b) = a² − b²','Suma por diferencia = diferencia de cuadrados: (a + b)(a − b) = a² − b²'),`a = ${kx}, b = ${a}`,`(${kx})² − ${a}² = `+B(poli(ok))]}}
const s=tipus==='+'?1:-1;const ok=[k*k,2*k*a*s,a*a];
return{enun:t('Desenvolupa amb una identitat notable:','Desarrolla con una identidad notable:')+` ${B('('+kx+' '+tipus+' '+a+')²')}`,
passos:[P1(t('Quin és el resultat?','¿Cuál es el resultado?'),ops(poli(ok),[
[poli([k*k,0,a*a]),t(`Falta el doble producte 2·(${kx})·(${a}). (a ${tipus} b)² NO és a² + b².`,`Falta el doble producto 2·(${kx})·(${a}). (a ${tipus} b)² NO es a² + b².`)],
[poli([k*k,k*a*s,a*a]),t('El terme del mig és el DOBLE del producte: 2·a·b.','El término del medio es el DOBLE del producto: 2·a·b.')],
[poli([k*k,2*k*a*s,-a*a]),t(`L'últim terme és ${a}² = ${a*a}, que és positiu: un quadrat mai no és negatiu.`,`El último término es ${a}² = ${a*a}, que es positivo: un cuadrado nunca es negativo.`)],
[k>1?poli([k,2*k*a*s,a*a]):poli([1,-2*a*s,a*a]),k>1?t(`(${kx})² = ${k*k}x², no ${k}x².`,`(${kx})² = ${k*k}x², no ${k}x².`):t('El signe del terme del mig és el mateix que el del binomi.','El signo del término del medio es el mismo que el del binomio.')]]),
t(`(a ${tipus} b)² = a² ${tipus==='+'?'+':'−'} 2ab + b²`,`(a ${tipus} b)² = a² ${tipus==='+'?'+':'−'} 2ab + b²`))],

[t(`Més de ${Math.round(q/p2)} hores`,`Más de ${Math.round(q/p2)} horas`),t(`La inequació és ${q} + ${p1}h < ${p2}h: cal passar ${p1}h a la dreta i queda ${p2-p1}h.`,`La inecuación es ${q} + ${p1}h < ${p2}h: hay que pasar ${p1}h a la derecha y queda ${p2-p1}h.`)],

<ol class="passos"><li>${t('Factoritza els denominadors.','Factoriza los denominadores.')}</li><li>${t('Troba el <b>m.c.m.</b>: tots els factors, cadascun amb l\'exponent més gran.','Halla el <b>m.c.m.</b>: todos los factores, cada uno con el exponente más grande.')}</li><li>${t('Multiplica cada numerador pel que li falta al seu denominador per a arribar al m.c.m.','Multiplica cada numerador por lo que le falta a su denominador para llegar al m.c.m.')}</li><li>${t('Suma els numeradors (compte amb els − davant de fraccions!).','Suma los numeradores (¡cuidado con los − delante de fracciones!).')}</li></ol>
${EX(EJ(),[`${F(3,'x − 1')} − ${F(2,'x + 2')}`,t('m.c.m. = (x − 1)(x + 2)','m.c.m. = (x − 1)(x + 2)'),`${F('3(x + 2) − 2(x − 1)','(x − 1)(x + 2)')} = ${F('3x + 6 − 2x + 2','(x − 1)(x + 2)')}`,`= <b>${F('x + 8','(x − 1)(x + 2)')}</b>`])}
${OJO(t('El − davant d\'una fracció canvia el signe de TOT el seu numerador: −2(x − 1) = −2x <b>+ 2</b>.','El − delante de una fracción cambia el signo de TODO su numerador: −2(x − 1) = −2x <b>+ 2</b>.'))}`,
`<h2>${t('Multiplicar i dividir','Multiplicar y dividir')}</h2>
${CAIXA(`${F('a','b')} · ${F('c','d')} = ${F('a·c','b·d')} &nbsp;&nbsp;&nbsp; ${F('a','b')} : ${F('c','d')} = ${F('a·d','b·c')}`)}
<p>${t('Truc: no multipliques res abans d\'hora. Deixa-ho tot factoritzat, simplifica i, al final, multiplica el que quede.','Truco: no multipliques nada antes de tiempo. Déjalo todo factorizado, simplifica y, al final, multiplica lo que quede.')}</p>
${EX(EJ(),[`${F('x² − 1','x')} : ${F('x + 1','x²')}`,`= ${F('(x² − 1)·x²','x·(x + 1)')} = ${F('(x + 1)(x − 1)·x²','x·(x + 1)')}`,t('Simplifiquem (x + 1) i una x:','Simplificamos (x + 1) y una x:')+` <b>x(x − 1)</b>`])}`]},

{id:'eq2',gens:['formula','formula','discr','incompleta','sumaprod','pista'],tit:()=>t('Equacions de 2n grau','Ecuaciones de 2º grado'),sub:()=>t('Fórmula, discriminant, incompletes, problemes','Fórmula, discriminante, incompletas, problemas'),
rival:'Bhaskara',fet:()=>t('Al Brasil i altres països la fórmula de l\'equació de 2n grau es diu «fórmula de Bhaskara», per este matemàtic indi del segle XII, tot i que ja la coneixien abans altres matemàtics indis i babilonis.','En Brasil y otros países la fórmula de la ecuación de 2º grado se llama «fórmula de Bhaskara», por este matemático indio del siglo XII, aunque ya la conocían antes otros matemáticos indios y babilonios.'),
pags:()=>[
`<h2>${t('La fórmula','La fórmula')}</h2>
<p>${t('Primer, deixa-ho tot igualat a 0: <b>ax² + bx + c = 0</b>.','Primero, déjalo todo igualado a 0: <b>ax² + bx + c = 0</b>.')}</p>
${CAIXA(`x = ${F('−b ± √(b² − 4ac)','2a')}`)}
${EX(EJ()+': 2x² − 3 = −5x',[t('Igualem a 0: 2x² + 5x − 3 = 0 → a = 2, b = 5, c = −3','Igualamos a 0: 2x² + 5x − 3 = 0 → a = 2, b = 5, c = −3'),`Δ = 5² − 4·2·(−3) = 25 + 24 = 49`,`x = ${F('−5 ± 7','4')}`,`x₁ = ${F(2,4)} = <b>${F(1,2)}</b>, x₂ = ${F('−12',4)} = <b>−3</b>`])}
${OJO(t('Els tres errors més típics: no igualar a 0 abans, oblidar el − de −b, i dividir només entre a (és entre <b>2a</b>).','Los tres errores más típicos: no igualar a 0 antes, olvidar el − de −b, y dividir solo entre a (es entre <b>2a</b>).'))}
${SERV(t('Si llances una pilota cap amunt, la seua altura és h = −5t² + v·t + h₀. Saber quan toca a terra és resoldre una equació de 2n grau.','Si lanzas una pelota hacia arriba, su altura es h = −5t² + v·t + h₀. Saber cuándo toca el suelo es resolver una ecuación de 2º grado.'))}`,
`<h2>${t('El discriminant Δ','El discriminante Δ')}</h2>
${CAIXA(`Δ = b² − 4ac`)}
<ul class="llista"><li>${t('Δ > 0 → <b>dues</b> solucions diferents','Δ > 0 → <b>dos</b> soluciones distintas')}</li><li>${t('Δ = 0 → <b>una</b> solució doble','Δ = 0 → <b>una</b> solución doble')}</li><li>${t('Δ < 0 → <b>cap</b> solució real (no hi ha arrel de negatius)','Δ < 0 → <b>ninguna</b> solución real (no hay raíz de negativos)')}</li></ul>
<h3>${t('Incompletes (sense fórmula!)','Incompletas (¡sin fórmula!)')}</h3>
${EX(t('Sense b: ax² + c = 0','Sin b: ax² + c = 0'),[`3x² − 48 = 0 → x² = 16 → <b>x = ±4</b>`,t('Si queda x² = negatiu → no té solució.','Si queda x² = negativo → no tiene solución.')])}
${EX(t('Sense c: ax² + bx = 0','Sin c: ax² + bx = 0'),[t('Factor comú: x(2x − 6) = 0','Factor común: x(2x − 6) = 0'),`<b>x = 0</b> ${t('o','o')} 2x − 6 = 0 → <b>x = 3</b>`])}
${OJO(t('Mai dividisques entre x: perdries la solució x = 0.','Nunca dividas entre x: perderías la solución x = 0.'))}`,
`<h2>${t('Suma, producte i problemes','Suma, producto y problemas')}</h2>
<p>${t('Si les solucions són x₁ i x₂, l\'equació és (x − x₁)(x − x₂) = 0, és a dir:','Si las soluciones son x₁ y x₂, la ecuación es (x − x₁)(x − x₂) = 0, es decir:')}</p>
${CAIXA(`x² − S·x + P = 0 &nbsp; (S = x₁ + x₂, P = x₁·x₂)`)}
<h3>${t('Com plantejar un problema','Cómo plantear un problema')}</h3>
<ol class="passos"><li>${t('Tria què és x (escriu-ho!).','Elige qué es x (¡escríbelo!).')}</li><li>${t('Escriu les altres quantitats en funció de x.','Escribe las otras cantidades en función de x.')}</li><li>${t('Planteja l\'equació i resol-la.','Plantea la ecuación y resuélvela.')}</li><li>${t('Descarta les solucions sense sentit (longituds negatives…) i comprova.','Descarta las soluciones sin sentido (longitudes negativas…) y comprueba.')}</li></ol>
${EX(t('Exemple: una pista fa 6 m més de llarg que d\'ample i 112 m²','Ejemplo: una pista mide 6 m más de largo que de ancho y 112 m²'),[t('Ample x, llarg x + 6 → x(x + 6) = 112','Ancho x, largo x + 6 → x(x + 6) = 112'),`x² + 6x − 112 = 0 → x = ${F('−6 ± 22','2')}`,t('x = 8 o x = −14 (no val) → <b>8 m × 14 m</b>','x = 8 o x = −14 (no vale) → <b>8 m × 14 m</b>')])}`]},

{id:'eqs',gens:['biq','grau3','prod0','racional','irr','irr'],tit:()=>t('Altres equacions','Otras ecuaciones'),sub:()=>t('Biquadrades, grau 3, racionals, irracionals','Bicuadradas, grado 3, racionales, irracionales'),
rival:'Tartaglia',fet:()=>t('En el segle XVI els matemàtics feien «duels» públics de problemes. En 1535 Niccolò Tartaglia va guanyar un duel perquè havia descobert en secret com resoldre equacions de grau 3.','En el siglo XVI los matemáticos hacían «duelos» públicos de problemas. En 1535 Niccolò Tartaglia ganó un duelo porque había descubierto en secreto cómo resolver ecuaciones de grado 3.'),
pags:()=>[
`<h2>${t('Biquadrades','Bicuadradas')}</h2>
<p>${t('Són de la forma <b>ax⁴ + bx² + c = 0</b> (només x⁴, x² i número). Es resolen amb un canvi de variable.','Son de la forma <b>ax⁴ + bx² + c = 0</b> (solo x⁴, x² y número). Se resuelven con un cambio de variable.')}</p>
${EX(EJ()+': x⁴ − 13x² + 36 = 0',[t('Canvi t = x² (i x⁴ = t²): t² − 13t + 36 = 0','Cambio t = x² (y x⁴ = t²): t² − 13t + 36 = 0'),`t = ${F('13 ± 5',2)} → t = 9, t = 4`,t('Desfem el canvi: x² = 9 → x = ±3; x² = 4 → x = ±2','Deshacemos el cambio: x² = 9 → x = ±3; x² = 4 → x = ±2'),t('<b>4 solucions: −3, −2, 2, 3</b>','<b>4 soluciones: −3, −2, 2, 3</b>')])}
${OJO(t('Si algun t ix negatiu, x² = negatiu no té solució: eixe t es descarta.','Si algún t sale negativo, x² = negativo no tiene solución: ese t se descarta.'))}
<h3>${t('Grau 3 o més','Grado 3 o más')}</h3>
<p>${t('Factoritza (factor comú, Ruffini…) i iguala cada factor a 0. Si ja està factoritzada, no multipliques: (x − 2)(x + 1)(3x − 1) = 0 → x = 2, x = −1, x = 1/3.','Factoriza (factor común, Ruffini…) e iguala cada factor a 0. Si ya está factorizada, no multipliques: (x − 2)(x + 1)(3x − 1) = 0 → x = 2, x = −1, x = 1/3.')}</p>`,
`<h2>${t('Racionals (x al denominador)','Racionales (x en el denominador)')}</h2>
<ol class="passos"><li>${t('Apunta quins valors anul·len algun denominador: estan prohibits.','Apunta qué valores anulan algún denominador: están prohibidos.')}</li><li>${t('Multiplica TOTS els termes pel m.c.m. dels denominadors.','Multiplica TODOS los términos por el m.c.m. de los denominadores.')}</li><li>${t('Resol l\'equació que queda i descarta els valors prohibits.','Resuelve la ecuación que queda y descarta los valores prohibidos.')}</li></ol>
${EX(EJ()+': x + '+F(6,'x')+' = 5',[t('x ≠ 0. Multipliquem per x: x² + 6 = 5x','x ≠ 0. Multiplicamos por x: x² + 6 = 5x'),`x² − 5x + 6 = 0 → <b>x = 2, x = 3</b> ${t('(cap és 0, valen les dues)','(ninguna es 0, valen las dos)')}`])}
${SERV(t('Apareixen en problemes de «treball en equip», velocitats mitjanes o preus per persona.','Aparecen en problemas de «trabajo en equipo», velocidades medias o precios por persona.'))}`,
`<h2>${t('Irracionals (x dins d\'una arrel)','Irracionales (x dentro de una raíz)')}</h2>
<ol class="passos"><li>${t('Aïlla l\'arrel en un costat.','Aísla la raíz en un lado.')}</li><li>${t('Eleva els dos costats al quadrat (el de l\'altre costat, amb identitat notable).','Eleva los dos lados al cuadrado (el del otro lado, con identidad notable).')}</li><li>${t('Resol i <b>COMPROVA</b> cada solució en l\'equació original.','Resuelve y <b>COMPRUEBA</b> cada solución en la ecuación original.')}</li></ol>
${EX(EJ()+': √(x + 6) = x',[`x + 6 = x² → x² − x − 6 = 0 → x = 3, x = −2`,t('x = 3: √9 = 3 ✔','x = 3: √9 = 3 ✔'),t('x = −2: √4 = 2, però la dreta val −2 ✘','x = −2: √4 = 2, pero la derecha vale −2 ✘'),t('<b>Solució: x = 3</b>','<b>Solución: x = 3</b>')])}
${OJO(t('En elevar al quadrat poden aparéixer solucions falses (perquè 2² i (−2)² donen el mateix). Per això la comprovació és OBLIGATÒRIA.','Al elevar al cuadrado pueden aparecer soluciones falsas (porque 2² y (−2)² dan lo mismo). Por eso la comprobación es OBLIGATORIA.'))}`]},

{id:'sist',gens:['sistema','sistema','classif','nolineal','botiga'],tit:()=>t('Sistemes d\'equacions','Sistemas de ecuaciones'),sub:()=>t('Reducció, substitució, no lineals, problemes','Reducción, sustitución, no lineales, problemas'),
rival:'Carl F. Gauss',fet:()=>t('El mètode de reducció es diu «de Gauss» quan hi ha moltes equacions. Però un llibre xinés de fa uns 2.000 anys, «Els nou capítols», ja el feia servir amb taules de números!','El método de reducción se llama «de Gauss» cuando hay muchas ecuaciones. ¡Pero un libro chino de hace unos 2.000 años, «Los nueve capítulos», ya lo usaba con tablas de números!'),
pags:()=>[
`<h2>${t('Sistemes lineals 2×2','Sistemas lineales 2×2')}</h2>
<p>${t('Dues equacions amb dues incògnites. La solució és la parella (x, y) que compleix LES DUES alhora.','Dos ecuaciones con dos incógnitas. La solución es la pareja (x, y) que cumple LAS DOS a la vez.')}</p>
${EX(t('Reducció','Reducción'),[`<div class="sist">2x + 3y = 7<br>4x − 3y = 5</div>`,t('Els coeficients de y són oposats: sumem → 6x = 12 → <b>x = 2</b>','Los coeficientes de y son opuestos: sumamos → 6x = 12 → <b>x = 2</b>'),t('Substituïm en la 1a: 4 + 3y = 7 → <b>y = 1</b>','Sustituimos en la 1ª: 4 + 3y = 7 → <b>y = 1</b>'),t('Comprovem en la 2a: 8 − 3 = 5 ✔','Comprobamos en la 2ª: 8 − 3 = 5 ✔')])}
<p>${t('Si no són oposats, multiplica abans una equació (o les dues) per a aconseguir-ho.','Si no son opuestos, multiplica antes una ecuación (o las dos) para conseguirlo.')}</p>
${EX(t('Substitució','Sustitución'),[`<div class="sist">x + 2y = 4<br>3x − y = 5</div>`,t('Aïllem x de la 1a: x = 4 − 2y','Despejamos x de la 1ª: x = 4 − 2y'),t('3(4 − 2y) − y = 5 → 12 − 7y = 5 → <b>y = 1</b>, x = 4 − 2 = <b>2</b>','3(4 − 2y) − y = 5 → 12 − 7y = 5 → <b>y = 1</b>, x = 4 − 2 = <b>2</b>')])}
${SERV(t('Sempre que hi ha dues coses desconegudes relacionades: preus, mescles, edats, velocitats… Els GPS i els videojocs resolen sistemes enormes milers de vegades per segon.','Siempre que hay dos cosas desconocidas relacionadas: precios, mezclas, edades, velocidades… Los GPS y los videojuegos resuelven sistemas enormes miles de veces por segundo.'))}`,
`<h2>${t('Quantes solucions?','¿Cuántas soluciones?')}</h2>
<p>${t('Cada equació lineal és una recta. La solució és on es tallen.','Cada ecuación lineal es una recta. La solución es donde se cortan.')}</p>
<table class="taula"><tr><th>${t('Coeficients','Coeficientes')}</th><th>${t('Rectes','Rectas')}</th><th>${t('Sistema','Sistema')}</th></tr>
<tr><td>a/a' ≠ b/b'</td><td>${t('es tallen','se cortan')}</td><td>${t('Compatible determinat (1 sol.)','Compatible determinado (1 sol.)')}</td></tr>
<tr><td>a/a' = b/b' = c/c'</td><td>${t('coincidents','coincidentes')}</td><td>${t('Compatible indeterminat (∞)','Compatible indeterminado (∞)')}</td></tr>
<tr><td>a/a' = b/b' ≠ c/c'</td><td>${t('paral·leles','paralelas')}</td><td>${t('Incompatible (cap)','Incompatible (ninguna)')}</td></tr></table>
${EX(EJ(),[`<div class="sist">x + 2y = 3<br>2x + 4y = 5</div>`,`1/2 = 2/4 ≠ 3/5 → <b>${t('incompatible','incompatible')}</b>`])}`,
`<h2>${t('Sistemes no lineals','Sistemas no lineales')}</h2>
<p>${t('Quan alguna equació té x², xy, etc. Quasi sempre: <b>substitució</b>.','Cuando alguna ecuación tiene x², xy, etc. Casi siempre: <b>sustitución</b>.')}</p>
${EX(EJ(),[`<div class="sist">x + y = 7<br>x·y = 12</div>`,t('y = 7 − x → x(7 − x) = 12 → x² − 7x + 12 = 0','y = 7 − x → x(7 − x) = 12 → x² − 7x + 12 = 0'),t('x = 3 → y = 4; &nbsp; x = 4 → y = 3','x = 3 → y = 4; &nbsp; x = 4 → y = 3'),t('<b>Dues solucions: (3, 4) i (4, 3)</b>','<b>Dos soluciones: (3, 4) y (4, 3)</b>')])}
${OJO(t('Cada valor de x dona la seua y: no et quedes només amb una parella.','Cada valor de x da su y: no te quedes solo con una pareja.'))}`]},

{id:'ineq',gens:['ineq1','ineq1','ineq2','ineq2','sistineq','club'],tit:()=>t('Inequacions','Inecuaciones'),sub:()=>t('1r i 2n grau, sistemes, intervals','1º y 2º grado, sistemas, intervalos'),
rival:'Thomas Harriot',fet:()=>t('Els símbols < i > els va introduir l\'anglés Thomas Harriot en un llibre publicat en 1631. Harriot també va ser dels primers a dibuixar la Lluna amb telescopi, uns mesos abans que Galileu.','Los símbolos < y > los introdujo el inglés Thomas Harriot en un libro publicado en 1631. Harriot también fue de los primeros en dibujar la Luna con telescopio, unos meses antes que Galileo.'),
pags:()=>[
`<h2>${t('Intervals','Intervalos')}</h2>
<p>${t('La solució d\'una inequació és un conjunt de números, que s\'escriu amb <b>intervals</b>:','La solución de una inecuación es un conjunto de números, que se escribe con <b>intervalos</b>:')}</p>
<table class="taula"><tr><th>${t('Desigualtat','Desigualdad')}</th><th>${t('Interval','Intervalo')}</th></tr><tr><td>x < 3</td><td>(−∞, 3)</td></tr><tr><td>x ≤ 3</td><td>(−∞, 3]</td></tr><tr><td>x > −1</td><td>(−1, +∞)</td></tr><tr><td>−1 ≤ x < 3</td><td>[−1, 3)</td></tr></table>
${CAIXA(t('( ) → el número NO entra (< o >). &nbsp; [ ] → SÍ entra (≤ o ≥). L\'∞ sempre amb parèntesi.','( ) → el número NO entra (< o >). &nbsp; [ ] → SÍ entra (≤ o ≥). El ∞ siempre con paréntesis.'))}
${SERV(t('Les inequacions responen preguntes de «a partir de quan» o «com a màxim»: a partir de quantes hores compensa una quota, quina nota necessites per a aprovar, quina velocitat no has de passar…','Las inecuaciones responden preguntas de «a partir de cuándo» o «como máximo»: a partir de cuántas horas compensa una cuota, qué nota necesitas para aprobar, qué velocidad no debes pasar…'))}`,
`<h2>${t('Inequacions de 1r grau','Inecuaciones de 1er grado')}</h2>
<p>${t('Es resolen com una equació, amb UNA regla extra:','Se resuelven como una ecuación, con UNA regla extra:')}</p>
${CAIXA(t('Si multipliques o divideixes per un número <b>negatiu</b>, el símbol <b>gira</b> (< passa a >).','Si multiplicas o divides por un número <b>negativo</b>, el símbolo <b>gira</b> (< pasa a >).'))}
${EX(EJ()+': 5 − 3x ≤ 11',[`−3x ≤ 6`,t('Dividim entre −3 → gira: x ≥ −2','Dividimos entre −3 → gira: x ≥ −2'),`<b>[−2, +∞)</b>`])}
<p>${t('<b>Per què gira?</b> 2 < 5, però si multipliquem per −1: −2 > −5.','<b>¿Por qué gira?</b> 2 < 5, pero si multiplicamos por −1: −2 > −5.')}</p>
<h3>${t('Sistemes d\'inequacions','Sistemas de inecuaciones')}</h3>
<p>${t('Resol cada una per separat i queda\'t amb la <b>part comuna</b> (intersecció). Si no se solapen, no hi ha solució.','Resuelve cada una por separado y quédate con la <b>parte común</b> (intersección). Si no se solapan, no hay solución.')}</p>
${EX(EJ(),[t('x > 1 i x ≤ 4','x > 1 y x ≤ 4'),`→ <b>(1, 4]</b>`])}`,
`<h2>${t('Inequacions de 2n grau','Inecuaciones de 2º grado')}</h2>
<ol class="passos"><li>${t('Iguala a 0 i troba les arrels.','Iguala a 0 y halla las raíces.')}</li><li>${t('Les arrels parteixen la recta en trams. Mira el signe en cada tram (prova un número).','Las raíces parten la recta en tramos. Mira el signo en cada tramo (prueba un número).')}</li><li>${t('Tria els trams que complixen el símbol. Amb ≤ o ≥, les arrels també entren.','Elige los tramos que cumplen el símbolo. Con ≤ o ≥, las raíces también entran.')}</li></ol>
${EX(EJ()+': x² − x − 6 < 0',[t('Arrels: x = −2, x = 3','Raíces: x = −2, x = 3'),t('Proves: x = −3 → 6 (+); x = 0 → −6 (−); x = 4 → 6 (+)','Pruebas: x = −3 → 6 (+); x = 0 → −6 (−); x = 4 → 6 (+)'),t('Volem < 0 (negatiu) → tram del mig: <b>(−2, 3)</b>','Queremos < 0 (negativo) → tramo del medio: <b>(−2, 3)</b>')])}
${OJO(t('Si x² té coeficient positiu, la paràbola va cap amunt: els signes són + − + (positiu fora, negatiu entre les arrels). Si és negatiu, al revés.','Si x² tiene coeficiente positivo, la parábola va hacia arriba: los signos son + − + (positivo fuera, negativo entre las raíces). Si es negativo, al revés.'))}`]}
];

const NOMG={suma:()=>t('Sumar i restar','Sumar y restar'),prod:()=>t('Multiplicar','Multiplicar'),notable:()=>t('Identitats notables','Identidades notables'),valor:()=>t('Valor numèric','Valor numérico'),divisio:()=>t('Divisió de polinomis','División de polinomios'),taula:()=>t('Taula de Ruffini','Tabla de Ruffini'),residu:()=>t('Teorema del residu','Teorema del resto'),kval:()=>t('Trobar k','Hallar k'),cand:()=>t('Possibles arrels','Posibles raíces'),arrel:()=>t('Buscar una arrel','Buscar una raíz'),comu:()=>t('Factor comú','Factor común'),ident:()=>t('Factoritzar amb identitats','Factorizar con identidades'),trinomi:()=>t('Factoritzar grau 2','Factorizar grado 2'),completa:()=>t('Factoritzar grau 3','Factorizar grado 3'),simp:()=>t('Simplificar','Simplificar'),sumafr:()=>t('Sumar i restar fraccions','Sumar y restar fracciones'),multfr:()=>t('Multiplicar i dividir','Multiplicar y dividir'),mcm:()=>t('m.c.m. de polinomis','m.c.m. de polinomios'),formula:()=>t('La fórmula','La fórmula'),discr:()=>t('Discriminant','Discriminante'),incompleta:()=>t('Incompletes','Incompletas'),sumaprod:()=>t('Suma i producte','Suma y producto'),pista:()=>t('Problema','Problema'),biq:()=>t('Biquadrades','Bicuadradas'),grau3:()=>t('Grau 3','Grado 3'),prod0:()=>t('Producte igual a zero','Producto igual a cero'),racional:()=>t('Racionals','Racionales'),irr:()=>t('Irracionals','Irracionales'),sistema:()=>t('Reducció','Reducción'),classif:()=>t('Classificar sistemes','Clasificar sistemas'),nolineal:()=>t('Sistema no lineal','Sistema no lineal'),botiga:()=>t('Problema de sistemes','Problema de sistemas'),ineq1:()=>t('Inequació de 1r grau','Inecuación de 1er grado'),ineq2:()=>t('Inequació de 2n grau','Inecuación de 2º grado'),sistineq:()=>t('Sistema d\'inequacions','Sistema de inecuaciones'),club:()=>t('Problema d\'inequacions','Problema de inecuaciones')};
const $a=()=>document.getElementById('app');
function pinta(h){$a().innerHTML=h;window.scrollTo(0,0)}
function llig(k,d){try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}}
function desa(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function canviaIdioma(){LANG=LANG==='va'?'es':'va';try{localStorage.setItem('alg-idioma',LANG)}catch(e){}document.documentElement.lang=LANG==='va'?'ca-valencia':'es';inici()}
let S=null;

function inici(){S=null;const v=llig('alg-vict','{}');const n=BLOCS.filter(B=>v[B.id]).length;
pinta(`<div class="cap"><div><div class="titol">Àlgebra <span>Open</span></div><div class="lema">${t('Torneig d\'àlgebra · 4t d\'ESO','Torneo de álgebra · 4º de ESO')}</div><div class="vict">🏆 <b>${n}/${BLOCS.length}</b> ${t('rondes guanyades','rondas ganadas')}</div></div><button class="idioma" onclick="canviaIdioma()">${LANG==='va'?'es':'va'}</button></div>
<div class="intro"><b>${t('Com es juga','Cómo se juega')}</b><br>${t('Cada ronda és un tema. Primer, l\'<b>escalfament</b>: teoria amb exemples resolts. Després, el <b>partit</b> contra un matemàtic famós. Cada pregunta és un punt; algunes són un <b>rally</b> de diversos colps (els passos d\'un exercici) i has d\'encertar-los tots. Si falles, l\'<b>Ull de falcó</b> t\'explica l\'error i la solució pas a pas. Guanya 2 jocs i passes ronda.','Cada ronda es un tema. Primero, el <b>calentamiento</b>: teoría con ejemplos resueltos. Después, el <b>partido</b> contra un matemático famoso. Cada pregunta es un punto; algunas son un <b>rally</b> de varios golpes (los pasos de un ejercicio) y tienes que acertarlos todos. Si fallas, el <b>Ojo de halcón</b> te explica el error y la solución paso a paso. Gana 2 juegos y pasas de ronda.')}</div>
${BLOCS.map((B,i)=>`<button class="bloc" onclick="obri(${i})"><span class="ic">${i+1}</span><span><b>${B.tit()}</b><span class="sub">${B.sub()} · vs. ${B.rival}</span></span><span class="rec">${v[B.id]?'🏆'+(v[B.id]>1?'×'+v[B.id]:''):''}</span></button>`).join('')}
<div class="peu">${t('Els teus trofeus es guarden en este dispositiu.','Tus trofeos se guardan en este dispositivo.')}</div>`)}

function obri(i){teoria(i,0,false)}
function teoria(i,p,enPartit){const B=BLOCS[i];const P=B.pags();const n=P.length;
pinta(`<div class="barra"><button onclick="${enPartit?'tornaPartit()':'inici()'}">← ${enPartit?t('Al partit','Al partido'):t('Torneig','Torneo')}</button><span>${t('Escalfament','Calentamiento')} ${p+1}/${n}</span></div>
<div class="carta teo"><div class="ronda">${t('Ronda','Ronda')} ${i+1} · ${B.tit()}</div>${P[p]}</div>
<div class="fila">${p>0?`<button class="sec" onclick="teoria(${i},${p-1},${enPartit})">← ${t('Anterior','Anterior')}</button>`:''}${p<n-1?`<button class="gran" onclick="teoria(${i},${p+1},${enPartit})">${t('Següent','Siguiente')} →</button>`:enPartit?`<button class="gran" onclick="tornaPartit()">${t('Tornar al partit','Volver al partido')} 🎾</button>`:`<button class="gran" onclick="partit(${i})">${t('Al partit!','¡Al partido!')} 🎾</button>`}</div>
${!enPartit&&p<n-1?`<button class="sec" onclick="partit(${i})">${t('Saltar al partit','Saltar al partido')}</button>`:''}`)}

function partit(i){S={b:i,pt:[0,0],jocs:[0,0],ratxa:0,millor:0,ult:null,serveix:0};nova()}
function tria(){const B=BLOCS[S.b];const f=llig('alg-flojos','{}');const w=B.gens.map(g=>(g===S.ult?0.25:1)+(f[g]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let k=0;k<w.length;k++){r-=w[k];if(r<=0)return B.gens[k]}return B.gens[0]}
function anota(g,ok){const f=llig('alg-flojos','{}');f[g]=Math.max(0,Math.min(6,(f[g]||0)+(ok?-1:2)));desa('alg-flojos',f)}
function nova(){const g=tria();S.ult=g;S.q=G[g]();S.q.g=g;S.pas=0;S.fets=[];pregunta()}
function txtPunts(){const[a,b]=S.pt;const N=['0','15','30','40'];if(a>=3&&b>=3){if(a===b)return[t('Iguals','Iguales'),t('Iguals','Iguales')];return a>b?['AV','']:['','AV']}return[N[a],N[b]]}
function marcador(){const p=txtPunts();const B=BLOCS[S.b];
return`<div class="marcador"><div class="nom"><i class="${S.serveix?'':'s'}"></i>${t('Tu','Tú')}</div><div class="jocs">${S.jocs[0]}</div><div class="pts">${p[0]}</div><div class="sep"></div><div class="nom"><i class="${S.serveix?'s':''}"></i>${B.rival}</div><div class="jocs">${S.jocs[1]}</div><div class="pts">${p[1]}</div></div>`}
function pregunta(){const Q=S.q;const P=Q.passos[S.pas];const n=Q.passos.length;
pinta(`<div class="barra"><button onclick="inici()">✕</button><span>${t('Ronda','Ronda')} ${S.b+1} · ${t('ratxa','racha')} ${S.ratxa} 🔥</span><button onclick="teoria(${S.b},0,true)">📖 ${t('Teoria','Teoría')}</button></div>
${marcador()}
<div class="carta preg"><div class="tipus">${NOMG[Q.g]()}${n>1?` · <span class="rally">RALLY ${t('colp','golpe')} ${S.pas+1}/${n}</span>`:''}</div>
<div class="enun">${Q.enun}</div>
${S.fets.length?`<div class="fets">${S.fets.map(f=>`<div>✔ ${f}</div>`).join('')}</div>`:''}
<div class="pas">${P.q}</div>
<div class="opcions">${P.ops.map((o,k)=>`<button class="op" onclick="respon(${k})">${o.h}</button>`).join('')}</div>
<button class="ajuda" onclick="pistaV()">💡 ${t('Pista','Pista')}</button><div id="pb"></div></div>`)}
function pistaV(){document.getElementById('pb').innerHTML=`<div class="pistab">${S.q.passos[S.pas].pista}</div>`}
function tornaPartit(){if(!S)return inici();pregunta()}
function bota(cl){const b=document.createElement('div');b.className='pilota '+cl;document.body.appendChild(b);setTimeout(()=>b.remove(),800)}
function respon(k){const Q=S.q;const P=Q.passos[S.pas];const o=P.ops[k];const bs=document.querySelectorAll('.op');bs.forEach(b=>b.disabled=true);
if(o.ok){bs[k].classList.add('bo');bota('anA');if(S.pas<Q.passos.length-1){S.fets.push(o.h);S.pas++;setTimeout(pregunta,650);return}
anota(Q.g,true);S.ratxa++;S.millor=Math.max(S.millor,S.ratxa);setTimeout(()=>punt(0,null),650)}
else{bs[k].classList.add('mal');P.ops.forEach((x,j)=>{if(x.ok)bs[j].classList.add('bo')});bota('anB');anota(Q.g,false);S.ratxa=0;setTimeout(()=>punt(1,o),900)}}
function punt(qui,o){S.pt[qui]++;let joc=false;const[a,b]=S.pt;if((a>=4||b>=4)&&Math.abs(a-b)>=2){S.jocs[qui]++;S.pt=[0,0];joc=true;S.serveix=1-S.serveix}
const fi=S.jocs[0]===2||S.jocs[1]===2;const Q=S.q;const P=Q.passos[S.pas];const okH=P.ops.find(x=>x.ok).h;
const solH=`<ol class="passos">${Q.sol.map(s=>`<li>${s}</li>`).join('')}</ol>`;
const avis=joc?`<div class="joc">${qui===0?t('🎾 Joc per a tu!','🎾 ¡Juego para ti!'):t('Joc per a ','Juego para ')+BLOCS[S.b].rival}</div>`:'';
const seg=`<button class="gran" onclick="${fi?'final()':'nova()'}">${fi?t('Veure el resultat','Ver el resultado'):t('Següent punt','Siguiente punto')} →</button>`;
if(qui===0)pinta(`${marcador()}<div class="carta ull ok"><div class="etiq">${t('Punt per a tu','Punto para ti')}${S.ratxa>2?' · '+t('ratxa de ','racha de ')+S.ratxa+' 🔥':''}</div><h2>${pick([t('Bon colp!','¡Buen golpe!'),t('Directa!','¡Directa!'),t('Ace!','¡Ace!'),t('Imparable!','¡Imparable!')])}</h2>${avis}<div class="enun">${Q.enun}</div><details${Q.passos.length>1?' open':''}><summary>${t('Repassa la solució','Repasa la solución')}</summary>${solH}</details></div>${seg}`);
else pinta(`${marcador()}<div class="carta ull"><div class="etiq">👁 ${t('Ull de falcó','Ojo de halcón')}</div><h2>${t('Fora!','¡Fuera!')}</h2>${avis}<div class="enun">${Q.enun}</div>${Q.passos.length>1?`<p class="calc">${P.q.replace(/<table[\s\S]*?<\/table>/,'')}</p>`:''}<div class="error"><b>${t('Has triat:','Has elegido:')}</b> ${o.h}<br>${o.e}</div><p><b>${t('Correcte:','Correcto:')}</b> ${okH}</p><h3>${t('Solució pas a pas','Solución paso a paso')}</h3>${solH}</div>${seg}`)}
function final(){const B=BLOCS[S.b];const guanya=S.jocs[0]===2;if(guanya){const v=llig('alg-vict','{}');v[B.id]=(v[B.id]||0)+1;desa('alg-vict',v)}
const f=llig('alg-flojos','{}');const fl=B.gens.filter((g,i,a)=>a.indexOf(g)===i&&(f[g]||0)>=2);
pinta(`<div class="carta final ${guanya?'ok':''}"><div class="trofeu">${guanya?'🏆':'🎾'}</div><h2>${guanya?t('Has guanyat la ronda!','¡Has ganado la ronda!'):t('Esta vegada ha guanyat ','Esta vez ha ganado ')+B.rival}</h2><p class="res">${S.jocs[0]} – ${S.jocs[1]} · ${t('millor ratxa','mejor racha')}: ${S.millor}</p>
${fl.length?`<p>${t('Per a repassar:','Para repasar:')} <b>${fl.map(g=>NOMG[g]()).join(', ')}</b>. ${t('Eixirà més sovint en el pròxim partit.','Saldrá más a menudo en el próximo partido.')}</p>`:''}
<div class="dato"><b>${t('Saps qui era el teu rival?','¿Sabes quién era tu rival?')}</b><br>${B.fet()}</div></div>
<button class="gran" onclick="partit(${S.b})">${t('Revenja','Revancha')} 🎾</button>
<div class="fila"><button class="sec" onclick="teoria(${S.b},0,false)">📖 ${t('Teoria','Teoría')}</button>${S.b<BLOCS.length-1?`<button class="sec" onclick="obri(${S.b+1})">${t('Ronda següent','Ronda siguiente')} →</button>`:`<button class="sec" onclick="inici()">${t('Torneig','Torneo')}</button>`}</div>`)}
document.documentElement.lang=LANG==='va'?'ca-valencia':'es';inici();

</script>
</body>
</html>
