<!doctype html>
<html lang="ca-valencia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f6b3a">
<title>Funcions Open</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--verd:#2f6b3a;--pista:#2c5f9e;--groc:#d9f03a;--tinta:#1d2733;--paper:#fbfaf4;--bo:#1f8a4c;--mal:#c8412f;--suau:#5d6b7a;--argila:#c8643b}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--verd);color:var(--tinta);overflow-x:hidden;font-size:17px;line-height:1.45}
#fons{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#fons svg{height:100%;max-width:100%}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px}
.carta{background:var(--paper);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
h1{font-size:34px;line-height:1.05;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.5px}
h1 small{display:block;font-size:15px;font-weight:500;opacity:.92;letter-spacing:0;margin-top:6px}
h2{font-size:21px;margin-bottom:8px}
h3{font-size:17px;margin:14px 0 6px}
p{margin:7px 0}
ul.ll{margin:6px 0 6px 22px}
ul.ll li{margin:4px 0}
.cap{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-top:6px}
.idioma{background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:10px;padding:6px 12px;font-weight:700;font-size:16px}
button{font:inherit;cursor:pointer;border:0}
.bloc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border-radius:14px;padding:13px;box-shadow:0 4px 12px rgba(0,0,0,.2);color:var(--tinta)}
.bloc .ic{width:48px;height:48px;border-radius:50%;background:var(--groc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);font-family:Georgia,serif;font-style:italic}
.bloc b{display:block;font-size:17px}
.bloc span.sub{font-size:14px;color:var(--suau)}
.bloc .rec{margin-left:auto;font-size:22px;white-space:nowrap}
.gran{display:block;width:100%;background:var(--groc);color:var(--tinta);font-weight:800;font-size:18px;padding:14px;border-radius:14px;box-shadow:0 4px 0 #a9bd22}
.gran:active{transform:translateY(2px);box-shadow:0 2px 0 #a9bd22}
.sec{display:block;width:100%;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);font-weight:700;padding:11px;border-radius:14px}
.carta .sec{color:var(--tinta);border-color:#c9ccd1}
.fila{display:flex;gap:10px}
.fila>*{flex:1}
.marcador{display:grid;grid-template-columns:1fr auto auto;background:#101820;color:#fff;border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.marcador div{padding:7px 12px;font-weight:700}
.marcador .jocs{background:#26313d;text-align:center;min-width:40px}
.marcador .pts{background:var(--groc);color:#101820;text-align:center;min-width:64px}
.marcador .sep{grid-column:1/-1;height:1px;background:#2d3946;padding:0}
.barra{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:14px;gap:8px}
.barra button{background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px}
.enun{font-size:18px}
.fig{display:flex;justify-content:center;margin:10px 0 4px}
.fig svg{max-width:100%;height:auto;touch-action:manipulation}
.opcions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opcions.una{grid-template-columns:1fr}
.op{background:#fff;border:2px solid #d6d9de;border-radius:12px;padding:10px 6px;font-size:18px;font-weight:700;min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--tinta);text-align:center}
.op svg{max-width:100%;height:auto}
.op:active{background:#f3f6e0}
.op.bo{border-color:var(--bo);background:#e3f4ea}
.op.mal{border-color:var(--mal);background:#fbe6e2}
.f{font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;font-size:1.1em;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.ull{border-left:6px solid var(--mal)}
.ull.ok{border-left-color:var(--bo)}
.etiq{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mal)}
.ull.ok .etiq{color:var(--bo)}
.error{background:#fbe6e2;border-radius:10px;padding:10px;margin:8px 0}
.ull.ok .error{background:#e3f4ea}
.passos{counter-reset:p;list-style:none;margin:6px 0}
.passos li{counter-increment:p;position:relative;padding:6px 0 6px 34px;border-bottom:1px dashed #d8dbe0}
.passos li:last-child{border-bottom:0}
.passos li::before{content:counter(p);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--pista);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.exemple{background:#eef2e4;border-radius:12px;padding:10px 12px;margin:10px 0}
.exemple .etq,.clau .etq,.perque .etq{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--verd)}
.clau{background:#fff8d6;border:2px solid #e8d97a;border-radius:12px;padding:10px 12px;margin:10px 0}
.clau .etq{color:#8a6d00}
.perque{background:#e6eef8;border-radius:12px;padding:10px 12px;margin:10px 0}
.perque .etq{color:var(--pista)}
.taula{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px;text-align:center}
.taula td,.taula th{border:1px solid #d6d9de;padding:5px 3px}
.taula th{background:#eef2e4}
.punts{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.punts i{width:8px;height:8px;border-radius:50%;background:#c9ccd1}
.punts i.on{background:var(--pista)}
.res{text-align:center}
.res .gros{font-size:44px;font-weight:900;margin:6px 0}
.pilota{position:fixed;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4ff7a,#c8de1c 60%,#9fb20f);z-index:5;pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.anim-a{animation:anA .7s ease-in forwards}
.anim-b{animation:anB .7s ease-in forwards}
@keyframes anA{from{left:50%;top:85%;transform:scale(1)}50%{transform:scale(1.6)}to{left:62%;top:4%;transform:scale(.7)}}
@keyframes anB{from{left:45%;top:2%;transform:scale(.7)}50%{transform:scale(1.5)}to{left:30%;top:95%;transform:scale(1)}}
.aviso{text-align:center;color:#fff;font-weight:800;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.3);min-height:30px}
.lab{background:#f1f4ea;border-radius:12px;padding:10px;margin:10px 0}
.lab .eq{text-align:center;font-size:20px;font-weight:700;margin:4px 0;min-height:30px}
.lab .sl{display:grid;grid-template-columns:64px 1fr 56px;align-items:center;gap:8px;margin:6px 0}
.lab .sl b{font-family:Georgia,serif;font-style:italic;font-size:18px;text-align:center}
.lab .sl output{font-weight:800;text-align:center;font-variant-numeric:tabular-nums;background:#fff;border-radius:8px;padding:3px 0}
.lab input[type=range]{width:100%;accent-color:var(--pista);height:30px}
.lab .info{font-size:14px;color:var(--suau);text-align:center}
.pistab{background:#fff8d6;color:#6b5600;border:2px solid #e8d97a;border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;margin-top:10px}
.pistatxt{background:#fff8d6;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:15px}
.peu{color:#fff;font-size:13px;text-align:center;background:rgba(0,0,0,.35);border-radius:10px;padding:6px}
.ratxa{color:var(--groc);font-weight:800}
</style>
</head>
<body>
<div id="fons"><svg viewBox="0 0 200 420" preserveAspectRatio="xMidYMid meet"><rect x="20" y="20" width="160" height="380" fill="#2c5f9e"/><g fill="none" stroke="#f4f4ee" stroke-width="2"><rect x="20" y="20" width="160" height="380"/><line x1="40" y1="20" x2="40" y2="400"/><line x1="160" y1="20" x2="160" y2="400"/><line x1="40" y1="117" x2="160" y2="117"/><line x1="40" y1="303" x2="160" y2="303"/><line x1="100" y1="117" x2="100" y2="303"/></g><line x1="12" y1="210" x2="188" y2="210" stroke="#e9e9e0" stroke-width="3" stroke-dasharray="2 2"/></svg></div>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
let LANG='va';
try{const l=localStorage.getItem('fun-idioma');if(l==='es'||l==='va')LANG=l}catch(e){}
document.documentElement.lang=LANG==='va'?'ca-valencia':'es';
const t=(va,es)=>LANG==='va'?va:es;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const RZ=(a,b)=>{let v;do{v=R(a,b)}while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const M=s=>`<span class="f">${s}</span>`;
const nm=(x,d=2)=>{if(Math.abs(x)<1e-9)x=0;let s=(Math.round(Math.abs(x)*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return (x<0?'−':'')+s.replace('.',',')};
const pr=x=>x<0?'('+nm(x)+')':nm(x);
const pt=(x,y)=>'('+nm(x)+', '+nm(y)+')';
const INF='+∞',MINF='−∞';
const fq=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(Math.abs(n),d)||1;n/=g;d/=g;if(d===1)return nm(n);return (n<0?'−':'')+F(Math.abs(n),d)};
function terme(c,v,primer){if(c===0)return '';const s=c<0?'−':'+';const a=Math.abs(c);const cs=(a===1&&v)?'':nm(a);if(primer)return (c<0?'−':'')+cs+v;return ' '+s+' '+cs+v}
function poli(cs){let o='',pr=true;const n=cs.length-1;cs.forEach((c,i)=>{const g=n-i;const v=g===0?'':g===1?'x':'x<sup>'+g+'</sup>';const tt=terme(c,v,pr);if(tt){o+=tt;pr=false}});return o||'0'}
const mesn=(n)=>n===0?'':(n>0?' + '+nm(n):' − '+nm(-n));
const xm=a=>a===0?'x':(a>0?'(x − '+nm(a)+')':'(x + '+nm(-a)+')');
const op=(h,k,why)=>({h,k:String(k),why});

let UID=0;
function plot(o){
const W=o.w||340,H=o.h||300,pad=6;
const [x0,x1]=o.xr,[y0,y1]=o.yr;
const sx=v=>pad+(v-x0)/(x1-x0)*(W-2*pad);
const sy=v=>H-pad-(v-y0)/(y1-y0)*(H-2*pad);
const id='c'+(++UID);
const stx=o.stx||((x1-x0)>16?2:1),sty=o.sty||((y1-y0)>16?2:1);
let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="system-ui,sans-serif"><defs><clipPath id="${id}"><rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}"/></clipPath></defs><rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="#fff" rx="4"/>`;
if(!o.nogrid){s+='<g stroke="#e3e6ea" stroke-width="1">';
for(let x=Math.ceil(x0);x<=x1;x++)s+=`<line x1="${sx(x)}" y1="${pad}" x2="${sx(x)}" y2="${H-pad}"/>`;
for(let y=Math.ceil(y0);y<=y1;y++)s+=`<line x1="${pad}" y1="${sy(y)}" x2="${W-pad}" y2="${sy(y)}"/>`;
s+='</g>'}
const ax=y0<=0&&y1>=0?sy(0):H-pad,ay=x0<=0&&x1>=0?sx(0):pad;
s+=`<g stroke="#1d2733" stroke-width="1.6"><line x1="${pad}" y1="${ax}" x2="${W-pad}" y2="${ax}"/><line x1="${ay}" y1="${pad}" x2="${ay}" y2="${H-pad}"/></g>`;
if(!o.nonum){s+='<g font-size="11" fill="#5d6b7a">';
for(let x=Math.ceil(x0/stx)*stx;x<=x1;x+=stx){if(x===0||x===x0||x===x1)continue;s+=`<text x="${sx(x)}" y="${Math.min(ax+13,H-pad-2)}" text-anchor="middle">${nm(x)}</text>`}
for(let y=Math.ceil(y0/sty)*sty;y<=y1;y+=sty){if(y===0||y===y0||y===y1)continue;s+=`<text x="${ay-4}" y="${sy(y)+4}" text-anchor="end">${nm(y)}</text>`}
s+=`<text x="${ay-4}" y="${ax+13}" text-anchor="end">0</text></g>`}
if(o.lx)s+=`<text x="${W-pad-3}" y="${ax-5}" text-anchor="end" font-size="13" font-weight="700" fill="#1d2733">${o.lx}</text>`;
if(o.ly)s+=`<text x="${ay+5}" y="${pad+14}" font-size="13" font-weight="700" fill="#1d2733">${o.ly}</text>`;
s+=`<g clip-path="url(#${id})">`;
(o.vl||[]).forEach(v=>{const x=typeof v==='object'?v.x:v;s+=`<line x1="${sx(x)}" y1="${pad}" x2="${sx(x)}" y2="${H-pad}" stroke="${v.col||'#c8412f'}" stroke-width="1.6" stroke-dasharray="6 5"/>`});
(o.hl||[]).forEach(v=>{const y=typeof v==='object'?v.y:v;s+=`<line x1="${pad}" y1="${sy(y)}" x2="${W-pad}" y2="${sy(y)}" stroke="${v.col||'#c8412f'}" stroke-width="1.6" stroke-dasharray="6 5"/>`});
(o.areas||[]).forEach(a=>{s+=`<rect x="${sx(a.a)}" y="${pad}" width="${sx(a.b)-sx(a.a)}" height="${H-2*pad}" fill="${a.col}" opacity=".18"/>`});
(o.fns||[]).forEach(fn=>{
const N=500,a=fn.d?Math.max(fn.d[0],x0):x0,b=fn.d?Math.min(fn.d[1],x1):x1;let d='',on=false,py=null;
for(let i=0;i<=N;i++){const x=a+(b-a)*i/N;let y;try{y=fn.f(x)}catch(e){y=NaN}
if(!isFinite(y)||y<y0-(y1-y0)*3||y>y1+(y1-y0)*3||(py!==null&&Math.abs(y-py)>(y1-y0)*1.5)){on=false;py=isFinite(y)?y:null;if(!isFinite(y))py=null;continue}
d+=(on?'L':'M')+sx(x).toFixed(1)+' '+sy(y).toFixed(1);on=true;py=y}
s+=`<path d="${d}" fill="none" stroke="${fn.col||'#2c5f9e'}" stroke-width="${fn.w||3}" ${fn.dash?'stroke-dasharray="7 6"':''} stroke-linecap="round" stroke-linejoin="round"/>`});
(o.poly||[]).forEach(p=>{s+=`<polyline points="${p.pts.map(q=>sx(q[0]).toFixed(1)+','+sy(q[1]).toFixed(1)).join(' ')}" fill="none" stroke="${p.col||'#2c5f9e'}" stroke-width="${p.w||3}" stroke-linejoin="round" stroke-linecap="round" ${p.dash?'stroke-dasharray="7 6"':''}/>`});
(o.segs||[]).forEach(g=>{s+=`<line x1="${sx(g[0])}" y1="${sy(g[1])}" x2="${sx(g[2])}" y2="${sy(g[3])}" stroke="${g[4]||'#c8412f'}" stroke-width="2.5"/>`});
s+='</g>';
(o.pts||[]).forEach(p=>{const X=sx(p.x),Y=sy(p.y);if(p.ball)s+=`<circle cx="${X}" cy="${Y}" r="8" fill="#d9f03a" stroke="#6f7f08" stroke-width="2"/><path d="M${X-6},${Y-4} Q${X},${Y} ${X-6},${Y+4} M${X+6},${Y-4} Q${X},${Y} ${X+6},${Y+4}" fill="none" stroke="#fff" stroke-width="1.5"/>`;else s+=`<circle cx="${X}" cy="${Y}" r="${p.r||5}" fill="${p.open?'#fff':(p.col||'#c8412f')}" stroke="${p.col||'#c8412f'}" stroke-width="2.5"/>`;
if(p.l)s+=`<text x="${X+(p.dx||8)}" y="${Y+(p.dy||-8)}" font-size="13" font-weight="700" fill="${p.lc||'#1d2733'}" ${p.anchor?'text-anchor="'+p.anchor+'"':''}>${p.l}</text>`});
(o.txt||[]).forEach(q=>{s+=`<text x="${sx(q.x)}" y="${sy(q.y)}" font-size="${q.s||14}" font-weight="700" fill="${q.col||'#1d2733'}" text-anchor="${q.a||'middle'}">${q.t}</text>`});
return s+'</svg>'}

function lab(el,sp){
const P={};sp.params.forEach(p=>{P[p.id]=p.vals[p.i]});
el.innerHTML=`<div class="lab"><div class="fig g"></div><div class="eq"></div>${sp.params.map(p=>`<div class="sl"><b>${p.lbl||p.id}</b><input type="range" min="0" max="${p.vals.length-1}" step="1" value="${p.i}" data-id="${p.id}"><output>${(p.fmt||nm)(P[p.id])}</output></div>`).join('')}<div class="info"></div></div>`;
const g=el.querySelector('.g'),eq=el.querySelector('.eq'),inf=el.querySelector('.info');
const draw=()=>{const o=sp.graf(P);g.innerHTML=plot(o);eq.innerHTML=sp.eq(P);inf.innerHTML=sp.info?sp.info(P):''};
el.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{const p=sp.params.find(q=>q.id===inp.dataset.id);P[p.id]=p.vals[+inp.value];inp.nextElementSibling.textContent=(p.fmt||nm)(P[p.id]);draw()}));
draw();return P}

const BLOCS=[];
const S={};
function guardaRec(id){try{const r=JSON.parse(localStorage.getItem('fun-rec')||'{}');r[id]=(r[id]||0)+1;localStorage.setItem('fun-rec',JSON.stringify(r))}catch(e){}}
function llegeixRec(){try{return JSON.parse(localStorage.getItem('fun-rec')||'{}')}catch(e){return{}}}
function canviaIdioma(){LANG=LANG==='va'?'es':'va';try{localStorage.setItem('fun-idioma',LANG)}catch(e){}document.documentElement.lang=LANG==='va'?'ca-valencia':'es';inici()}
function amunt(){window.scrollTo(0,0)}

function inici(){
const rec=llegeixRec();
$('#app').innerHTML=`<div class="cap"><h1>Funcions Open<small>${t('Aprén funcions jugant un torneig de tenis. Cada torneig té un escalfament amb tota la teoria i exemples resolts. Després, partit contra la màquina.','Aprende funciones jugando un torneo de tenis. Cada torneo tiene un calentamiento con toda la teoría y ejemplos resueltos. Después, partido contra la máquina.')}</small></h1><button class="idioma" onclick="canviaIdioma()">${LANG==='va'?'es':'va'}</button></div>
${BLOCS.map((B,i)=>`<button class="bloc" onclick="obri(${i})"><span class="ic">${B.ic}</span><span><b>${B.nom()}</b><span class="sub">${B.sub()}</span></span><span class="rec">${rec[B.id]?'🏆'+(rec[B.id]>1?'×'+rec[B.id]:''):''}</span></button>`).join('')}
<button class="bloc" onclick="mestres()"><span class="ic" style="background:#f0c94a">★</span><span><b>${t('Torneig de mestres','Torneo de maestros')}</b><span class="sub">${t('Totes les funcions barrejades. Per a quan ja domines els altres.','Todas las funciones mezcladas. Para cuando ya domines los demás.')}</span></span><span class="rec">${rec.mestres?'🏆'+(rec.mestres>1?'×'+rec.mestres:''):''}</span></button>
<div class="peu">${t('Consell: fes els tornejos en orde. Cada partit es guanya a 2 jocs; cada joc, a 4 punts (15, 30, 40, joc). Si falles, l\'Ull de falcó t\'explica l\'error pas a pas.','Consejo: haz los torneos en orden. Cada partido se gana a 2 juegos; cada juego, a 4 puntos (15, 30, 40, juego). Si fallas, el Ojo de halcón te explica el error paso a paso.')}</div>`;amunt()}

function obri(i){const B=BLOCS[i];
$('#app').innerHTML=`<div class="barra"><button onclick="inici()">← ${t('Torneigs','Torneos')}</button><span></span></div>
<div class="carta"><h2>${B.nom()}</h2>${B.serveix()}</div>
<button class="gran" onclick="teoria(${i},0)">${t('Escalfament: la teoria','Calentamiento: la teoría')} (${B.teoria().length} ${t('pàgines','páginas')})</button>
<button class="sec" onclick="partit(${i})">${t('Directe al partit','Directo al partido')}</button>`;amunt()}

function teoria(i,p,enPartit){const B=BLOCS[i],T=B.teoria(),pg=T[p];
$('#app').innerHTML=`<div class="barra"><button onclick="${enPartit?'tornaPartit()':'obri('+i+')'}">← ${enPartit?t('Tornar al partit','Volver al partido'):B.nom()}</button><span>${p+1}/${T.length}</span></div>
<div class="carta"><h2>${pg.tit}</h2>${pg.html}<div id="labt"></div>${pg.post||''}
<div class="punts">${T.map((_,k)=>`<i class="${k===p?'on':''}"></i>`).join('')}</div></div>
<div class="fila">${p>0?`<button class="sec" onclick="teoria(${i},${p-1},${!!enPartit})">← ${t('Arrere','Atrás')}</button>`:''}${p<T.length-1?`<button class="gran" onclick="teoria(${i},${p+1},${!!enPartit})">${t('Avant','Adelante')} →</button>`:(enPartit?`<button class="gran" onclick="tornaPartit()">${t('Tornar al partit','Volver al partido')}</button>`:`<button class="gran" onclick="partit(${i})">${t('Al partit!','¡Al partido!')} 🎾</button>`)}</div>`;
if(pg.lab)lab($('#labt'),pg.lab);amunt()}

function mestres(){const gens=[];BLOCS.forEach(B=>B.gens.forEach(g=>gens.push(g)));comenca({id:'mestres',nom:()=>t('Torneig de mestres','Torneo de maestros'),gens,mestres:true},-1)}
function partit(i){comenca(BLOCS[i],i)}
function comenca(B,i){Object.assign(S,{B,i,pts:[0,0],jocs:[0,0],cua:[],encerts:0,total:0,ratxa:0,millor:0,fet:false});nova()}
function seguentGen(){if(!S.cua.length){S.cua=shuffle(S.B.gens.slice());if(S.ult&&S.cua[0]===S.ult&&S.cua.length>1)S.cua.push(S.cua.shift())}const g=S.cua.shift();S.ult=g;return g}
function nova(){S.Q=seguentGen()();S.resp=false;pregunta()}
const LB=['0','15','30','40'];
function marcador(){return `<div class="marcador"><div class="nom">${t('Tu','Tú')}</div><div class="jocs">${S.jocs[0]}</div><div class="pts">${LB[S.pts[0]]}</div><div class="sep"></div><div class="nom">${t('La màquina','La máquina')}</div><div class="jocs">${S.jocs[1]}</div><div class="pts">${LB[S.pts[1]]}</div></div>`}
function tornaPartit(){pregunta(true)}
function pregunta(){const Q=S.Q;
$('#app').innerHTML=`<div class="barra"><button onclick="${S.i>=0?'obri('+S.i+')':'inici()'}">← ${t('Eixir','Salir')}</button>${S.i>=0?`<button onclick="teoria(${S.i},0,true)">📖 ${t('Teoria','Teoría')}</button>`:''}<span>${S.ratxa>1?`<span class="ratxa">🔥 ${S.ratxa}</span>`:''}</span></div>${marcador()}
<div class="carta"><div class="enun">${Q.enun}</div>${Q.fig?`<div class="fig">${Q.fig}</div>`:''}<div id="zona"></div>${Q.pista?`<button class="pistab" onclick="this.outerHTML='<div class=pistatxt>💡 '+S.Q.pista.replace(/'/g,'&#39;')+'</div>'">💡 ${t('Pista','Pista')}</button>`:''}</div><div id="ullz"></div>`;
const z=$('#zona');
if(Q.tipus==='lab'){S.P=lab(z,Q.lab);const b=document.createElement('button');b.className='gran';b.style.marginTop='8px';b.textContent=t('Colpejar!','¡Golpear!')+' 🎾';b.onclick=()=>{if(S.resp)return;const ok=Q.check(S.P);z.querySelectorAll('input').forEach(x=>x.disabled=true);b.remove();resultat(ok,ok?null:(Q.mal?Q.mal(S.P):t('La teua corba no passa per totes les pilotes.','Tu curva no pasa por todas las pelotas.')))};z.appendChild(b)}
else{S.ops=shuffle(Q.ops.slice());z.innerHTML=`<div class="opcions ${Q.una?'una':''}">${S.ops.map((o,k)=>`<button class="op" onclick="respon(${k})">${o.h}</button>`).join('')}</div>`}amunt()}
function pilota(cl){const b=document.createElement('div');b.className='pilota '+cl;document.body.appendChild(b);setTimeout(()=>b.remove(),800)}
function respon(k){if(S.resp)return;const o=S.ops[k],ok=o.k===S.Q.ok;
document.querySelectorAll('.op').forEach((b,j)=>{b.disabled=true;if(S.ops[j].k===S.Q.ok)b.classList.add('bo');else if(j===k)b.classList.add('mal')});
resultat(ok,ok?null:o.why)}
function resultat(ok,why){S.resp=true;S.total++;const Q=S.Q;
if(ok){S.encerts++;S.ratxa++;S.millor=Math.max(S.millor,S.ratxa)}else S.ratxa=0;
pilota(ok?'anim-a':'anim-b');
const w=ok?0:1;S.pts[w]++;let msg;
if(S.pts[w]===4){S.jocs[w]++;S.pts=[0,0];msg=ok?t('Joc per a tu!','¡Juego para ti!'):t('Joc per a la màquina','Juego para la máquina')}else msg=ok?pick([t('Punt teu!','¡Punto tuyo!'),t('Winner!','¡Winner!'),t('Ace!','¡Ace!'),t('Bona bola!','¡Buena bola!')]):pick([t('Fora!','¡Fuera!'),t('A la xarxa!','¡A la red!'),t('Punt per a la màquina','Punto para la máquina')]);
const acaba=S.jocs[0]===2||S.jocs[1]===2;
$('#ullz').innerHTML=`<div class="aviso">${msg}</div><div class="carta ull ${ok?'ok':''}"><div class="etiq">👁 ${t('Ull de falcó','Ojo de halcón')}</div>${!ok&&why?`<div class="error">${why}</div>`:''}${ok?`<div class="error">${t('Correcte! Repassa com es fa:','¡Correcto! Repasa cómo se hace:')}</div>`:`<p><b>${t('Com es fa:','Cómo se hace:')}</b></p>`}<ol class="passos">${Q.passos.map(x=>`<li>${x}</li>`).join('')}</ol>${Q.fig2?`<div class="fig">${Q.fig2}</div>`:''}</div><button class="gran" onclick="${acaba?'final()':'nova()'}">${acaba?t('Vore el resultat','Ver el resultado'):t('Següent punt','Siguiente punto')} →</button>`;
document.querySelector('.marcador').outerHTML=marcador();
setTimeout(()=>{const u=$('#ullz');if(u)u.scrollIntoView({behavior:'smooth',block:'start'})},250)}
function final(){const g=S.jocs[0]===2;if(g)guardaRec(S.B.id);const pc=Math.round(100*S.encerts/S.total);
const cur=S.B.curiositat?S.B.curiositat():pick(BLOCS).curiositat();
$('#app').innerHTML=`<div class="carta res"><div style="font-size:60px">${g?'🏆':'🎾'}</div><h2>${g?t('Has guanyat el torneig!','¡Has ganado el torneo!'):t('Esta vegada ha guanyat la màquina','Esta vez ha ganado la máquina')}</h2><div class="gros">${S.jocs[0]} – ${S.jocs[1]}</div><p>${t('Encerts','Aciertos')}: <b>${S.encerts}/${S.total}</b> (${pc}%) · ${t('Millor ratxa','Mejor racha')}: <b>${S.millor}</b></p><p>${g?t('Domines este bloc. Prova el següent torneig o repeteix per a fer-ho sense errors.','Dominas este bloque. Prueba el siguiente torneo o repite para hacerlo sin errores.'):t('Repassa l\'escalfament (sobretot les pàgines on has fallat) i torna a jugar: les preguntes canvien cada vegada.','Repasa el calentamiento (sobre todo las páginas donde has fallado) y vuelve a jugar: las preguntas cambian cada vez.')}</p></div>
<div class="carta"><div class="etiq" style="color:var(--pista)">🤓 ${t('Sabies que...?','¿Sabías que...?')}</div><p>${cur}</p></div>
<button class="gran" onclick="${S.i>=0?'partit('+S.i+')':'mestres()'}">${t('Revenja','Revancha')} 🎾</button>
${S.i>=0?`<button class="sec" onclick="teoria(${S.i},0)">${t('Repassar la teoria','Repasar la teoría')}</button>`:''}
<button class="sec" onclick="inici()">${t('Tornar als torneigs','Volver a los torneos')}</button>`;amunt()}
function mkq(enun,ok,dist,passos,extra){const ops=[ok];const ks=new Set([ok.k]),hs=new Set([ok.h]);dist.forEach(d=>{if(d&&!ks.has(d.k)&&!hs.has(d.h)&&ops.length<4){ks.add(d.k);hs.add(d.h);ops.push(d)}});return Object.assign({tipus:'mc',enun,ops,ok:ok.k,passos},extra||{})}

BLOCS.push({id:'concepte',ic:'f(x)',
nom:()=>t('1. Què és una funció','1. Qué es una función'),
sub:()=>t('Taules, gràfiques, domini, recorregut i talls amb els eixos','Tablas, gráficas, dominio, recorrido y cortes con los ejes'),
serveix:()=>t(`<p><b>Què és?</b> Una funció és una regla que, a cada valor d'entrada, li assigna <b>un únic</b> valor d'eixida. És la manera matemàtica de dir «una cosa depén d'una altra».</p><p><b>Per a què serveix?</b> Tot el que canvia en la vida real es descriu amb funcions: l'altura de la pilota segons el temps, el preu segons les hores de pista, la velocitat del servei segons la força... Si saps llegir funcions, saps llegir gràfiques del temps, de la borsa, d'un pulsòmetre o de l'audiència d'un partit.</p>`,`<p><b>¿Qué es?</b> Una función es una regla que, a cada valor de entrada, le asigna <b>un único</b> valor de salida. Es la forma matemática de decir «una cosa depende de otra».</p><p><b>¿Para qué sirve?</b> Todo lo que cambia en la vida real se describe con funciones: la altura de la pelota según el tiempo, el precio según las horas de pista, la velocidad del saque según la fuerza... Si sabes leer funciones, sabes leer gráficas del tiempo, de la bolsa, de un pulsómetro o de la audiencia de un partido.</p>`),
curiositat:()=>t('La notació f(x) la va popularitzar Leonhard Euler cap a 1734. Abans, els matemàtics descrivien les funcions amb frases llarguíssimes.','La notación f(x) la popularizó Leonhard Euler hacia 1734. Antes, los matemáticos describían las funciones con frases larguísimas.'),
teoria:()=>[
{tit:t('Què és una funció','Qué es una función'),html:t(`<p>Una <b>funció</b> relaciona dues magnituds: la <b>variable independent</b> (<i>x</i>, la que tu tries) i la <b>variable dependent</b> (<i>y</i>, la que en resulta). La condició és que <b>a cada x li correspon un únic valor de y</b>.</p><p>S'escriu ${M('y = f(x)')} i es llig «<i>y</i> és funció de <i>x</i>». El valor ${M('f(3)')} és la <b>imatge</b> de 3: el que ix quan entra un 3. Al revés, si ${M('f(3)=7')}, diem que 3 és una <b>antiimatge</b> de 7.</p><div class="exemple"><div class="etq">Exemple resolt</div><p>Llogar una pista costa 6 € de llum més 4 € per hora. El preu <i>y</i> depén de les hores <i>x</i>:</p><p style="text-align:center">${M('f(x) = 4x + 6')}</p><table class="taula"><tr><th>x (hores)</th><td>0</td><td>1</td><td>2</td><td>3</td></tr><tr><th>y (€)</th><td>6</td><td>10</td><td>14</td><td>18</td></tr></table><p>Imatge de 2: ${M('f(2) = 4·2 + 6 = 14')} €.<br>Antiimatge de 22: ${M('4x + 6 = 22 → 4x = 16 → x = 4')} hores.</p></div><div class="clau"><div class="etq">Quatre maneres de donar una funció</div><ul class="ll"><li><b>Enunciat</b> (amb paraules)</li><li><b>Taula</b> de valors</li><li><b>Fórmula</b> o expressió algebraica</li><li><b>Gràfica</b>: els punts (x, y) dibuixats en uns eixos</li></ul></div>`,`<p>Una <b>función</b> relaciona dos magnitudes: la <b>variable independiente</b> (<i>x</i>, la que tú eliges) y la <b>variable dependiente</b> (<i>y</i>, la que resulta). La condición es que <b>a cada x le corresponde un único valor de y</b>.</p><p>Se escribe ${M('y = f(x)')} y se lee «<i>y</i> es función de <i>x</i>». El valor ${M('f(3)')} es la <b>imagen</b> de 3: lo que sale cuando entra un 3. Al revés, si ${M('f(3)=7')}, decimos que 3 es una <b>antiimagen</b> (o preimagen) de 7.</p><div class="exemple"><div class="etq">Ejemplo resuelto</div><p>Alquilar una pista cuesta 6 € de luz más 4 € por hora. El precio <i>y</i> depende de las horas <i>x</i>:</p><p style="text-align:center">${M('f(x) = 4x + 6')}</p><table class="taula"><tr><th>x (horas)</th><td>0</td><td>1</td><td>2</td><td>3</td></tr><tr><th>y (€)</th><td>6</td><td>10</td><td>14</td><td>18</td></tr></table><p>Imagen de 2: ${M('f(2) = 4·2 + 6 = 14')} €.<br>Antiimagen de 22: ${M('4x + 6 = 22 → 4x = 16 → x = 4')} horas.</p></div><div class="clau"><div class="etq">Cuatro formas de dar una función</div><ul class="ll"><li><b>Enunciado</b> (con palabras)</li><li><b>Tabla</b> de valores</li><li><b>Fórmula</b> o expresión algebraica</li><li><b>Gráfica</b>: los puntos (x, y) dibujados en unos ejes</li></ul></div>`)},
{tit:t('Calcular imatges sense errors','Calcular imágenes sin errores'),html:t(`<p>Per a calcular ${M('f(a)')}, substitueix <b>cada</b> <i>x</i> per <b>(a)</b>, amb parèntesis, i opera respectant la jerarquia: parèntesis, potències, multiplicacions, sumes.</p><div class="exemple"><div class="etq">Exemple resolt</div><p>${M('f(x) = x<sup>2</sup> − 3x + 2')}. Calcula ${M('f(−2)')}.</p><ol class="passos"><li>${M('f(−2) = (−2)<sup>2</sup> − 3·(−2) + 2')}</li><li>${M('(−2)<sup>2</sup> = 4')} (un nombre negatiu al quadrat és positiu)</li><li>${M('−3·(−2) = +6')} (menys per menys, més)</li><li>${M('4 + 6 + 2 = 12')}</li></ol></div><div class="perque"><div class="etq">Ull! Errors típics</div><ul class="ll"><li>Escriure ${M('−2<sup>2</sup>')} sense parèntesis: val −4, no 4.</li><li>Oblidar el signe en ${M('−3·(−2)')}.</li></ul></div>`,`<p>Para calcular ${M('f(a)')}, sustituye <b>cada</b> <i>x</i> por <b>(a)</b>, con paréntesis, y opera respetando la jerarquía: paréntesis, potencias, multiplicaciones, sumas.</p><div class="exemple"><div class="etq">Ejemplo resuelto</div><p>${M('f(x) = x<sup>2</sup> − 3x + 2')}. Calcula ${M('f(−2)')}.</p><ol class="passos"><li>${M('f(−2) = (−2)<sup>2</sup> − 3·(−2) + 2')}</li><li>${M('(−2)<sup>2</sup> = 4')} (un número negativo al cuadrado es positivo)</li><li>${M('−3·(−2) = +6')} (menos por menos, más)</li><li>${M('4 + 6 + 2 = 12')}</li></ol></div><div class="perque"><div class="etq">¡Ojo! Errores típicos</div><ul class="ll"><li>Escribir ${M('−2<sup>2</sup>')} sin paréntesis: vale −4, no 4.</li><li>Olvidar el signo en ${M('−3·(−2)')}.</li></ul></div>`)},
{tit:t('És o no és una funció?','¿Es o no es una función?'),html:t(`<p>En una gràfica, la regla «a cada <i>x</i>, una sola <i>y</i>» es comprova amb la <b>prova de la recta vertical</b>: imagina rectes verticals que recorren el dibuix. Si alguna talla la gràfica en <b>dos o més punts</b>, <b>no</b> és funció (eixa <i>x</i> tindria dues imatges).</p><div class="fila"><div class="fig">${plot({xr:[-4,4],yr:[-2,6],w:160,h:150,nonum:1,fns:[{f:x=>x*x/2,col:'#1f8a4c'}],vl:[{x:1.5,col:'#5d6b7a'}],pts:[{x:1.5,y:1.125,col:'#1f8a4c'}]})}</div><div class="fig">${plot({xr:[-4,4],yr:[-4,4],w:160,h:150,nonum:1,poly:[{pts:Array.from({length:61},(_,i)=>[3*Math.cos(i*Math.PI/30),3*Math.sin(i*Math.PI/30)]),col:'#c8412f'}],vl:[{x:1.5,col:'#5d6b7a'}],pts:[{x:1.5,y:2.598},{x:1.5,y:-2.598}]})}</div></div><p style="text-align:center;font-size:14px">${t('Paràbola: sí és funció ✔ · Circumferència: no ho és ✘','')}</p><div class="perque"><div class="etq">Per què importa?</div><p>Si una màquina de llançar pilotes, amb la mateixa velocitat, poguera traure dos resultats diferents, no podríem predir res. Les funcions són predictibles: mateixa entrada, mateixa eixida.</p></div>`,`<p>En una gráfica, la regla «a cada <i>x</i>, una sola <i>y</i>» se comprueba con la <b>prueba de la recta vertical</b>: imagina rectas verticales que recorren el dibujo. Si alguna corta la gráfica en <b>dos o más puntos</b>, <b>no</b> es función (esa <i>x</i> tendría dos imágenes).</p><div class="fila"><div class="fig">${plot({xr:[-4,4],yr:[-2,6],w:160,h:150,nonum:1,fns:[{f:x=>x*x/2,col:'#1f8a4c'}],vl:[{x:1.5,col:'#5d6b7a'}],pts:[{x:1.5,y:1.125,col:'#1f8a4c'}]})}</div><div class="fig">${plot({xr:[-4,4],yr:[-4,4],w:160,h:150,nonum:1,poly:[{pts:Array.from({length:61},(_,i)=>[3*Math.cos(i*Math.PI/30),3*Math.sin(i*Math.PI/30)]),col:'#c8412f'}],vl:[{x:1.5,col:'#5d6b7a'}],pts:[{x:1.5,y:2.598},{x:1.5,y:-2.598}]})}</div></div><p style="text-align:center;font-size:14px">Parábola: sí es función ✔ · Circunferencia: no lo es ✘</p><div class="perque"><div class="etq">¿Por qué importa?</div><p>Si una máquina lanzapelotas, con la misma velocidad, pudiera dar dos resultados distintos, no podríamos predecir nada. Las funciones son predecibles: misma entrada, misma salida.</p></div>`)},
{tit:t('Domini i recorregut','Dominio y recorrido'),html:t(`<p>El <b>domini</b> ${M('Dom f')} és el conjunt de valors de <i>x</i> que <b>es poden</b> usar (els que tenen imatge). El <b>recorregut</b> o imatge ${M('Im f')} és el conjunt de valors de <i>y</i> que <b>realment</b> ixen.</p><div class="clau"><div class="etq">Com es troba el domini amb la fórmula</div><ul class="ll"><li><b>Polinomis</b> (${M('2x + 1')}, ${M('x<sup>2</sup> − 5')}...): ${M('Dom = ℝ')}, qualsevol nombre.</li><li><b>Fraccions</b>: el denominador <b>no</b> pot valdre 0. ${M('f(x) = '+F('3','x − 2'))} → ${M('x ≠ 2')} → ${M('Dom = ℝ − {2}')}.</li><li><b>Arrels quadrades</b>: el que hi ha dins ha de ser <b>≥ 0</b>. ${M('g(x) = √(x + 4)')} → ${M('x + 4 ≥ 0 → x ≥ −4')} → ${M('Dom = [−4, +∞)')}.</li><li><b>Context</b>: si <i>x</i> és un temps o una quantitat de pilotes, no pot ser negatiu.</li></ul></div><div class="perque"><div class="etq">Recorda els intervals</div><p>${M('[a, b]')}: inclou els extrems (punt ple ●). ${M('(a, b)')}: no els inclou (punt buit ○). Amb ${M('∞')} sempre parèntesi. Exemple: ${M('x ≥ −4')} és ${M('[−4, +∞)')}; ${M('x < 3')} és ${M('(−∞, 3)')}.</p></div><div class="exemple"><div class="etq">Exemple resolt (recorregut amb la gràfica)</div><p>${M('f(x) = (x − 1)<sup>2</sup> − 2')}: és una paràbola oberta cap amunt amb el punt més baix en ${M('(1, −2)')}. Les <i>y</i> que ixen són −2 i totes les de damunt: ${M('Im f = [−2, +∞)')}. El domini és ${M('ℝ')}.</p><div class="fig">${plot({xr:[-3,5],yr:[-3,6],w:260,h:200,fns:[{f:x=>(x-1)**2-2}],pts:[{x:1,y:-2,l:'(1, −2)'}],hl:[{y:-2,col:'#1f8a4c'}]})}</div></div>`,`<p>El <b>dominio</b> ${M('Dom f')} es el conjunto de valores de <i>x</i> que <b>se pueden</b> usar (los que tienen imagen). El <b>recorrido</b> o imagen ${M('Im f')} es el conjunto de valores de <i>y</i> que <b>realmente</b> salen.</p><div class="clau"><div class="etq">Cómo se halla el dominio con la fórmula</div><ul class="ll"><li><b>Polinomios</b> (${M('2x + 1')}, ${M('x<sup>2</sup> − 5')}...): ${M('Dom = ℝ')}, cualquier número.</li><li><b>Fracciones</b>: el denominador <b>no</b> puede valer 0. ${M('f(x) = '+F('3','x − 2'))} → ${M('x ≠ 2')} → ${M('Dom = ℝ − {2}')}.</li><li><b>Raíces cuadradas</b>: lo de dentro debe ser <b>≥ 0</b>. ${M('g(x) = √(x + 4)')} → ${M('x + 4 ≥ 0 → x ≥ −4')} → ${M('Dom = [−4, +∞)')}.</li><li><b>Contexto</b>: si <i>x</i> es un tiempo o una cantidad de pelotas, no puede ser negativo.</li></ul></div><div class="perque"><div class="etq">Recuerda los intervalos</div><p>${M('[a, b]')}: incluye los extremos (punto lleno ●). ${M('(a, b)')}: no los incluye (punto hueco ○). Con ${M('∞')} siempre paréntesis. Ejemplo: ${M('x ≥ −4')} es ${M('[−4, +∞)')}; ${M('x < 3')} es ${M('(−∞, 3)')}.</p></div><div class="exemple"><div class="etq">Ejemplo resuelto (recorrido con la gráfica)</div><p>${M('f(x) = (x − 1)<sup>2</sup> − 2')}: es una parábola abierta hacia arriba con el punto más bajo en ${M('(1, −2)')}. Las <i>y</i> que salen son −2 y todas las de encima: ${M('Im f = [−2, +∞)')}. El dominio es ${M('ℝ')}.</p><div class="fig">${plot({xr:[-3,5],yr:[-3,6],w:260,h:200,fns:[{f:x=>(x-1)**2-2}],pts:[{x:1,y:-2,l:'(1, −2)'}],hl:[{y:-2,col:'#1f8a4c'}]})}</div></div>`)},
{tit:t('Punts de tall amb els eixos','Puntos de corte con los ejes'),html:t(`<div class="clau"><div class="etq">La regla</div><ul class="ll"><li><b>Tall amb l'eix Y</b>: fes ${M('x = 0')} i calcula ${M('f(0)')}. Punt ${M('(0, f(0))')}. Com a molt n'hi ha un.</li><li><b>Talls amb l'eix X</b> (zeros o arrels): fes ${M('f(x) = 0')} i resol l'equació. Punts ${M('(x, 0)')}. Pot haver-n'hi cap, un o diversos.</li></ul></div><div class="exemple"><div class="etq">Exemple resolt</div><p>${M('f(x) = x<sup>2</sup> − 4x + 3')}</p><ol class="passos"><li>Eix Y: ${M('f(0) = 0 − 0 + 3 = 3')} → ${M('(0, 3)')}</li><li>Eix X: ${M('x<sup>2</sup> − 4x + 3 = 0')} → ${M('x = '+F('4 ± √(16 − 12)','2')+' = '+F('4 ± 2','2'))}</li><li>${M('x = 3')} i ${M('x = 1')} → punts ${M('(1, 0)')} i ${M('(3, 0)')}</li></ol><div class="fig">${plot({xr:[-1,5],yr:[-2,5],w:240,h:190,fns:[{f:x=>x*x-4*x+3}],pts:[{x:0,y:3,l:'(0, 3)'},{x:1,y:0,l:'(1, 0)',dy:16,dx:-30},{x:3,y:0,l:'(3, 0)',dy:16}]})}</div></div><div class="perque"><div class="etq">Per a què?</div><p>El tall amb l'eix Y sol ser el <b>valor inicial</b> (en ${M('x = 0')}): els 6 € fixos de la pista. Els talls amb l'eix X diuen <b>quan</b> una cosa val zero: quan la pilota toca a terra.</p></div>`,`<div class="clau"><div class="etq">La regla</div><ul class="ll"><li><b>Corte con el eje Y</b>: haz ${M('x = 0')} y calcula ${M('f(0)')}. Punto ${M('(0, f(0))')}. Como mucho hay uno.</li><li><b>Cortes con el eje X</b> (ceros o raíces): haz ${M('f(x) = 0')} y resuelve la ecuación. Puntos ${M('(x, 0)')}. Puede haber ninguno, uno o varios.</li></ul></div><div class="exemple"><div class="etq">Ejemplo resuelto</div><p>${M('f(x) = x<sup>2</sup> − 4x + 3')}</p><ol class="passos"><li>Eje Y: ${M('f(0) = 0 − 0 + 3 = 3')} → ${M('(0, 3)')}</li><li>Eje X: ${M('x<sup>2</sup> − 4x + 3 = 0')} → ${M('x = '+F('4 ± √(16 − 12)','2')+' = '+F('4 ± 2','2'))}</li><li>${M('x = 3')} y ${M('x = 1')} → puntos ${M('(1, 0)')} y ${M('(3, 0)')}</li></ol><div class="fig">${plot({xr:[-1,5],yr:[-2,5],w:240,h:190,fns:[{f:x=>x*x-4*x+3}],pts:[{x:0,y:3,l:'(0, 3)'},{x:1,y:0,l:'(1, 0)',dy:16,dx:-30},{x:3,y:0,l:'(3, 0)',dy:16}]})}</div></div><div class="perque"><div class="etq">¿Para qué?</div><p>El corte con el eje Y suele ser el <b>valor inicial</b> (en ${M('x = 0')}): los 6 € fijos de la pista. Los cortes con el eje X dicen <b>cuándo</b> algo vale cero: cuando la pelota toca el suelo.</p></div>`)}

{tit:t('Proporcionalitat directa: y = mx','Proporcionalidad directa: y = mx'),html:t(`<p>Si un bot de pilotes costa 3 €, 2 bots costen 6 €, 5 bots 15 €... El preu és <b>directament proporcional</b>: ${M('y = 3x')}.</p><p>Una funció ${M('y = mx')} s'anomena <b>lineal</b> o de proporcionalitat directa. La seua gràfica és una recta que <b>passa per l'origen</b> ${M('(0, 0)')}.</p><p>El número ${M('m')} és el <b>pendent</b>: el que puja (o baixa) <i>y</i> quan <i>x</i> augmenta 1. També és la constant de proporcionalitat: ${M('m = y / x')}.</p><div class="clau"><div class="etq">El signe del pendent</div><ul class="ll"><li>${M('m > 0')}: recta <b>creixent</b> (puja d'esquerra a dreta).</li><li>${M('m < 0')}: recta <b>decreixent</b> (baixa).</li><li>Com més gran és ${M('|m|')}, més <b>dreta</b> (inclinada) és la recta.</li></ul></div><div class="fig">${plot({xr:[-4,4],yr:[-4,4],w:240,h:220,fns:[{f:x=>3*x,col:'#c8412f'},{f:x=>x/2},{f:x=>-x,col:'#1f8a4c'}],txt:[{x:1.6,y:3.6,t:'y = 3x',col:'#c8412f'},{x:3,y:2.1,t:'y = 0,5x',col:'#2c5f9e'},{x:-2.6,y:3.4,t:'y = −x',col:'#1f8a4c'}]})}</div>`,`<p>Si un bote de pelotas cuesta 3 €, 2 botes cuestan 6 €, 5 botes 15 €... El precio es <b>directamente proporcional</b>: ${M('y = 3x')}.</p><p>Una función ${M('y = mx')} se llama <b>lineal</b> o de proporcionalidad directa. Su gráfica es una recta que <b>pasa por el origen</b> ${M('(0, 0)')}.</p><p>El número ${M('m')} es la <b>pendiente</b>: lo que sube (o baja) <i>y</i> cuando <i>x</i> aumenta 1. También es la constante de proporcionalidad: ${M('m = y / x')}.</p><div class="clau"><div class="etq">El signo de la pendiente</div><ul class="ll"><li>${M('m > 0')}: recta <b>creciente</b> (sube de izquierda a derecha).</li><li>${M('m < 0')}: recta <b>decreciente</b> (baja).</li><li>Cuanto mayor es ${M('|m|')}, más <b>empinada</b> es la recta.</li></ul></div><div class="fig">${plot({xr:[-4,4],yr:[-4,4],w:240,h:220,fns:[{f:x=>3*x,col:'#c8412f'},{f:x=>x/2},{f:x=>-x,col:'#1f8a4c'}],txt:[{x:1.6,y:3.6,t:'y = 3x',col:'#c8412f'},{x:3,y:2.1,t:'y = 0,5x',col:'#2c5f9e'},{x:-2.6,y:3.4,t:'y = −x',col:'#1f8a4c'}]})}</div>`)},
{tit:t('Funció afí: y = mx + n','Función afín: y = mx + n'),html:t(`<p>Si a més hi ha una part fixa, tenim una <b>funció afí</b>: ${M('y = mx + n')}. Exemple: el club cobra 20 € de matrícula i 5 € per classe: ${M('y = 5x + 20')}.</p><ul class="ll"><li>${M('m')} = <b>pendent</b> (5 € més per cada classe).</li><li>${M('n')} = <b>ordenada en l'origen</b>: on la recta talla l'eix Y, el punt ${M('(0, n)')} (els 20 € inicials).</li><li>Si ${M('m = 0')}: ${M('y = n')}, recta <b>horitzontal</b> (funció constant).</li></ul><div class="exemple"><div class="etq">Com dibuixar-la sense taula</div><ol class="passos"><li>Marca ${M('(0, n)')} en l'eix Y.</li><li>Des d'eixe punt avança 1 a la dreta i puja ${M('m')} (o baixa si és negatiu).</li><li>Si ${M('m')} és una fracció ${M('a/b')}: avança ${M('b')} i puja ${M('a')}.</li><li>Uneix els punts amb una recta.</li></ol></div><p>Prova-ho: mou els controls i mira què fa cada número.</p>`,`<p>Si además hay una parte fija, tenemos una <b>función afín</b>: ${M('y = mx + n')}. Ejemplo: el club cobra 20 € de matrícula y 5 € por clase: ${M('y = 5x + 20')}.</p><ul class="ll"><li>${M('m')} = <b>pendiente</b> (5 € más por cada clase).</li><li>${M('n')} = <b>ordenada en el origen</b>: donde la recta corta el eje Y, el punto ${M('(0, n)')} (los 20 € iniciales).</li><li>Si ${M('m = 0')}: ${M('y = n')}, recta <b>horizontal</b> (función constante).</li></ul><div class="exemple"><div class="etq">Cómo dibujarla sin tabla</div><ol class="passos"><li>Marca ${M('(0, n)')} en el eje Y.</li><li>Desde ese punto avanza 1 a la derecha y sube ${M('m')} (o baja si es negativa).</li><li>Si ${M('m')} es una fracción ${M('a/b')}: avanza ${M('b')} y sube ${M('a')}.</li><li>Une los puntos con una recta.</li></ol></div><p>Pruébalo: mueve los controles y mira qué hace cada número.</p>`),

{tit:t('La recta que passa per dos punts','La recta que pasa por dos puntos'),html:t(`<p>Per dos punts passa una única recta. Per a trobar-la:</p><div class="clau"><div class="etq">Fórmula del pendent</div><p style="text-align:center">${M('m = '+F('y<sub>2</sub> − y<sub>1</sub>','x<sub>2</sub> − x<sub>1</sub>'))} = ${F(t('el que puja','lo que sube'),t('el que avança','lo que avanza'))}</p></div><div class="exemple"><div class="etq">Exemple resolt: per ${M('A(1, 3)')} i ${M('B(3, 7)')}</div><ol class="passos"><li>${M('m = '+F('7 − 3','3 − 1')+' = '+F('4','2')+' = 2')}</li><li>Equació punt-pendent: ${M('y − y<sub>1</sub> = m(x − x<sub>1</sub>)')} → ${M('y − 3 = 2(x − 1)')}</li><li>${M('y = 2x − 2 + 3')} → ${M('y = 2x + 1')}</li><li>Comprovació amb B: ${M('2·3 + 1 = 7')} ✔</li></ol></div><div class="perque"><div class="etq">Errors típics</div><ul class="ll"><li>Restar en orde diferent dalt i baix (${M('7 − 3')} però ${M('1 − 3')}): el signe ix malament.</li><li>Posar les x dalt i les y baix: és al revés, <b>y dalt</b>.</li></ul></div><div class="clau"><div class="etq">Rectes paral·leles i talls</div><p>Dues rectes són <b>paral·leles</b> si tenen el <b>mateix pendent</b>. La recta talla l'eix X on ${M('mx + n = 0')}, és a dir, en ${M('x = −n/m')}.</p></div>`,`<p>Por dos puntos pasa una única recta. Para hallarla:</p><div class="clau"><div class="etq">Fórmula de la pendiente</div><p style="text-align:center">${M('m = '+F('y<sub>2</sub> − y<sub>1</sub>','x<sub>2</sub> − x<sub>1</sub>'))} = ${F('lo que sube','lo que avanza')}</p></div><div class="exemple"><div class="etq">Ejemplo resuelto: por ${M('A(1, 3)')} y ${M('B(3, 7)')}</div><ol class="passos"><li>${M('m = '+F('7 − 3','3 − 1')+' = '+F('4','2')+' = 2')}</li><li>Ecuación punto-pendiente: ${M('y − y<sub>1</sub> = m(x − x<sub>1</sub>)')} → ${M('y − 3 = 2(x − 1)')}</li><li>${M('y = 2x − 2 + 3')} → ${M('y = 2x + 1')}</li><li>Comprobación con B: ${M('2·3 + 1 = 7')} ✔</li></ol></div><div class="perque"><div class="etq">Errores típicos</div><ul class="ll"><li>Restar en distinto orden arriba y abajo (${M('7 − 3')} pero ${M('1 − 3')}): el signo sale mal.</li><li>Poner las x arriba y las y abajo: es al revés, <b>y arriba</b>.</li></ul></div><div class="clau"><div class="etq">Rectas paralelas y cortes</div><p>Dos rectas son <b>paralelas</b> si tienen la <b>misma pendiente</b>. La recta corta el eje X donde ${M('mx + n = 0')}, es decir, en ${M('x = −n/m')}.</p></div>`)},

{tit:t('Créixer multiplicant: y = aˣ','Crecer multiplicando: y = aˣ'),html:t(`<p>Un vídeo d'un punt increïble té 1 000 visites i cada dia es <b>dupliquen</b>. Compara amb un altre que suma 1 000 visites cada dia:</p><table class="taula"><tr><th>dia</th><td>0</td><td>1</td><td>2</td><td>3</td><td>5</td><td>10</td></tr><tr><th>+1000</th><td>1000</td><td>2000</td><td>3000</td><td>4000</td><td>6000</td><td>11000</td></tr><tr><th>×2</th><td>1000</td><td>2000</td><td>4000</td><td>8000</td><td>32000</td><td>1024000</td></tr></table><p>El segon segueix ${M('y = 1000 · 2<sup>x</sup>')}: és <b>exponencial</b>. Al principi semblen iguals, però l'exponencial acaba guanyant sempre.</p><div class="clau"><div class="etq">Funció exponencial y = aˣ (a > 0, a ≠ 1)</div><ul class="ll"><li>${M('a > 1')}: <b>creixent</b>. ${M('0 < a < 1')}: <b>decreixent</b>.</li><li>Sempre passa per ${M('(0, 1)')} (perquè ${M('a<sup>0</sup> = 1')}) i per ${M('(1, a)')}.</li><li>${M('Dom = ℝ')}, ${M('Im = (0, +∞)')}: sempre és positiva.</li><li>Asímptota horitzontal ${M('y = 0')}.</li></ul></div><div class="fig">${plot({xr:[-4,4],yr:[-1,8],w:260,h:220,fns:[{f:x=>2**x},{f:x=>0.5**x,col:'#c8412f'}],pts:[{x:0,y:1,l:'(0, 1)',dx:6,dy:16}],txt:[{x:2.6,y:7.3,t:'y = 2ˣ',col:'#2c5f9e'},{x:-2.4,y:7.3,t:'y = (1/2)ˣ',col:'#c8412f'}]})}</div><div class="perque"><div class="etq">Recorda les potències</div><p>${M('a<sup>0</sup> = 1')}, ${M('a<sup>−n</sup> = 1/a<sup>n</sup>')}. Per exemple ${M('2<sup>−3</sup> = 1/8')}.</p></div>`,`<p>Un vídeo de un punto increíble tiene 1 000 visitas y cada día se <b>duplican</b>. Compara con otro que suma 1 000 visitas cada día:</p><table class="taula"><tr><th>día</th><td>0</td><td>1</td><td>2</td><td>3</td><td>5</td><td>10</td></tr><tr><th>+1000</th><td>1000</td><td>2000</td><td>3000</td><td>4000</td><td>6000</td><td>11000</td></tr><tr><th>×2</th><td>1000</td><td>2000</td><td>4000</td><td>8000</td><td>32000</td><td>1024000</td></tr></table><p>El segundo sigue ${M('y = 1000 · 2<sup>x< {tit:t('Créixer i decréixer en %','Crecer y decrecer en %'),html:t(`<div class="clau"><div class="etq">La fórmula estrella</div><p style="text-align:center">${M('y = C · (1 ± r)<sup>t</sup>')}</p><p>${M('C')} = quantitat inicial · ${M('r')} = percentatge en decimal · ${M('t')} = nombre de períodes. Puja: ${M('1 + r')}; baixa: ${M('1 − r')}.</p></div><div class="exemple"><div class="etq">Exemple resolt: decreixement</div><p>Una raqueta costa 200 € i cada any perd el 20 % del seu valor. Quant valdrà d'ací a 2 anys?</p><ol class="passos"><li>Perdre el 20 % és quedar-se amb el 80 %: multiplicar per ${M('0,8')}.</li><li>${M('y = 200 · 0,8<sup>t</sup>')}</li><li>${M('y(2) = 200 · 0,64 = 128')} €</li></ol><p><b>Ull!</b> No són ${M('200 − 40 − 40 = 120')}: el segon any el 20 % es calcula sobre 160, no sobre 200.</p></div><div class="exemple"><div class="etq">Exemple resolt: creixement</div><p>Deixes 1 000 € al 5 % anual (interés compost). Quant tens en 3 anys?</p><ol class="passos"><li>Multiplicador ${M('1 + 0,05 = 1,05')}</li><li>${M('1000 · 1,05<sup>3</sup> = 1000 · 1,157625 ≈ 1157,63')} €</li></ol></div>`,`<div class="clau"><div class="etq">La fórmula estrella</div><p style="text-align:center">${M('y = C · (1 ± r)<sup>t</sup>')}</p><p>${M('C')} = cantidad inicial · ${M('r')} = porcentaje en decimal · ${M('t')} = número de periodos. Sube: ${M('1 + r')}; baja: ${M('1 − r')}.</p></div><div class="exemple"><div class="etq">Ejemplo resuelto: decrecimiento</div><p>Una raqueta cuesta 200 € y cada año pierde el 20 % de su valor. ¿Cuánto valdrá dentro de 2 años?</p><ol class="passos"><li>Perder el 20 % es quedarse con el 80 %: multiplicar por ${M('0,8')}.</li><li>${M('y = 200 · 0,8<sup>t</sup>')}</li><li>${M('y(2) = 200 · 0,64 = 128')} €</li></ol><p><b>¡Ojo!</b> No son ${M('200 − 40 − 40 = 120')}: el segundo año el 20 % se calcula sobre 160, no sobre 200.</p></div><div class="exemple"><div class="etq">Ejemplo resuelto: crecimiento</div><p>Dejas 1 000 € al 5 % anual (interés compuesto). ¿Cuánto tienes en 3 años?</p><ol class="passos"><li>Multiplicador ${M('1 + 0,05 = 1,05')}</li><li>${M('1000 · 1,05<sup>3</sup> = 1000 · 1,157625 ≈ 1157,63')} €</li></ol></div>`)},
{tit:t('Logaritmes','Logaritmos'),html:t(`<p>Pregunta: ${M('2<sup>?</sup> = 8')}. Resposta: 3. Eixe «?» és el <b>logaritme</b>:</p><div class="clau"><div class="etq">Definició</div><p style="text-align:center">${M('log<sub>a</sub> x = y  ⇔  a<sup>y</sup> = x')}</p><p>«El logaritme en base a de x és l'exponent al qual cal elevar a per a obtindre x.» (${M('a > 0')}, ${M('a ≠ 1')}, ${M('x > 0')})</p></div><div class="exemple"><div class="etq">Exemples resolts</div><ul class="ll"><li>${M('log<sub>2</sub> 8 = 3')} perquè ${M('2<sup>3</sup> = 8')}</li><li>${M('log<sub>10</sub> 1000 = 3')} (${M('log')} sense base vol dir base 10)</li><li>${M('log<sub>3</sub> '+F(1,9)+' = −2')} perquè ${M('3<sup>−2</sup> = 1/9')}</li><li>${M('log<sub>5</sub> 1 = 0')} (sempre: ${M('a<sup>0</sup> = 1')}) i ${M('log<sub>5</sub> 5 = 1')}</li></ul></div><div class="perque"><div class="etq">Propietats útils</div><ul class="ll"><li>${M('log(A·B) = log A + log B')}</li><li>${M('log(A/B) = log A − log B')}</li><li>${M('log(A<sup>n</sup>) = n · log A')}</li></ul><p>Amb l'última es resolen equacions com ${M('2<sup>x</sup> = 50')}: ${M('x = log 50 / log 2 ≈ 5,64')}.</p></div>`,`<p>Pregunta: ${M('2<sup>?</sup> = 8')}. Respuesta: 3. Ese «?» es el <b>logaritmo</b>:</p><div class="clau"><div class="etq">Definición</div><p style="text-align:center">${M('log<sub>a</sub> x = y  ⇔  a<sup>y</sup> = x')}</p><p>«El logaritmo en base a de x es el exponente al que hay que elevar a para obtener x.» (${M('a > 0')}, ${M('a ≠ 1')}, ${M('x > 0')})</p></div><div class="exemple"><div class="etq">Ejemplos resueltos</div><ul class="ll"><li>${M('log<sub>2</sub> 8 = 3')} porque ${M('2<sup>3</sup> = 8')}</li><li>${M('log<sub>10</sub> 1000 = 3')} (${M('log')} sin base significa base 10)</li><li>${M('log<sub>3</sub> '+F(1,9)+' = −2')} porque ${M('3<sup>−2</sup> = 1/9')}</li><li>${M('log<sub>5</sub> 1 = 0')} (siempre: ${M('a<sup>0</sup> = 1')}) y ${M('log<sub>5</sub> 5 = 1')}</li></ul></div><div class="perque"><div class="etq">Propiedades útiles</div><ul class="ll"><li>${M('log(A·B) = log A + log B')}</li><li>${M('log(A/B) = log A − log B')}</li><li>${M('log(A<sup>n</sup>) = n · log A')}</li></ul><p>Con la última se resuelven ecuaciones como ${M('2<sup>x</sup> = 50')}: ${M('x = log 50 / log 2 ≈ 5,64')}.</p></div>`)},
{tit:t('La funció logarítmica','La función logarítmica'),html:t(`<p>${M('y = log<sub>a</sub> x')} és la funció <b>inversa</b> de ${M('y = a<sup>x</sup>')}: desfà el que fa l'exponencial. Les seues gràfiques són <b>simètriques</b> respecte de la recta ${M('y = x')}.</p><div class="clau"><div class="etq">Propietats de y = logₐ x</div><ul class="ll"><li>${M('Dom = (0, +∞)')}: només existeix per a ${M('x > 0')}.</li><li>${M('Im = ℝ')}.</li><li>Passa per ${M('(1, 0)')} i per ${M('(a, 1)')}.</li><li>Asímptota <b>vertical</b> ${M('x = 0')}.</li><li>${M('a > 1')}: creixent (però cada vegada més a poc a poc). ${M('0 < a < 1')}: decreixent.</li></ul></div><div class="fig">${plot({xr:[-3,7],yr:[-3,7],w:280,h:260,fns:[{f:x=>2**x,col:'#c8412f'},{f:x=>Math.log2(x),d:[0.001,7]},{f:x=>x,col:'#9aa3ad',w:1.5,dash:1}],pts:[{x:1,y:0,l:'(1, 0)',dy:16},{x:0,y:1,l:'(0, 1)',col:'#c8412f',dx:-44}],txt:[{x:2.2,y:6.3,t:'y = 2ˣ',col:'#c8412f'},{x:5.6,y:3.4,t:'y = log₂x',col:'#2c5f9e'},{x:6,y:6.6,t:'y = x',col:'#5d6b7a'}]})}</div><div class="exemple"><div class="etq">Exemple resolt: domini</div><p>${M('f(x) = log(x − 3)')}: cal ${M('x − 3 > 0')} → ${M('x > 3')} → ${M('Dom = (3, +∞)')} (parèntesi: el 3 no s'inclou, perquè log 0 no existeix).</p></div>`,`<p>${M('y = log<sub>a</sub> x')} es la función <b>inversa</b> de ${M('y = a<sup>x</sup>')}: deshace lo que hace la exponencial. Sus gráficas son <b>simétricas</b> respecto de la recta ${M('y = x')}.</p><div class="clau"><div class="etq">Propiedades de y = logₐ x</div><ul class="ll"><li>${M('Dom = (0, +∞)')}: solo existe para ${M('x > 0')}.</li><li>${M('Im = ℝ')}.</li><li>Pasa por ${M('(1, 0)')} y por ${M('(a, 1)')}.</li><li>Asíntota <b>vertical</b> ${M('x = 0')}.</li><li>${M('a > 1')}: creciente (pero cada vez más despacio). ${M('0 < a < 1')}: decreciente.</li></ul></div><div class="fig">${plot({xr:[-3,7],yr:[-3,7],w:280,h:260,fns:[{f:x=>2**x,col:'#c8412f'},{f:x=>Math.log2(x),d:[0.001,7]},{f:x=>x,col:'#9aa3ad',w:1.5,dash:1}],pts:[{x:1,y:0,l:'(1, function zig(){const up=pick([true,false]);const t1=R(-3,-1),t2=R(1,3);const y0=R(-2,2);const d1=R(2,4),d2=R(3,6),d3=R(2,4);const s=up?1:-1;
const P=[[-5,y0],[t1,y0+s*d1],[t2,y0+s*(d1-d2)],[5,y0+s*(d1-d2+d3)]];return {up,t1,t2,P}}
function ptsHist(){const v1=pick([2,3,4]),t1=R(2,4),pa=R(1,3),v3=pick([1,2]);const t2=t1+pa;const d1=v1*t1;const t3=t2+Math.min(Math.floor(d1/v3),10-t2);const d3=d1-v3*(t3-t2);return {P:[[0,0],[t1,d1],[t2,d1],[t3,d3]],v1,t1,pa,t2,t3,v3,d1,d3}}
BLOCS.push({id:'propietats',ic:'TVM',
nom:()=>t('6. Llegir gràfiques i TVM','6. Leer gráficas y TVM'),
sub:()=>t('Creixement, màxims i mínims, continuïtat, simetria i taxa de variació mitjana','Crecimiento, máximos y mínimos, continuidad, simetría y tasa de variación media'),
serveix:()=>t(`<p><b>Què és?</b> Les eines per a <b>llegir</b> qualsevol gràfica: on puja i on baixa, on arriba al màxim, si fa bots, i a quina velocitat canvia (la <b>taxa de variació mitjana</b>).</p><p><b>Per a què serveix?</b> Per a entendre les gràfiques de les notícies, del pulsòmetre o de l'app que mesura la velocitat del teu servei. La TVM és la «velocitat mitjana» de qualsevol cosa: km per hora, euros per mes, punts per partit.</p>`,`<p><b>¿Qué es?</b> Las herramientas para <b>leer</b> cualquier gráfica: dónde sube y dónde baja, dónde llega al máximo, si da saltos, y a qué velocidad cambia (la <b>tasa de variación media</b>).</p><p><b>¿Para qué sirve?</b> Para entender las gráficas de las noticias, del pulsómetro o de la app que mide la velocidad de tu saque. La TVM es la «velocidad media» de cualquier cosa: km por hora, euros por mes, puntos por partido.</p>`),
curiositat:()=>t('La TVM quan l\'interval es fa molt, molt xicotet és la «velocitat instantània». És la idea de la derivada, que estudiaràs en Batxillerat i que Newton va inventar per a explicar el moviment dels planetes.','La TVM cuando el intervalo se hace muy, muy pequeño es la «velocidad instantánea». Es la idea de la derivada, que estudiarás en Bachillerato y que Newton inventó para explicar el movimiento de los planetas.'),
teoria:()=>[
{tit:t('Creixement i decreixement','Crecimiento y decrecimiento'),html:t(`<p>Les gràfiques es lligen <b>d'esquerra a dreta</b>, com un text.</p><ul class="ll"><li><b>Creixent</b> en un interval: en avançar x, y <b>puja</b>.</li><li><b>Decreixent</b>: en avançar x, y <b>baixa</b>.</li><li><b>Constant</b>: y no canvia (tram horitzontal).</li></ul><div class="clau"><div class="etq">Màxims i mínims</div><ul class="ll"><li><b>Màxim relatiu</b>: punt on la funció passa de créixer a decréixer (un cim).</li><li><b>Mínim relatiu</b>: passa de decréixer a créixer (una vall).</li><li><b>Absolut</b>: el més alt (o més baix) de <b>tota</b> la gràfica.</li></ul></div><div class="exemple"><div class="etq">Exemple resolt</div><div class="fig">${plot({xr:[-5,5],yr:[-4,5],w:280,h:220,poly:[{pts:[[-5,-2],[-2,3],[2,-3],[5,1]]}],pts:[{x:-2,y:3,l:'(−2, 3)'},{x:2,y:-3,l:'(2, −3)',dy:18}]})}</div><ol class="passos"><li>Creixent en ${M('(−5, −2) ∪ (2, 5)')}</li><li>Decreixent en ${M('(−2, 2)')}</li><li>Màxim relatiu en ${M('(−2, 3)')}; mínim relatiu en ${M('(2, −3)')}</li></ol><p><b>Ull!</b> Els intervals de creixement es donen amb les <b>x</b> (on), no amb les y. I s'escriuen amb parèntesis.</p></div>`,`<p>Las gráficas se leen <b>de izquierda a derecha</b>, como un texto.</p><ul class="ll"><li><b>Creciente</b> en un intervalo: al avanzar x, y <b>sube</b>.</li><li><b>Decreciente</b>: al avanzar x, y <b>baja</b>.</li><li><b>Constante</b>: y no cambia (tramo horizontal).</li></ul><div class="clau"><div class="etq">Máximos y mínimos</div><ul class="ll"><li><b>Máximo relativo</b>: punto donde la función pasa de crecer a decrecer (una cima).</li><li><b>Mínimo relativo</b>: pasa de decrecer a crecer (un valle).</li><li><b>Absoluto</b>: el más alto (o más bajo) de <b>toda</b> la gráfica.</li></ul></div><div class="exemple"><div class="etq">Ejemplo resuelto</div><div class="fig">${plot({xr:[-5,5],yr:[-4,5],w:280,h:220,poly:[{pts:[[-5,-2],[-2,3],[2,-3],[5,1]]}],pts:[{x:-2,y:3,l:'(−2, 3)'},{x:2,y:-3,l:'(2, −3)',dy:18}]})}</div><ol class="passos"><li>Creciente en ${M('(−5, −2) ∪ (2, 5)')}</li><li>Decreciente en ${M('(−2, 2)')}</li><li>Máximo relativo en ${M('(−2, 3)')}; mínimo relativo en ${M('(2, −3)')}</li></ol><p><b>¡Ojo!</b> Los intervalos de crecimiento se dan con las <b>x</b> (dónde), no con las y. Y se escriben con paréntesis.</p></div>`)},
{tit:t('Continuïtat','Continuidad'),html:t(`<p>Una funció és <b>contínua</b> si es pot dibuixar <b>sense alçar el llapis</b>. Si en algun punt cal alçar-lo, hi ha una <b>discontinuïtat</b>:</p><ul class="ll"><li><b>De salt</b>: la gràfica bota d'una altura a una altra (com les tarifes per trams).</li><li><b>Evitable</b>: falta un sol punt (un forat).</li><li><b>Asimptòtica</b>: la funció se'n va a l'infinit (com ${M('1/x')} en ${M('x = 0')}).</li></ul><div class="exemple"><div class="etq">Exemple: aparcament del club</div><p>La primera hora costa 2 €; fins a 3 hores, 5 €; més de 3 hores, 7 €. La gràfica fa <b>salts</b> en ${M('x = 1')} i ${M('x = 3')}: és discontínua en eixos punts.</p><div class="fig">${plot({xr:[0,5],yr:[0,8],w:260,h:200,lx:'h',ly:'€',poly:[{pts:[[0,2],[1,2]]},{pts:[[1,5],[3,5]]},{pts:[[3,7],[5,7]]}],pts:[{x:1,y:2,col:'#2c5f9e'},{x:1,y:5,open:1,col:'#2c5f9e'},{x:3,y:5,col:'#2c5f9e'},{x:3,y:7,open:1,col:'#2c5f9e'},{x:0,y:2,open:1,col:'#2c5f9e'}]})}</div><p>Punt ple ● = el valor sí que s'inclou; punt buit ○ = no s'inclou.</p></div>`,`<p>Una función es <b>continua</b> si se puede dibujar <b>sin levantar el lápiz</b>. Si en algún punto hay que levantarlo, hay una <b>discontinuidad</b>:</p><ul class="ll"><li><b>De salto</b>: la gráfica salta de una altura a otra (como las tarifas por tramos).</li><li><b>Evitable</b>: falta un solo punto (un agujero).</li><li><b>Asintótica</b>: la función se va al infinito (como ${M('1/x')} en ${M('x = 0')}).</li></ul><div class="exemple"><div class="etq">Ejemplo: aparcamiento del club</div><p>La primera hora cuesta 2 €; hasta 3 horas, 5 €; más de 3 horas, 7 €. La gráfica da <b>saltos</b> en ${M('x = 1')} y ${M('x = 3')}: es discontinua en esos puntos.</p><div class="fig">${plot({xr:[0,5],yr:[0,8],w:260,h:200,lx:'h',ly:'€',poly:[{pts:[[0,2],[1,2]]},{pts:[[1,5],[3,5]]},{pts:[[3,7],[5,7]]}],pts:[{x:1,y:2,col:'#2c5f9e'},{x:1,y:5,open:1,col:'#2c5f9e'},{x:3,y:5,col:'#2c5f9e'},{x:3,y:7,open:1,col:'#2c5f9e'},{x:0,y:2,open:1,col:'#2c5f9e'}]})}</div><p>Punto lleno ● = el valor sí se incluye; punto hueco ○ = no se incluye.</p></div>`)},
{tit:t('Taxa de variació mitjana (TVM)','Tasa de variación media (TVM)'),html:t(`<div class="clau"><div class="etq">Definició</div><p style="text-align:center">${M('TVM[a, b] = '+F('f(b) − f(a)','b − a'))}</p><p>És <b>quant canvia y per cada unitat de x</b>, de mitjana, entre ${M('a')} i ${M('b')}. Geomètricament, és el <b>pendent</b> de la recta que uneix els dos punts de la gràfica.</p></div><div class="exemple"><div class="etq">Exemple resolt 1</div><p>${M('f(x) = x<sup>2</sup>')}. Calcula ${M('TVM[1, 3]')}.</p><ol class="passos"><li>${M('f(3) = 9')}, ${M('f(1) = 1')}</li><li>${M('TVM = '+F('9 − 1','3 − 1')+' = '+F('8','2')+' = 4')}</li><li>Entre x = 1 i x = 3, la funció puja 4 unitats per cada unitat de x.</li></ol><div class="fig">${plot({xr:[-1,4],yr:[-1,10],w:240,h:220,fns:[{f:x=>x*x},{f:x=>4*x-3,col:'#c8412f',w:2,dash:1}],pts:[{x:1,y:1,l:'(1, 1)'},{x:3,y:9,l:'(3, 9)',dx:-46}]})}</div></div><div class="exemple"><div class="etq">Exemple resolt 2: velocitat mitjana</div><p>Un jugador ha corregut 12 m en els primers 4 s. ${M('TVM[0, 4] = 12/4 = 3')} m/s: la seua <b>velocitat mitjana</b>.</p></div><div class="perque"><div class="etq">Signe</div><p>TVM positiva: la funció ha pujat (de mitjana). Negativa: ha baixat. Zero: ha acabat a la mateixa altura.</p></div>`,`<div class="clau"><div class="etq">Definición</div><p style="text-align:center">${M('TVM[a, b] = '+F('f(b) − f(a)','b − a'))}</p><p>Es <b>cuánto cambia y por cada unidad de x</b>, en promedio, entre ${M('a')} y ${M('b')}. Geométricamente, es la <b>pendiente</b> de la recta que une los dos puntos de la gráfica.</p></div><div class="exemple"><div class="etq">Ejemplo resuelto 1</div><p>${M('f(x) = x<sup>2</sup>')}. Calcula ${M('TVM[1, 3]')}.</p><ol class="passos"><li>${M('f(3) = 9')}, ${M('f(1) = 1')}</li><li>${M('TVM = '+F('9 − 1','3 − 1')+' = '+F('8','2')+' = 4')}</li><li>Entre x = 1 y x = 3, la función sube 4 unidades por cada unidad de x.</li></ol><div class="fig">${plot({xr:[-1,4],yr:[-1,10],w:240,h:220
